// Guarda un snapshot de los stats de un peleador tras cada evento en que participa
function saveStatSnapshot(fighter, eventDate, eventName){
  if(!STATE.statsHistory) STATE.statsHistory={};
  if(!STATE.statsHistory[fighter.id]) STATE.statsHistory[fighter.id]=[];
  const history = STATE.statsHistory[fighter.id];
  // Solo guardar si algo cambió (o es el primero)
  const last = history[history.length-1];
  const snap = {...fighter.stats};
  if(!last || STAT_KEYS.some(([k])=>last.stats[k]!==snap[k])){
    history.push({date:eventDate, evName:eventName||'?', stats:snap, general:generalScore(fighter)});
    if(history.length>30) history.shift();
  }
}

/* ====================== HITOS ====================== */
function checkMilestones(fighter, ev){
  // Only fire milestones based on in-game progress, not initial state
  const completedSoFar = STATE.events.filter(e=>e.status==='completed').length;
  if(completedSoFar === 0) return;
  if(!STATE.milestonesReached) STATE.milestonesReached=[];
  // Convert to Set for fast lookup, works even when loaded from JSON (array)
  const reached = new Set(Array.isArray(STATE.milestonesReached)?STATE.milestonesReached:[...STATE.milestonesReached]);
  const key=(name,id)=>`${name}_${id}`;
  const reach=(k,msg,icon,color,repDelta,repTarget)=>{
    if(!reached.has(k)){
      reached.add(k);
      STATE.milestonesReached=Array.from(reached);
      richToast(msg,icon,color,5000);
      logEvent(`🏅 HITO: ${msg}`);
      if(repDelta) updateReputation(repTarget||fighter, repDelta); // los hitos también dan fama, no solo prestigio
    }
  };
  const ufcW=fighter.record.ufcWins||0, momentum=fighter.momentum||0;
  // Hito: 10, 15, 20 victorias UFC
  [[10,3],[15,4],[20,5]].forEach(([n,rep])=>{ if(ufcW>=n) reach(key(`ufc${n}wins`,fighter.id),`${fName(fighter)} alcanza ${n} victorias en la UFC`,'🎯','#d4af37',rep); });
  // Hito: racha de 5+
  if(momentum>=5) reach(key(`streak5`,fighter.id),`${fName(fighter)} lleva 5 victorias consecutivas — ¡imparable!`,'🔥','#ff6d00',4);
  if(momentum>=10) reach(key(`streak10`,fighter.id),`${fName(fighter)} lleva 10 victorias seguidas — histórico`,'💫','#ffd600',8);
  // Hito: invicto en UFC con 10+ peleas
  if(fighter.record.ufcLosses===0 && ufcW>=10) reach(key('ufc_unbeaten10',fighter.id),`${fName(fighter)} sigue INVICTO con ${ufcW} victorias en UFC`,'⚡','#69f0ae',6);
  // Hito: primer campeón de dos pesos en la liga
  const twoDiv=(fighter.titleReigns||[]).map(r=>STATE.titles.find(t=>t.id===r.titleId)?.divisionId||r.divisionId).filter(Boolean);
  if(new Set(twoDiv).size>=2) reach(key('twoweight',fighter.id),`${fName(fighter)} se convierte en campeón de dos pesos`,'👑','#d4af37',10);
  // Hito: 5 defensas en un único reinado
  const maxDef=Math.max(0,...(fighter.titleReigns||[]).map(r=>r.defenses||0));
  if(maxDef>=5) reach(key('def5',fighter.id),`${fName(fighter)} llega a 5 defensas consecutivas`,'🛡️','#64b5f6',5);
  if(maxDef>=10) reach(key('def10',fighter.id),`${fName(fighter)} realiza 10 defensas — récord histórico`,'🏆','#ffd600',8);
  // Hito global: nuevo récord de KO más rápido
  const R=STATE.records||{};
  if(R.fastestKO){
    const prev=STATE._prevFastestKO;
    if(!prev||R.fastestKO.secs<prev) {
      if(prev) reach(`fastko_${ev?.id||'?'}`,`Nuevo récord: KO más rápido de la liga — ${R.fastestKO.secs}s`,'💥','#ef5350',6,STATE.fighters.find(x=>x.id===R.fastestKO.fighterId));
      STATE._prevFastestKO=R.fastestKO.secs;
    }
  }
}

/* ====================== 1. EVOLUCIÓN DE ATRIBUTOS ====================== */
// Mejora hasta los 33, estable 33–36, deterioro a partir de los 36.
function evolveAttributes(eventDate){
  if(STATE.meta.fantasyFreezeStats) return; // Opciones de Fantasía: nivel bloqueado
  STATE.fighters.forEach(f=>{
    if(f.status==='retired') return;
    const age = ageFromDob(f.dob, eventDate);
    if(age < 33){
      // Mejora gradual: +0 a +2 en un atributo aleatorio
      if(Math.random() < 0.55){
        const k=pick(STAT_KEYS)[0];
        f.stats[k]=clamp((f.stats[k]||70)+randi(0,2),1,99);
      }
    } else if(age <= 36){
      // Estable: muy pequeños cambios (+0/-1), raro
      if(Math.random() < 0.15){
        const k=pick(STAT_KEYS)[0];
        f.stats[k]=clamp((f.stats[k]||70)-1,1,99);
      }
    } else {
      // Deterioro más suave y progresivo — −1 por evento con probabilidad creciente por edad
      const decayProb = age>=42 ? 0.75 : age>=40 ? 0.60 : age>=38 ? 0.45 : age>=37 ? 0.30 : 0.18;
      if(Math.random() < decayProb){
        const decay = age>=42 ? randi(1,3) : age>=40 ? randi(1,2) : 1;
        const k=pick(STAT_KEYS)[0];
        f.stats[k]=clamp((f.stats[k]||70)-decay,1,99);
      }
      // Segundo atributo solo a partir de 41 con baja probabilidad
      if(age>=41 && Math.random()<0.30){
        const k2=pick(STAT_KEYS)[0];
        f.stats[k2]=clamp((f.stats[k2]||70)-1,1,99);
      }
    }
  });
}

/* ====================== 5. RIVALIDADES ====================== */
function rivalryKey(idA,idB){ return [idA,idB].sort().join('_'); }
function updateRivalry(idA,idB,date){
  const k=rivalryKey(idA,idB);
  if(!STATE.rivalries) STATE.rivalries={};
  const [sA,sB]=[idA,idB].sort();
  const fights=(STATE.rivalries[k]?.fights||0)+1;
  // Expectación (0-100): crece con cada combate entre ellos, más deprisa cuanto más famosos son
  // los dos peleadores — una rivalidad entre dos estrellas engancha más que entre dos prelims.
  const fA=STATE.fighters.find(x=>x.id===sA), fB=STATE.fighters.find(x=>x.id===sB);
  const fameFactor = fA&&fB ? ((fA.reputation??50)+(fB.reputation??50))/100 : 1;
  const gain = (8+fights*2)*fameFactor;
  const hype = Math.round(Math.min(100, (STATE.rivalries[k]?.hype||0)+gain));
  STATE.rivalries[k]={ fights, lastDate:date, idA:sA, idB:sB, hype };
}
function getRivalryFights(idA,idB){
  return STATE.rivalries?.[rivalryKey(idA,idB)]?.fights || 0;
}
function isRival(idA,idB){ return getRivalryFights(idA,idB)>=1; }
// Los IDs de peleador siempre tienen forma "F_xxxxxxx" (un solo guion bajo). Las rivalidades
// creadas antes de que la clave guardara idA/idB explícitamente pueden reconstruirse partiendo
// la clave combinada en sus dos mitades, para que el Editor pueda mostrarlas con nombre.
function rivalryIdsFromKey(key, riv){
  if(riv?.idA && riv?.idB) return [riv.idA, riv.idB];
  const parts=key.split('_');
  if(parts.length!==4) return [null,null];
  return [parts[0]+'_'+parts[1], parts[2]+'_'+parts[3]];
}

function generateResultNews(fight, winner, loser, result, ev, revengeRequested){
  if(!STATE.newsLog) STATE.newsLog=[];

  if(fight.titleId){
    const newReign=(winner.titleReigns||[]).some(r=>r.titleId===fight.titleId && r.wonDate===ev.date && !!r.isInterim===!!fight.isInterim);

    }
  }
  if(revengeRequested){
    candidates.push({p:90, msg:`📣 Tras perder ante ${fName(winner)}, ${fName(loser)} pide la revancha en ${fName(ev)}.`});
  } else if(fight.isCallout){
    candidates.push({p:70, msg:`📣 ${fName(winner)} responde al callout y vence a ${fName(loser)} en ${fName(ev)}.`});
  }
  const gap=(loser.rankScore||0)-(winner.rankScore||0);
  if(gap>=15){
    candidates.push({p:80, msg:`😱 Sorpresa en ${fName(ev)}: ${fName(winner)} da la campanada ante ${fName(loser)}, muy por delante en el papel.`});
  }
  if(result.method!=='Decisión' && result.round===1){
    candidates.push({p:60, msg:`💥 ${fName(winner)} despacha a ${fName(loser)} en el primer asalto — entrada arrolladora en ${fName(ev)}.`});
  }
  const rivalryCount=getRivalryFights(fight.fighterA,fight.fighterB);
  if(rivalryCount>=3){
    candidates.push({p:55, msg:`⚔️ ${fName(winner)} y ${fName(loser)} ya suman ${rivalryCount} combates entre ellos — una de las rivalidades más largas de la liga.`});
  }

    candidates.push({p:40, msg:`🔥 ${fName(winner)} encadena ${streak} victorias seguidas tras vencer a ${fName(loser)} en ${fName(ev)}.`});
  }
  if(!candidates.length) return;
  candidates.sort((a,b)=>b.p-a.p);
  STATE.newsLog.unshift({date:ev.date, msg:candidates[0].msg});
  if(STATE.newsLog.length>100) STATE.newsLog.length=100;
}

/* ====================== CALLOUTS ====================== */
// Un peleador activo reta narrativamente a otro de su categoría — presión de matchmaking,
// no altera stats. Si lo bookeas antes de que expire, se resuelve solo; si no, se olvida.
function generateCallouts(eventDate){
  if(!STATE.callouts) STATE.callouts=[];
  if(Math.random()>0.5) return; // no siempre hay callout nuevo
  // Ambos deben poder reservarse YA (mismo criterio que el selector de matchmaking,
  // fighterAvailable) — si no, el jugador vería el callout pero no podría bookearlo.
  const active = STATE.fighters.filter(fighterAvailable);
  const caller = pick(active); if(!caller) return;
  const already = STATE.callouts.some(c=>c.callerId===caller.id||c.targetId===caller.id);
  if(already) return;
  const pool = active.filter(f=>f.id!==caller.id && f.division===caller.division);
  if(!pool.length) return;
  // Prioriza retar a alguien mejor rankeado (más dramático) o a un rival si existe
  const rival = pool.find(f=>isRival(caller.id,f.id));
  const higherRanked = pool.filter(f=>(f.rankScore||0)>=(caller.rankScore||0)).sort((a,b)=>(a.rankScore||0)-(b.rankScore||0));
  const target = rival || higherRanked[0] || pick(pool);
  STATE.callouts.push({id:uid('CO'), callerId:caller.id, targetId:target.id, divisionId:caller.division, eventSeqIssued:STATE.meta.eventSeq});
  logEvent(`📣 ${fName(caller)} reta a ${fName(target)}: "¡Te quiero a ti a continuación!"`);
  if(STATE.callouts.length>20) STATE.callouts.shift();
}
// Elimina callouts ya viejos (4+ eventos sin bookearse) sin penalización — simplemente se olvidan.
// Mientras alguno de los dos no esté disponible (lesión, sanción, cooldown entre peleas) el
// reloj se pausa: no sería justo que un callout caduque solo porque el jugador estaba esperando
// a que el peleador se recuperase. Si alguno se retira o ya no existe, se descarta directamente
// (ese callout ya no se puede cumplir nunca).
function expireStaleCallouts(){
  if(!STATE.callouts) return;
  STATE.callouts = STATE.callouts.filter(c=>{
    const caller=STATE.fighters.find(f=>f.id===c.callerId), target=STATE.fighters.find(f=>f.id===c.targetId);
    if(!caller||!target||caller.status==='retired'||target.status==='retired') return false;
    if(!fighterAvailable(caller)||!fighterAvailable(target)){
      c.eventSeqIssued = STATE.meta.eventSeq; // pausa la cuenta atrás mientras espera
      return true;
    }
    return STATE.meta.eventSeq-(c.eventSeqIssued||0)<4;
  });
}
// Si acabas de emparejar exactamente el callout pendiente, se marca como resuelto
function resolveCalloutIfMatched(fAId, fBId){
  if(!STATE.callouts) return;
  STATE.callouts = STATE.callouts.filter(c=>!((c.callerId===fAId&&c.targetId===fBId)||(c.callerId===fBId&&c.targetId===fAId)));
}

/* ====================== 4. PRESIÓN DE DEFENSAS DE TÍTULO ====================== */
// Devuelve avisos de posibles interinos para mostrar al usuario tras un evento
function checkTitleDefensePressure(eventDate){
  const alerts=[];
  STATE.titles.forEach(title=>{
    if(!title.holderId) return;
    const champ=STATE.fighters.find(f=>f.id===title.holderId);
    if(!champ) return;
    const lastFight = champ.lastEventSeq!=null?
      STATE.events.find(e=>e.seq===champ.lastEventSeq&&e.status==='completed')?.date : null;
    // Si no hay pelea simulada por el motor (campeón ya lo era al empezar la partida),
    // usar la fecha en la que ganó su reinado actual — nunca inventar "999 días" sin dato real.
    const currentReign = lastFight? null : (champ.titleReigns||[]).find(r=>r.titleId===title.id && !r.lostDate);
    const referenceDate = lastFight || currentReign?.wonDate || null;
    const injured = champ.status==='injured';
    const daysSince = referenceDate? Math.round((new Date(eventDate)-new Date(referenceDate))/86400000) : null;
    const longInjury = injured && champ.injury?.untilDate &&
      Math.round((new Date(champ.injury.untilDate)-new Date(eventDate))/86400000)>90;
    if((daysSince!=null && daysSince>270) || longInjury){
      alerts.push({title, champ, daysSince, longInjury});
    }
  });
  return alerts;
}

// Genera estadísticas coherentes para un peleador de nivel bajo-medio (recién llegado a la UFC)
function generateFighterStats(divId){
  const base=()=>randi(60,85);
  const spike=()=>randi(75,92);
  // Perfil aleatorio: striker, grappler, o mixto
  const profile=randi(0,2);
  if(profile===0) // striker
    return {power:spike(),striking:spike(),wrestlingOff:base()-10,wrestlingDef:base()-5,ground:base()-10,cardio:base(),chin:base()};
  if(profile===1) // grappler
    return {power:base()-5,striking:base()-5,wrestlingOff:spike(),wrestlingDef:spike(),ground:spike(),cardio:base(),chin:base()};
  return {power:base(),striking:base(),wrestlingOff:base(),wrestlingDef:base(),ground:base(),cardio:base(),chin:base()};
}

function ufcWinsOf(f){ return f.record.ufcWins!=null? f.record.ufcWins : f.record.wins; }
function ufcLossesOf(f){ return f.record.ufcLosses!=null? f.record.ufcLosses : f.record.losses; }
function ufcKoWinsOf(f){ return f.record.ufcKoWins!=null? f.record.ufcKoWins : f.record.koWins; }
function ufcSubWinsOf(f){ return f.record.ufcSubWins!=null? f.record.ufcSubWins : f.record.subWins; }
function ufcDecWinsOf(f){ return f.record.ufcDecWins!=null? f.record.ufcDecWins : f.record.decWins; }
// Divisiones distintas en las que el peleador ha sido campeón (para valorar campeones multi-división)
function titleDivisionsCount(f){
  const divs = new Set();
  (f.titleReigns||[]).forEach(r=>{
    const t = STATE.titles.find(x=>x.id===r.titleId);
    if(t && t.divisionId) divs.add(t.divisionId);
  });
  return divs.size;
}
function totalDefenses(f){ return (f.titleReigns||[]).reduce((a,t)=>a+(t.defenses||0),0); }
function totalReignsCount(f){ return (f.titleReigns||[]).length; }

function computeBaseScore(f){
  const r=f.record;
  const wins = ufcWinsOf(f);
  const losses = ufcLossesOf(f);
  let score = wins*2.4 - losses*1.5 + ufcKoWinsOf(f)*0.5 + ufcSubWinsOf(f)*0.5 + f.bonuses.performanceOfNight*0.8 + f.bonuses.fightOfNight*0.5;
  if(isChampion(f.id)) score += 18;
  if(isInterimChampion(f.id)) score += 10;
  score += totalDefenses(f)*4;
  score += totalReignsCount(f)*5;
  const multiDiv = titleDivisionsCount(f);
  if(multiDiv>1) score += (multiDiv-1)*25; // bonus extra por ser campeón en más de un peso
  // penalizar inactividad
  const inactivity = f.lastEventSeq!=null? (STATE.meta.eventSeq - f.lastEventSeq) : 2;
  score -= inactivity*0.4;
  return score;
}
function isChampion(fid){ return STATE.titles.some(t=>t.holderId===fid); }
function isInterimChampion(fid){ return STATE.titles.some(t=>t.interimHolderId===fid); }
// Icono según importancia del título: los títulos "minor" (tipo BMF) usan un icono distinto a un campeonato indiscutido real
function titleIcon(t){ return (t && t.kind==='minor') ? '🥉' : '🏆'; }
function championBadge(fid){
  const t = STATE.titles.find(x=>x.holderId===fid);
  if(t) return ' '+titleIcon(t);
  const ti = STATE.titles.find(x=>x.interimHolderId===fid);
  if(ti) return ' 🥈';
  return '';
}

function generalScore(f){

  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

// Flecha de tendencia (↑/↓) según la progresión reciente del nivel general (STATE.statsHistory)
function fighterTrend(f){
  const hist = STATE.statsHistory?.[f.id];
  if(!hist || hist.length<2) return '';
  const cur = hist[hist.length-1].general;
  const prev = hist[Math.max(0,hist.length-4)].general;
  const delta = cur-prev;
  if(delta>=2) return ` <span style="color:#69f0ae;font-size:.72rem" title="Subiendo (+${delta})">▲</span>`;
  if(delta<=-2) return ` <span style="color:#ef5350;font-size:.72rem" title="Bajando (${delta})">▼</span>`;
  return '';
}

// Últimos N combates resueltos de un peleador (más reciente primero), con su rival y si ganó
function recentResolvedFights(f, n){
  const history = [...(f.fightHistory||[])].reverse();
  const out=[];
  for(const fid of history){
    if(out.length>=n) break;
    let found=null, foundEv=null;
    for(const ev of STATE.events){ const ft=ev.card.find(x=>x.id===fid); if(ft&&ft.result){found=ft;foundEv=ev;break;} }
    if(!found) continue;
    const oppId = found.result.winnerId===f.id? found.result.loserId : found.result.winnerId;
    const opp = STATE.fighters.find(x=>x.id===oppId);
    if(!opp) continue;
    out.push({opp, won: found.result.winnerId===f.id, date: foundEv? foundEv.date : null});
  }
  return out;
}

// Ajuste por "calidad de rival" en combates recientes (estilo ranking real de la UFC):
// vencer a alguien mejor valorado que tú te adelanta en la clasificación; perder contra alguien peor valorado te penaliza más.
// Solo afecta a P4P / categoría (no al GOAT histórico). Se ponderan los últimos 5 combates, dando más peso al más reciente.
const FORM_WEIGHTS = [1.0, 0.7, 0.5, 0.35, 0.25];
function qualityAdjustment(f, baseMap){
  const myBase = baseMap.get(f.id) ?? 0;
  const fights = recentResolvedFights(f, FORM_WEIGHTS.length);
  let adj = 0;
  fights.forEach((res, idx)=>{
    const w = FORM_WEIGHTS[idx] ?? 0.15;
    const oppBase = baseMap.get(res.opp.id) ?? 0;
    const diff = oppBase - myBase; // positivo = el rival estaba mejor valorado que tú
    if(res.won){
      adj += w * clamp(diff, 0, 60) * 0.9; // victoria de calidad: te adelanta
      if(diff<0) adj += w * 1.5; // ganar a cualquiera, aunque esté peor valorado, suma un poco
    } else {
      adj -= w * clamp(-diff, 0, 60) * 1.1; // perder contra alguien peor valorado duele mucho
      if(diff>0) adj -= w * 1.5; // perder, aunque sea contra alguien mejor, también resta un poco
    }
  });
  return adj;
}

function refreshRankings(){
  // Paso 1: puntuación base (récord UFC, títulos, defensas, multi-división, inactividad)
  STATE.fighters.forEach(f=> f._baseScore = computeBaseScore(f));
  const baseMap = new Map(STATE.fighters.map(f=>[f.id, f._baseScore]));
  // Paso 2: ajuste por calidad de rivales recientes (efecto "leapfrog" realista)
  STATE.fighters.forEach(f=>{
    f.rankScore = f._baseScore + qualityAdjustment(f, baseMap);
  });
}

function divisionTop15(divId){
  const divTitle  = STATE.titles.find(t=>t.divisionId===divId && !t.isInterim)||{};
  const champId   = divTitle.holderId;
  const interimId = divTitle.interimHolderId;
  return STATE.fighters.filter(f=>f.division===divId && f.status!=='retired')
    .sort((a,b)=>{
      if(a.id===champId)   return -1; // #1 siempre
      if(b.id===champId)   return  1;
      if(a.id===interimId) return -1; // #2 siempre
      if(b.id===interimId) return  1;
      const am=a.manualRankDivision, bm=b.manualRankDivision;
      if(am!=null && bm!=null) return am-bm;
      if(am!=null) return -1;
      if(bm!=null) return 1;
      return b.rankScore-a.rankScore;
    }).slice(0,15);
}
function p4pTop15(){
  // En P4P, todos los campeones activos tienen prioridad por delante del resto, luego sort por score
  return STATE.fighters.filter(f=>f.status==='active' || f.status==='injured')
    .sort((a,b)=>{
      const aChamp = isChampion(a.id)?1:0, bChamp = isChampion(b.id)?1:0;
      if(aChamp!==bChamp) return bChamp-aChamp; // campeones primero
      const am=a.manualRankP4P, bm=b.manualRankP4P;
      if(am!=null && bm!=null) return am-bm;
      if(am!=null) return -1;
      if(bm!=null) return 1;
      return b.rankScore-a.rankScore;
    }).slice(0,15);
}

// Se actualizan tras cada pelea simulada
function checkAndUpdateRecords(fA, fB, result, eventDate){
  const R = STATE.records = STATE.records || {};
  const w = result.winner, l = result.loser;
  // Defensa extra: un asalto dura como mucho 300s (5:00 es la parada médica entre asaltos, un
  // valor real y válido; por encima de eso es imposible) — se acota por si alguna otra vía
  // llegase a construir un result.time fuera de rango, no solo la que ya se corrigió en _simRound.
  const [rm,rs] = (result.time||'0:00').split(':').map(x=>parseInt(x)||0);
  const withinRound = Math.min(rm*60+rs, 300);
  const clampedTime = `${Math.floor(withinRound/60)}:${String(withinRound%60).padStart(2,'0')}`;
  const actualSecs = (result.round-1)*300 + withinRound;

  if(result.method==='KO/TKO'){
    if(!R.fastestKO || actualSecs < R.fastestKO.secs)
      R.fastestKO = {fighterId:w.id, secs:actualSecs, round:result.round, time:clampedTime, opponentId:l.id, date:eventDate};
    if(!R.latestKO || actualSecs > R.latestKO.secs)
      R.latestKO = {fighterId:w.id, secs:actualSecs, round:result.round, time:clampedTime, opponentId:l.id, date:eventDate};
  }
  if(result.method==='Sumisión'){
    if(!R.fastestSub || actualSecs < R.fastestSub.secs)
      R.fastestSub = {fighterId:w.id, secs:actualSecs, round:result.round, time:clampedTime, opponentId:l.id, date:eventDate};
    if(!R.latestSub || actualSecs > R.latestSub.secs)
      R.latestSub = {fighterId:w.id, secs:actualSecs, round:result.round, time:clampedTime, opponentId:l.id, date:eventDate};
  }
}
// Repara récords ya guardados con un tiempo dentro de asalto imposible (>5:00) — se quedaron así
// por el bug de _simRound ya corregido (el último intercambio de golpes podía alargar el asalto
// más de la cuenta antes de que el bucle se diera cuenta de que el tiempo ya se había agotado).
function sanitizeRecords(){
  const R = STATE.records; if(!R) return;
  ['fastestKO','fastestSub','latestKO','latestSub'].forEach(key=>{
    const rec = R[key]; if(!rec || !rec.time) return;
    const [m,s] = rec.time.split(':').map(x=>parseInt(x)||0);
    if(m*60+s>300){
      rec.time = '5:00';
      rec.secs = (rec.round-1)*300 + 300;
    }
  });
}
function fmtSecs(s){ if(s==null) return '—'; const m=Math.floor(s/60),sec=s%60; return `R${Math.floor(s/300)+1} ${m%5}:${String(sec).padStart(2,'0')}`; }

// ¿Es alguien el líder de una estadística UFC? Devuelve badges mejorados con posición exacta y registros de título
function fighterUFCRankings(f){
  const badges = [];
  const all = STATE.fighters;
  // Posición exacta en stats
  const statBadge=(sorted, label, icon, minPos=3)=>{
    const rank=sorted.findIndex(x=>x.id===f.id)+1;
    if(rank>=1 && rank<=minPos){
      const col=rank===1?'gold':'';
      badges.push(`<span class="pill ${col}">${icon} #${rank} ${label} UFC</span>`);
    }
  };
  statBadge(all.slice().sort((a,b)=>ufcKoWinsOf(b)-ufcKoWinsOf(a)),'KOs','🥊');
  statBadge(all.slice().sort((a,b)=>ufcSubWinsOf(b)-ufcSubWinsOf(a)),'Sumisiones','🤼');
  statBadge(all.slice().sort((a,b)=>(ufcKoWinsOf(b)+ufcSubWinsOf(b))-(ufcKoWinsOf(a)+ufcSubWinsOf(a))),'Finalizaciones','⚡');
  statBadge(all.slice().sort((a,b)=>ufcWinsOf(b)-ufcWinsOf(a)),'Victorias','🏅');
  statBadge(all.slice().sort((a,b)=>(b.bonuses?.fightOfNight||0)-(a.bonuses?.fightOfNight||0)),'FOTN','🌟',3);
  // Defensas totales
  const totalDefs=f=>(f.titleReigns||[]).reduce((s,r)=>s+(r.defenses||0),0);
  statBadge(all.slice().sort((a,b)=>totalDefs(b)-totalDefs(a)),'Defensas totales','🛡️',3);
  // Títulos ganados (reinados)
  const reigns=(f.titleReigns||[]);
  const indiscutidos=reigns.filter(r=>!r.isInterim);
  const interinos=reigns.filter(r=>r.isInterim);
  // Títulos ganados — separar indiscutidos de interinos
  const titleGroups={};
  reigns.forEach(r=>{
    const t=STATE.titles.find(x=>x.id===r.titleId);
    // Use stored titleName as fallback if title object was deleted (e.g. after unification)
    const tName=t?.name||r.titleName||(r.divisionId?`Cinturón de ${divName(r.divisionId)}`:null);
    if(!tName) return;
    const key=(t?.id||r.titleId)+'_'+(r.isInterim?'i':'f');
    if(!titleGroups[key]) titleGroups[key]={tName,count:0,defs:0,active:false,isInterim:r.isInterim};
    titleGroups[key].count++;
    titleGroups[key].defs+=(r.defenses||0);
    if(!r.lostDate) titleGroups[key].active=true;
  });
  Object.values(titleGroups).forEach(({tName,count,defs,active,isInterim})=>{
    const prefix=count>1?`x${count} `:'';
    const icon=isInterim?'🥈':'👑';
    const label=isInterim?'Interino':'';
    badges.push(`<span class="pill ${isInterim?'':'gold'}">${icon} ${prefix}${tName}${label?' ('+label+')':''}${active?' ⭐':''}</span>`);
    if(defs>0) badges.push(`<span class="pill">🛡️ ${defs} def.${isInterim?' (int.)':''}</span>`);
  });
  // POTN top 3
  statBadge(all.slice().sort((a,b)=>(b.bonuses?.performanceOfNight||0)-(a.bonuses?.performanceOfNight||0)),'POTN','⭐',3);
  // Récords especiales
  const R=STATE.records||{};
  if(R.fastestKO?.fighterId===f.id) badges.push(`<span class="pill gold">⚡ KO más rápido UFC (${fmtSecs(R.fastestKO.secs)})</span>`);
  if(R.fastestSub?.fighterId===f.id) badges.push(`<span class="pill gold">🤼 Sub más rápida UFC (${fmtSecs(R.fastestSub.secs)})</span>`);
  if(R.fastestTitleKO?.fighterId===f.id) badges.push(`<span class="pill gold">⚡ KO más rápido en pelea titular (${fmtSecs(R.fastestTitleKO.secs)})</span>`);
  if(R.fastestTitleSub?.fighterId===f.id) badges.push(`<span class="pill gold">🤼 Sub más rápida en pelea titular (${fmtSecs(R.fastestTitleSub.secs)})</span>`);
  if(R.longestStreak?.fighterId===f.id) badges.push(`<span class="pill gold">🔥 Racha más larga (${R.longestStreak.streak} vict.)</span>`);
  return badges.join(' ');
}

// GOAT bonus pequeño por ser record holder
function goatRecordBonus(f){
  const all = STATE.fighters;
  let bonus = 0;
  const ko = ufcKoWinsOf(f), sub = ufcSubWinsOf(f), fin = ko+sub;
  if(all.every(x=>ufcKoWinsOf(x)<=ko)) bonus += 4;      // más KOs de la UFC
  if(all.every(x=>ufcSubWinsOf(x)<=sub)) bonus += 4;    // más sumisiones
  if(all.every(x=>(ufcKoWinsOf(x)+ufcSubWinsOf(x))<=fin)) bonus += 3; // más finalizaciones
  return bonus;
}

/* ====================== GOAT SCORE ====================== */
// El GOAT score prioriza con fuerza ser campeón, las defensas, los reinados y el multi-división.
// Solo se usan las victorias y derrotas EN LA UFC (campo editable); el resto de la carrera no puntúa aquí.
// Un reinado o defensa INTERINA vale menos que uno indiscutido (cinturón real), porque históricamente
// el título interino es un escalón por debajo del campeonato indiscutido.
const INTERIM_WEIGHT = 0.5; // un reinado/defensa interino vale el 50% de uno indiscutido
function goatScore(f){
  const r=f.record;
  const reigns=(f.titleReigns||[]);
  const wins = ufcWinsOf(f);
  const losses = ufcLossesOf(f);
  const multiDiv = titleDivisionsCount(f);

  let weightedReigns = 0, weightedDefenses = 0, weightedTitleDays = 0;
  reigns.forEach(t=>{
    const w = t.isInterim? INTERIM_WEIGHT : 1;
    weightedReigns += w;
    weightedDefenses += (t.defenses||0) * w;
    const end = t.lostDate || STATE.meta.currentDate;
    const days = Math.max(0, (new Date(end)-new Date(t.wonDate))/(1000*3600*24));
    weightedTitleDays += days * w;
  });

  // Los premios ANUALES (Peleador/Pelea/KO/Sumisión/Actuación del Año) no contaban nada aquí —
  // solo los bonos por combate (POTN/FOTN de una noche concreta). Un Peleador del Año pesa casi
  // tanto como un reinado de título; los otros premios anuales, más que su equivalente nocturno.
  let score = wins*1.4 - losses*1.0 + ufcKoWinsOf(f)*0.4 + ufcSubWinsOf(f)*0.4 +
    weightedDefenses*12 + weightedReigns*14 + weightedTitleDays*0.02 +
    f.bonuses.performanceOfNight*1.2 + f.bonuses.fightOfNight*0.8 +
    (f.bonuses.fighterOfYear||0)*8 + (f.bonuses.fightOfYear||0)*3 + (f.bonuses.koOfYear||0)*3 +
    (f.bonuses.subOfYear||0)*3 + (f.bonuses.performanceOfYear||0)*3;
  if(multiDiv>1) score += (multiDiv-1)*25; // bonus por campeón en más de una categoría (valioso, pero no debe pesar más que defender el título muchas veces)
  // Sin haber sido campeón nunca (ni siquiera interino), el legado pesa mucho menos
  if(reigns.length===0) score *= 0.45;
  score += goatRecordBonus(f); // pequeño plus si lidera algún récord de la liga
  return Math.round(score);
}


/* ====================== EVENTOS / CARTELERA ====================== */
function fighterAvailable(f){
  if(f.status==='retired') return false;
  // Auto-clear expired suspensions
  if(f.status==='suspended'){
    if(f.suspension?.untilDate && new Date(f.suspension.untilDate) <= new Date(STATE.meta.currentDate)){
      f.suspension.active=false; f.status='active';
    } else return false;
  }
  // Auto-clear expired injuries
  if(f.status==='injured'){
    if(f.injury?.active && f.injury?.untilDate && new Date(f.injury.untilDate) <= new Date(STATE.meta.currentDate)){
      f.injury.active=false; f.status='active';
    } else if(f.status==='injured') return false;
  }
  // Cooldown: mínimo 90-150 días entre peleas (no eventos consecutivos)
  if(f.lastEventSeq!=null){
    const lastEv = STATE.events.filter(e=>e.status==='completed' && e.card.some(ft=>ft.fighterA===f.id||ft.fighterB===f.id)).sort((a,b)=>b.seq-a.seq)[0];
    if(lastEv){
      const daysSinceLast = (new Date(STATE.meta.currentDate) - new Date(lastEv.date)) / 86400000;
      const minDays = f.longevity > 60 ? 100 : (f.longevity > 30 ? 130 : 160);
      if(daysSinceLast < minDays) return false;
    }
  }
  return true;
}

function createEvent(name, date){
  const ev = {id:uid('E'), seq:STATE.meta.eventSeq, name, date, status:'scheduled', card:[]};
  STATE.events.push(ev);
  STATE.meta.eventSeq++;
  saveLocal();
  return ev;
}

function addFightToEvent(ev, fAId, fBId, titleId=null, isInterim=false, isMain=false, isContender=false){
  // El corte de peso ya no es una decisión manual: cada peleador lo elige por su cuenta
  // (autoWeightCutMode) justo antes de simularse el combate — ver checkMissWeight().
  // Si esta pareja tiene un callout pendiente, se marca ANTES de resolverlo (lo que sigue
  // borra la entrada de STATE.callouts), para que el combate recuerde que nació de un pique.
  const isCallout = (STATE.callouts||[]).some(c=>(c.callerId===fAId&&c.targetId===fBId)||(c.callerId===fBId&&c.targetId===fAId));
  ev.card.push({id:uid('FT'), fighterA:fAId, fighterB:fBId, titleId, isInterim, isMain, isContender, isCallout, weightCutA:null, weightCutB:null, result:null});
  resolveCalloutIfMatched(fAId, fBId);
}

/* ====================== LESIÓN DE ÚLTIMA HORA (PRE-EVENTO) ====================== */
// Justo antes de simular/jugar un evento programado, cada peleador de la cartelera tiene
// una pequeña probabilidad de lesionarse en el campamento. El jugador elige el sustituto
// (mismo división, activo, no ya reservado en el evento); si no hay ninguno disponible,
// el combate se cancela. Se excluye a los campeones (indiscutidos/interinos) para no
// complicar la lógica de título — sólo se lesionan/sustituyen retadores.
const PRE_EVENT_INJURY_PROB = 0.02;
function collectPreEventInjuries(ev){
  if(ev._injuriesChecked) return [];
  ev._injuriesChecked = true;
  const queue=[];
  ev.card.forEach(fight=>{
    if(fight.result) return;
    ['fighterA','fighterB'].forEach(side=>{
      const hurtId = fight[side];
      const hurt = STATE.fighters.find(x=>x.id===hurtId);
      if(!hurt || hurt.status!=='active') return;
      if(STATE.titles.some(t=>t.holderId===hurtId||t.interimHolderId===hurtId)) return; // los campeones no se lesionan aquí
      if(Math.random()>=PRE_EVENT_INJURY_PROB) return;
      queue.push({fight, side, hurtId});
    });
  });
  return queue;
}
// Pide confirmación al jugador antes de simular/jugar un evento: si hay lesiones de última
// hora, muestra un modal por cada una para elegir sustituto (o cancelar el combate si no
// hay ninguno disponible) antes de llamar a onDone().
function runPreEventInjuryCheck(ev, onDone){
  const queue = collectPreEventInjuries(ev);
  if(!queue.length){ onDone(); return; }
  // "Disponible" = no reservado en NINGÚN evento programado (no solo en este) — un peleador ya
  // apalabrado para otro cartel no puede meterse de sustituto de última hora en este.
  const bookedIds = new Set();
  STATE.events.filter(x=>x.status==='scheduled').forEach(otherEv=>{
    otherEv.card.forEach(ft=>{ bookedIds.add(ft.fighterA); bookedIds.add(ft.fighterB); });
  });

  function processNext(i){
    if(i>=queue.length){ saveLocal(); onDone(); return; }
    const {fight, side, hurtId} = queue[i];
    const hurt = STATE.fighters.find(x=>x.id===hurtId);
    if(!hurt || hurt.status!=='active' || fight[side]!==hurtId || !ev.card.includes(fight)){ processNext(i+1); return; }
    const oppId = fight[side==='fighterA'?'fighterB':'fighterA'];
    const opp = STATE.fighters.find(x=>x.id===oppId);
    // Disponible para la fecha del combate = activo (ni lesionado, ni sancionado, ni retirado),
    // sin compromiso en otro cartel, y con el MISMO descanso mínimo que exige fighterAvailable()
    // para cualquier pelea normal (90-160 días según longevidad) — un sustituto de última hora
    // no puede estar "disponible" bajo un criterio más laxo que el resto del roster.
    const candidates = STATE.fighters.filter(f=>{
      if(f.status!=='active' || f.id===hurtId || f.division!==hurt.division || bookedIds.has(f.id)) return false;
      if(f.injury?.active || f.suspension?.active) return false;
      // El campeón (o interino) de la división nunca entra como sustituto de última hora
      // de una pelea ajena — tiene sus propias obligaciones de título.
      if(STATE.titles.some(t=>t.holderId===f.id||t.interimHolderId===f.id)) return false;
      if(f.lastEventSeq!=null){
        const lastEv = STATE.events.find(e=>e.seq===f.lastEventSeq && e.status==='completed');
        if(lastEv){
          const daysSinceLast = (new Date(ev.date)-new Date(lastEv.date))/86400000;
          const minDays = f.longevity>60 ? 100 : (f.longevity>30 ? 130 : 160);
          if(daysSinceLast < minDays) return false;
        }
      }
      return true;
    }).sort((a,b)=>generalScore(b)-generalScore(a));
    const days=randi(30,90);
    const markInjured=()=>{ hurt.injury={active:true, untilDate:addDays(ev.date,days), note:'Lesión de campamento (baja de última hora)', type:'general'}; hurt.status='injured'; };

    // Ranking del rival que se queda y de cada candidato — para poder juzgar si un sustituto
    // es razonable frente a las expectativas de la pelea original (nivel de ranking), no solo
    // frente a las estadísticas brutas de nivel/récord.
    const oppRank = divisionFullRank(opp);
    const oppRankTxt = oppRank ? `#${oppRank} ` : '';

    if(!candidates.length){
      document.getElementById('modalRoot').innerHTML=`
      <div class="modal-bg" id="modalBg">
        <div class="modal" style="text-align:center">
          <h3>🚑 Lesión de última hora</h3>
          <p>${fName(hurt)} se ha lesionado en el campamento antes de su combate vs ${oppRankTxt}${fName(opp)}.</p>
          <p class="muted">No hay ningún peleador disponible de ${divName(hurt.division)} para sustituirlo — el combate se cancela.</p>
          <button class="btn primary full" id="injOk" style="margin-top:10px">Entendido</button>
        </div>
      </div>`;
      document.getElementById('injOk').onclick=()=>{
        markInjured();
        const idx=ev.card.indexOf(fight); if(idx>=0) ev.card.splice(idx,1);
        logEvent(`🚑 ${fName(hurt)} se lesiona antes de ${fName(ev)} y no hay sustituto disponible — el combate se cancela.`);
        richToast(`🚑 ${fName(hurt)} se lesiona — sin sustituto, combate cancelado`,'🚑','#ef5350',6000);
        processNext(i+1);
      };
      return;
    }

    document.getElementById('modalRoot').innerHTML=`
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h3>🚑 Lesión de última hora</h3>
        <p>${fName(hurt)} se ha lesionado en el campamento y no podrá pelear vs ${oppRankTxt}${fName(opp)}. Elige su sustituto:</p>
        <select id="injSubSel">${candidates.map(c=>{
          const cRank = divisionFullRank(c);
          return `<option value="${c.id}">${cRank?`#${cRank} `:''}${fName(c)} (Nivel ${generalScore(c)} · ${c.record.wins}-${c.record.losses})</option>`;
        }).join('')}</select>
        <div class="row" style="margin-top:10px">
          <button class="btn primary full" id="injConfirm">Confirmar sustituto</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button class="btn danger full" id="injCancelFight">✕ Cancelar el combate</button>
        </div>
      </div>
    </div>`;
    document.getElementById('injConfirm').onclick=()=>{
      const chosenId = document.getElementById('injSubSel').value;
      const sub = STATE.fighters.find(x=>x.id===chosenId);
      markInjured();
      bookedIds.delete(hurtId); bookedIds.add(chosenId);
      fight[side]=chosenId;
      logEvent(`🚑 ${fName(hurt)} se retira de ${fName(ev)} por lesión de última hora — sustituido por ${fName(sub)}.`);
      richToast(`🚑 Baja de última hora: ${fName(hurt)} se lesiona. ¡Entra ${fName(sub)}!`,'🚑','#ff7043',6000);
      processNext(i+1);
    };
    document.getElementById('injCancelFight').onclick=()=>{
      markInjured();
      const idx=ev.card.indexOf(fight); if(idx>=0) ev.card.splice(idx,1);
      logEvent(`🚑 ${fName(hurt)} se lesiona antes de ${fName(ev)} — combate cancelado.`);
      richToast(`🚑 Combate cancelado: ${fName(hurt)} se lesiona`,'🚑','#ef5350',6000);
      processNext(i+1);
    };
  }
  processNext(0);
}

function simulateEvent(ev){
  if(ev.status==='completed') return;
  ev.card.forEach(fight=>{
    const fA = STATE.fighters.find(x=>x.id===fight.fighterA);
    const fB = STATE.fighters.find(x=>x.id===fight.fighterB);
    if(!fA||!fB) return;
    const isTitle = !!fight.titleId;
    // Miss weight check
    const missedId = checkMissWeight(fight);
    if(missedId){
      const mf=STATE.fighters.find(x=>x.id===missedId);
      fight.result = fight.result||{};
      fight.missedWeight=missedId;
      logEvent(`⚖️ ${fName(mf)} no da el peso — el combate se realiza igualmente, pero ${fName(mf)} no podrá ganar/retener el título si gana el combate.`);
      mf.rankScore=Math.max(0,(mf.rankScore||0)-15);
      mf.missedWeightCount=(mf.missedWeightCount||0)+1;
      if(STATE.atpPoints) STATE.atpPoints[missedId]=Math.round((STATE.atpPoints[missedId]||0)*0.85);
    }
    const fAm=momentumBonus(fA)+weightCutBonus(fight,fA.id,missedId), fBm=momentumBonus(fB)+weightCutBonus(fight,fB.id,missedId);
    const fAb={...fA,stats:{...fA.stats,...Object.fromEntries(Object.entries(fA.stats).map(([k,v])=>[k,Math.min(99,v+fAm)]))}};
    const fBb={...fB,stats:{...fB.stats,...Object.fromEntries(Object.entries(fB.stats).map(([k,v])=>[k,Math.min(99,v+fBm)]))}};
    const result = simulateFight(fAb, fBb, {rounds: isTitle?5:3});
    fight.result = {
      winnerId:result.winner.id, loserId:result.loser.id, method:result.method, decType:result.decType||null, round:result.round, time:result.time,
      fightOfNight:result.fightOfNight, performance:result.performance,
      missedWeight: missedId||null, judgeScores:result.judgeScores||null
    };
    applyFightResultToState(fight, fA, fB, result, ev);
    checkAndUpdateRecords(fA, fB, result, ev.date);
  });
  finishEvent(ev);
  saveLocal();
}

/* ====================== INTERINO POR LESIÓN DE CAMPEÓN ====================== */
// El campeón NUNCA pierde el cinturón por lesión. Esta función ya no despoja al campeón —
// solo emite un aviso de que se recomienda programar un interino mientras el campeón se recupera.
function vacateTitleForInjury(titleId){
  const title = STATE.titles.find(t=>t.id===titleId);
  if(!title || !title.holderId) return;
  const champ = STATE.fighters.find(x=>x.id===title.holderId);
  if(!champ) return;
  if(!confirm(`¿Vaciar ${fName(title)}?\n\nEl campeón actual es ${champ.name}.\n\nEn la UFC real el campeón nunca pierde el cinturón por lesión — se crea un título interino mientras se recupera.\n\nSi de todas formas quieres vacar el cinturón (retirada, sanción, etc.) pulsa Aceptar.`)) return;
  const reign=(champ.titleReigns||[]).find(r=>r.titleId===title.id && !r.lostDate);
  if(reign) reign.lostDate=STATE.meta.currentDate;
  logEvent(`⚠️ ${fName(title)} queda vacante (decisión manual). ${fName(champ)} ya no es campeón.`);
  title.holderId=null; title.isInterim=false;
  saveLocal();
}

function bindDashboard(){
  const setDate=document.getElementById('setDate');
  if(setDate) setDate.onclick=()=>{
    STATE.meta.currentDate = document.getElementById('dashDate').value || STATE.meta.currentDate;
    saveLocal(); render(); toast('Fecha actualizada');
  };
  document.querySelectorAll('.negotiateBtn').forEach(btn=>{
    btn.onclick=e=>{ e.stopPropagation(); openContractNegotiation(btn.dataset.id); };
  });
  document.querySelectorAll('.bookCalloutBtn').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const callerId=btn.dataset.caller, targetId=btn.dataset.target;
      const caller=STATE.fighters.find(x=>x.id===callerId), target=STATE.fighters.find(x=>x.id===targetId);
      if(!caller||!target) return;
      // Acceso rápido: crea un evento nuevo solo para este callout, con el nombre que elijas.
      // Para meterlo en una cartelera ya existente junto a otros combates, ve a Eventos → el
      // callout aparece ahí como cualquier otra pelea que se pueda "usar" en el matchmaking.
      const name = prompt('Nombre del evento para este callout:', `${caller.name} vs ${target.name}`);
      if(name===null) return;
      const ev = createEvent(name.trim()||`${caller.name} vs ${target.name}`, addDays(STATE.meta.currentDate,21));
      addFightToEvent(ev, callerId, targetId);
      saveLocal(); UI.tab='events'; render();
      toast(`📅 Evento creado: ${fName(caller)} vs ${fName(target)}`);
    };
  });
}

function tplInfirmary(){
  // Auto-clear expired injuries and suspensions
  STATE.fighters.forEach(f=>{
    if(f.status==='injured'&&f.injury?.active&&f.injury?.untilDate&&new Date(f.injury.untilDate)<=new Date(STATE.meta.currentDate)){
      f.injury.active=false; f.status='active';
    }
    if(f.status==='suspended'&&f.suspension?.active&&f.suspension?.untilDate&&new Date(f.suspension.untilDate)<=new Date(STATE.meta.currentDate)){
      f.suspension.active=false; f.status='active';
      logEvent(`✅ ${fName(f)} cumple su sanción y vuelve a estar disponible.`);
    }
  });
  const injured=STATE.fighters.filter(f=>f.status==='injured').sort((a,b)=>new Date(a.injury?.untilDate||0)-new Date(b.injury?.untilDate||0));
  const suspended=STATE.fighters.filter(f=>f.status==='suspended').sort((a,b)=>new Date(a.suspension?.untilDate||0)-new Date(b.suspension?.untilDate||0));
  const recovering=STATE.fighters.filter(f=>f.status==='active'&&f.chinDamage>5).sort((a,b)=>b.chinDamage-a.chinDamage);
  return `
  <div class="card"><h2>🩹 Enfermería & Sanciones</h2>
    <h3 style="margin-top:0">Lesionados (${injured.length})</h3>
    ${!injured.length?'<p class="muted">Nadie lesionado actualmente.</p>':
    `<table><thead><tr><th>Peleador</th><th>Lesión</th><th>Regreso</th><th>Días</th></tr></thead><tbody>
    ${injured.map(f=>{
      const days=Math.max(0,Math.round((new Date(f.injury?.untilDate||STATE.meta.currentDate)-new Date(STATE.meta.currentDate))/86400000));
      const injColor=f.injury?.type==='concussion'?'#ef5350':'#ffa726';
      return `<tr class="clickable" data-id="${f.id}">
        <td><b>${fName(f)}</b></td>
        <td><span style="color:${injColor};font-size:.75rem">${f.injury?.note||'Lesión'}</span></td>
        <td style="font-size:.75rem">${fmtDate(f.injury?.untilDate)}</td>
        <td style="font-size:.75rem;color:#888">${days}d</td>
      </tr>`;
    }).join('')}
    </tbody></table>`}
  </div>
  ${suspended.length?`<div class="card" style="border-left:3px solid #ef5350">
    <h3 style="color:#ef5350">🚫 Sancionados (${suspended.length})</h3>
    <table><thead><tr><th>Peleador</th><th>Sanción</th><th>Hasta</th><th>Días</th></tr></thead><tbody>
    ${suspended.map(f=>{
      const days=Math.max(0,Math.round((new Date(f.suspension?.untilDate||STATE.meta.currentDate)-new Date(STATE.meta.currentDate))/86400000));
      const isDoping=f.suspension?.cat==='doping';
      return `<tr class="clickable" data-id="${f.id}">
        <td><b>${fName(f)}</b>${STATE.titles.some(t=>t.holderId===f.id)?' 👑':''}</td>
        <td><span style="color:${isDoping?'#ef5350':'#ffa726'};font-size:.75rem">${isDoping?'💊':'⚠️'} ${f.suspension?.note||'Sanción'}</span></td>
        <td style="font-size:.75rem">${fmtDate(f.suspension?.untilDate)}</td>
        <td style="font-weight:700;color:#ef5350">${days}d</td>
      </tr>`;
    }).join('')}
    </tbody></table>
    <p class="muted" style="font-size:.72rem;margin-top:6px">Los peleadores sancionados no pueden participar en eventos durante el período de suspensión.</p>
  </div>`:''}
  ${recovering.length?`<div class="card"><h3>⚠️ Chin dañado (KOs en carrera)</h3>
    <p class="muted" style="font-size:.75rem">Peleadores activos con daño de chin acumulado — más vulnerables a KOs.</p>
    <table><thead><tr><th>Peleador</th><th>Daño chin</th><th>KO derrotas</th></tr></thead><tbody>
    ${recovering.map(f=>`<tr class="clickable" data-id="${f.id}"><td>${fName(f)}</td><td style="color:#ef5350"><b>${f.chinDamage}</b>/30</td><td>${f.record.ufcKoLosses||0}</td></tr>`).join('')}
    </tbody></table></div>`:''}`;

function tplRivalries(){
  // Reconstruir rivalidades desde el historial de eventos (más fiable que STATE.rivalries)
  const fightCounts={};
  STATE.events.filter(e=>e.status==='completed').forEach(ev=>{
    ev.card.filter(ft=>ft.result).forEach(ft=>{
      const k=rivalryKey(ft.fighterA,ft.fighterB);
      if(!fightCounts[k]) fightCounts[k]={idA:ft.fighterA,idB:ft.fighterB,fights:0};
      fightCounts[k].fights++;
    });
  });
  // Sincronizar con STATE.rivalries — y rellenar la expectación si viene de una partida antigua
  // que aún no la guardaba (aproximación a partir del historial real, no un valor inventado).
  Object.entries(fightCounts).forEach(([k,v])=>{
    const prev=STATE.rivalries[k]||{};
    let hype=prev.hype;
    if(hype==null){
      let titleFights=0;
      STATE.events.filter(e=>e.status==='completed').forEach(ev=>{
        ev.card.filter(ft=>ft.result&&((ft.fighterA===v.idA&&ft.fighterB===v.idB)||(ft.fighterA===v.idB&&ft.fighterB===v.idA))).forEach(ft=>{ if(ft.titleId) titleFights++; });
      });
      hype=Math.round(Math.min(100, v.fights*10+titleFights*15));
    }
    STATE.rivalries[k]={...prev, fights:v.fights, hype};
  });

  const pairsRaw=Object.entries(fightCounts).filter(([,v])=>v.fights>=2).map(([key,data])=>{
    const {idA,idB}=data;
    let titleFights=0, lastDate='';
    STATE.events.filter(e=>e.status==='completed').forEach(ev=>{
      ev.card.filter(ft=>ft.result&&((ft.fighterA===idA&&ft.fighterB===idB)||(ft.fighterA===idB&&ft.fighterB===idA))).forEach(ft=>{
        if(ft.titleId) titleFights++;
        if(!lastDate||ev.date>lastDate) lastDate=ev.date;
      });
    });
    return [key, {...data, titleFights, lastDate, hype:STATE.rivalries[key]?.hype||0}];
  });
  // Ordenado por expectación — la rivalidad que más engancha va primero, no solo la que más
  // combates acumula (dos estrellas que se han visto 2 veces pueden generar más hype que dos
  // prelims que se han visto 4).
  const pairs=pairsRaw.sort((a,b)=>b[1].hype-a[1].hype);
  if(!pairs.length) return `<div class="card"><h2>⚔️ Rivalidades</h2><p class="muted">Aún no hay rivalidades. Se activan cuando dos peleadores se enfrentan 2 o más veces. Simula más eventos para crear historia.</p></div>`;

  return `<div class="card"><h2>⚔️ Rivalidades históricas</h2>
    <p class="muted" style="font-size:.78rem">Rivalidad cuando se han enfrentado 2+ veces. Oficial (⚔️) con 3+. Ordenadas por expectación — crece con cada combate y con la fama de ambos.</p>
  </div>
  ${pairs.slice(0,20).map(([key,data])=>{
    const {idA,idB}=data;
    const fA=STATE.fighters.find(x=>x.id===idA), fB=STATE.fighters.find(x=>x.id===idB);
    if(!fA||!fB) return '';
    const isOfficial=data.fights>=3;
    const fights=[];
    STATE.events.filter(e=>e.status==='completed').forEach(ev=>{
      ev.card.filter(ft=>ft.result&&((ft.fighterA===idA&&ft.fighterB===idB)||(ft.fighterA===idB&&ft.fighterB===idA))).forEach(ft=>{
        const w=STATE.fighters.find(x=>x.id===ft.result.winnerId);
        fights.push({ev,ft,w,date:ev.date});
      });
    });
    fights.sort((a,b)=>new Date(a.date)-new Date(b.date));
    const winsA=fights.filter(f=>f.w?.id===idA).length;
    const winsB=fights.filter(f=>f.w?.id===idB).length;
    return `<div class="card" style="padding:12px 14px;${isOfficial?'border-left:3px solid #7b1fa2':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:.65rem;color:${isOfficial?'#ce93d8':'#888'};text-transform:uppercase;letter-spacing:1px">${isOfficial?'⚔️ Rivalidad oficial':'Enfrentamientos'} · ${data.fights} peleas</span>
        <span style="font-size:.68rem;color:#d4af37;font-weight:700">🔥 ${data.hype} expectación</span>
      </div>
      <div class="statbar" style="margin-bottom:10px"><i style="width:${data.hype}%;background:#d4af37"></i></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px">
        <div style="text-align:center;flex:1">
          ${fA.imageUrl?`<img src="${fA.imageUrl}" class="clickable" data-id="${fA.id}" style="width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:50% 5%;border:2px solid ${fighterColor(fA.id)};cursor:pointer">`:''}
          <div class="clickable" data-id="${fA.id}" style="font-size:.82rem;font-weight:700;margin-top:4px;cursor:pointer">${fName(fA)}</div>
          <div style="font-size:1.5rem;font-weight:900;color:${winsA>=winsB?'#d4af37':'#555'}">${winsA}</div>
        </div>
        <div style="font-size:.9rem;font-weight:900;color:#333">VS</div>
        <div style="text-align:center;flex:1">
          ${fB.imageUrl?`<img src="${fB.imageUrl}" class="clickable" data-id="${fB.id}" style="width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:50% 5%;border:2px solid ${fighterColor(fB.id)};cursor:pointer">`:''}
          <div class="clickable" data-id="${fB.id}" style="font-size:.82rem;font-weight:700;margin-top:4px;cursor:pointer">${fName(fB)}</div>
          <div style="font-size:1.5rem;font-weight:900;color:${winsB>=winsA?'#d4af37':'#555'}">${winsB}</div>
        </div>
      </div>
      ${fights.map((f,i)=>{const mc=m=>methodColor(m);const t=f.ft.titleId?STATE.titles.find(x=>x.id===f.ft.titleId):null;
        return `<div style="font-size:.72rem;padding:3px 0;border-top:1px solid #1a1a1a;display:flex;justify-content:space-between"><span>${i+1}. <b>${f.w?.name||'?'}</b> vence · ${fmtDate(f.date)}</span><span style="color:${mc(f.ft.result.method)}">${methodAbbr(f.ft.result)} R${f.ft.result.round}${t?' 🏆':''}${f.ft.result.missedWeight?' <span style="color:#ffb300">⚖️</span>':''}</span></div>`;
      }).join('')}
    </div>`;
  }).join('')}`;
}

// Prestigio del jugador — comparado con el de cada rival en el panorama de mercado
function playerPrestige(){
  const active = STATE.fighters.filter(f=>f.status==='active');
  if(!active.length) return 30;
  const avgRep = active.reduce((s,f)=>s+(f.reputation||50),0)/active.length;
  const eventBonus = Math.min(20, STATE.events.filter(e=>e.status==='completed').length*0.5);
  return Math.round(clamp(avgRep*0.6+eventBonus+20, 5, 99));
}
function tplPromotions(){
  const rivals = STATE.rivalPromotions||[];
  const myPrestige = playerPrestige();
  const maxPrestige = Math.max(myPrestige, ...rivals.map(r=>r.prestige), 1);

// Coste de comprar los derechos de un peleador de una promotora rival — sube con su nivel,
// su récord (más victorias = más caro) y si es campeón de su división en esa promotora.
function rivalSigningCost(rf, isChamp){
  const level = generalScore(rf);
  const wins = rf.record?.wins||0, losses = rf.record?.losses||0;
  let cost = 15000 + level*1100 + wins*4000 - losses*1200;
  if(isChamp) cost *= 1.8;
  return clamp(Math.round(cost/1000)*1000, 15000, 700000);
}
function bindPromotions(){
  document.querySelectorAll('[data-rivalfighter].clickable').forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      const rp=STATE.rivalPromotions.find(x=>x.id===el.dataset.rivalpromo);
      const rf=rp?.fighters.find(x=>x.id===el.dataset.rivalfighter);
      if(rf) openRivalFighterProfile(rf, rp);
    };
  });
  document.querySelectorAll('.buyRivalFighterBtn').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const rp=STATE.rivalPromotions.find(x=>x.id===btn.dataset.rivalpromo);
      const rf=rp?.fighters.find(x=>x.id===btn.dataset.rivalfighter);

    };
  });
  const PROMO_COLORS=['var(--gold)','var(--blue)','var(--green)','var(--sub)','var(--dec)'];
  const series=[{label:`${STATE.meta.leagueName} (tú)`, color:'var(--red)', points:(STATE.playerPrestigeHistory||[]).map(h=>({x:h.date,y:h.prestige}))}]
    .concat((STATE.rivalPromotions||[]).map((rp,i)=>({label:rp.short||rp.name, color:PROMO_COLORS[i%PROMO_COLORS.length], points:(rp.prestigeHistory||[]).map(h=>({x:h.date,y:h.prestige}))})));
  renderLineChart('prestigeChart', series, {height:150, yFmt:v=>Math.round(v), xLabel:fmtDate});
}
// Perfil simplificado de un peleador rival (no tiene todo el historial de un peleador propio)

  const isChamp=rp.titles.some(t=>t.holderId===rf.id);

  document.getElementById('rfClose').onclick=closeModal;

function buyRivalFighter(rp, rf){
  const isChamp=rp.titles.some(t=>t.holderId===rf.id);
  const cost=rivalSigningCost(rf,isChamp);
  if((STATE.meta.budget||0)<cost){ toast(`❌ Presupuesto insuficiente (necesitas $${cost.toLocaleString()})`); return; }
  if(!confirm(`¿Pagar $${cost.toLocaleString()} por los derechos de ${rf.name} (${rp.name})?`)) return;
  STATE.meta.budget -= cost;
  recordBudgetTx(-cost, `Fichaje de ${rf.name} (${rp.name})`);
  rp.fighters = rp.fighters.filter(x=>x.id!==rf.id);
  if(isChamp){
    const t=rp.titles.find(x=>x.holderId===rf.id);
    if(t){ t.holderId=null; t.holderName=null; }
  }
  STATE.fighters.push(restoreFighterFromRival(rf, isChamp));
  logEvent(`💰 ${rf.name} ficha por tu promotora tras pagar $${cost.toLocaleString()} a ${rp.name}.`);
  saveLocal(); render(); toast(`${rf.name} fichado ✅ (-$${cost.toLocaleString()})`);
}
// Si `rf` era un peleador propio antes de irse a una rival (tiene .contract), conserva TODO su
// perfil intacto (foto, títulos, historial, contrato...) en vez de reconstruirlo desde cero como
// si fuera un peleador rival genérico. Si es un peleador nativo de la rival (nunca fue nuestro),
// se construye un perfil nuevo a partir de sus datos reducidos, como hasta ahora.
function restoreFighterFromRival(rf, isChamp){
  if(rf.contract){
    rf.status='active';
    if(rf.injury) rf.injury.active=false;
    return rf;
  }
  return {
    id: rf.id, name: rf.name, nickname:'', gender:'M', country:'', dob:rf.dob, debut:STATE.meta.currentDate,
    division: rf.division, stats:{...rf.stats}, longevity: rf.longevity||80, status:'active',
    injury:{active:false,untilDate:null,note:''},
    record:{wins:rf.record?.wins||0,losses:rf.record?.losses||0,draws:0,nc:0,koWins:0,subWins:0,decWins:0,koLosses:0,subLosses:0,decLosses:0,ufcFights:0,ufcWins:0,ufcLosses:0,ufcKoWins:0,ufcSubWins:0,ufcDecWins:0,ufcKoLosses:0,ufcSubLosses:0,ufcDecLosses:0},
    imageUrl:rf.imageUrl||null, bonuses:{fightOfNight:0,performanceOfNight:0}, titleReigns:[], fightHistory:[], lastEventSeq:null, hof:false, rankScore:0,
    fightStyle: rf.fightStyle||'technical', chinDamage: rf.chinDamage||0, momentum:0, reputation: isChamp?70:50,
    contract: makeContract(generalScore(rf), isChamp?70:50),
  };
}

/* ====================== GRÁFICAS (SVG ligero, sin librerías) ====================== */
// series: [{label, color, points:[{x,y}]}] — points ya ordenados por x, mismo eje Y para todas.
// opts: {height, yFmt(v), xLabel(x)}. Un único eje Y siempre (nunca doble eje).
function renderLineChart(containerId, series, opts){
  opts = opts||{};
  const el = document.getElementById(containerId);
  if(!el) return;
  series = series.filter(s=>s.points && s.points.length);
  if(!series.length){ el.innerHTML='<p class="muted" style="font-size:.75rem">Sin datos históricos todavía — juega algún evento.</p>'; return; }
  const W=opts.width||340, H=opts.height||140, PAD_L=44, PAD_R=10, PAD_T=10, PAD_B=20;
  const plotW=W-PAD_L-PAD_R, plotH=H-PAD_T-PAD_B;
  const n = Math.max(...series.map(s=>s.points.length));
  const yVals = series.flatMap(s=>s.points.map(p=>p.y));
  let yMin=Math.min(0,...yVals), yMax=Math.max(...yVals);
  if(yMin===yMax){ yMin-=1; yMax+=1; }
  const yPad=(yMax-yMin)*0.08; yMin-=yPad; yMax+=yPad;
  const xFor = i => PAD_L + (n<=1?plotW/2:(i/(n-1))*plotW);
  const yFor = v => PAD_T + plotH - ((v-yMin)/(yMax-yMin))*plotH;

  const gridLines = [0,0.25,0.5,0.75,1].map(t=>{
    const y = PAD_T + t*plotH;
    const val = yMax - t*(yMax-yMin);
    return `<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W-PAD_R}" y2="${y.toFixed(1)}" style="stroke:var(--line);stroke-width:1"/>
      <text x="${PAD_L-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" style="fill:var(--txt3)">${opts.yFmt?opts.yFmt(val):Math.round(val)}</text>`;
  }).join('');
  const zeroY = (yMin<0&&yMax>0) ? yFor(0) : null;
  const zeroLine = zeroY!=null ? `<line x1="${PAD_L}" y1="${zeroY.toFixed(1)}" x2="${W-PAD_R}" y2="${zeroY.toFixed(1)}" style="stroke:var(--txt3);stroke-width:1;stroke-dasharray:3,3"/>` : '';

  const paths = series.map(s=>{
    const d = s.points.map((p,i)=>`${i===0?'M':'L'}${xFor(i).toFixed(1)},${yFor(p.y).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" style="stroke:${s.color};stroke-width:2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join('');

  const colW = plotW/Math.max(1,n-1||1);
  const hitCols = Array.from({length:n},(_,i)=>`<rect class="lcHit" data-i="${i}" x="${(xFor(i)-colW/2).toFixed(1)}" y="${PAD_T}" width="${colW.toFixed(1)}" height="${plotH}" fill="transparent" style="cursor:crosshair"/>`).join('');

  const legend = series.length>1 ? `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px">${series.map(s=>
    `<span style="font-size:.68rem;color:var(--txt2)"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:4px"></span>${s.label}</span>`
  ).join('')}</div>` : '';

  el.innerHTML = `${legend}
  <div style="position:relative">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible;display:block">
      ${gridLines}${zeroLine}${paths}${hitCols}
    </svg>
    <div class="lcTooltip" style="position:absolute;display:none;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.68rem;white-space:nowrap;top:2px;transform:translateX(-50%);z-index:2"></div>
    <div class="lcCrosshair" style="position:absolute;display:none;pointer-events:none;top:${PAD_T}px;width:1px;height:${plotH}px;background:var(--txt3)"></div>
  </div>`;

  const tooltip=el.querySelector('.lcTooltip'), crosshair=el.querySelector('.lcCrosshair');
  el.querySelectorAll('.lcHit').forEach(rect=>{
    const i=parseInt(rect.dataset.i);
    const pct=(xFor(i)/W*100).toFixed(2)+'%';
    rect.addEventListener('mouseenter',()=>{
      crosshair.style.left=pct; crosshair.style.display='block';
      const lines=series.filter(s=>s.points[i]).map(s=>`<div><span style="color:${s.color}">●</span> ${s.label}: <b>${opts.yFmt?opts.yFmt(s.points[i].y):s.points[i].y.toLocaleString()}</b></div>`).join('');
      const xv = series.find(s=>s.points[i])?.points[i]?.x;
      const xLabel = opts.xLabel ? opts.xLabel(xv) : (xv??'');
      tooltip.innerHTML = `<div style="color:var(--txt3);margin-bottom:2px">${xLabel}</div>${lines}`;
      tooltip.style.left=pct; tooltip.style.display='block';
    });
    rect.addEventListener('mouseleave',()=>{ tooltip.style.display='none'; crosshair.style.display='none'; });
  });
}

function budgetHistorySeries(){
  const ledger = STATE.budgetLedger||[];
  if(!ledger.length) return [{x:'Ahora', y:STATE.meta.budget||0}];
  const startBalance = ledger[0].balance - ledger[0].amount;
  const points = [{x:'Inicio', y:startBalance}];
  ledger.forEach(tx=>points.push({x:tx.date, y:tx.balance}));
  return points;
}
function bindFinance(){

/* ====================== ROSTER ====================== */
function fighterStatusPill(f){
  if(f.status==='retired') return `<span class="pill retired">Retirado</span>`;
  if(f.status==='injured') return `<span class="pill injured">Lesionado</span>`;
  if(f.status==='free_agent') return `<span class="pill" style="background:#555">Agente Libre</span>`;
  if(isChampion(f.id)) return `<span class="pill champ">Campeón 🏆</span>`;
  if(isInterimChampion(f.id)) return `<span class="pill interim">Interino 🥈</span>`;
  return `<span class="pill">Activo</span>`;
}

function tplRoster(){
  // Auto-limpiar lesiones expiradas antes de renderizar
  STATE.fighters.forEach(f=>{
    if(f.status==='injured' && f.injury?.active && f.injury?.untilDate && new Date(f.injury.untilDate) <= new Date(STATE.meta.currentDate)){
      f.injury.active=false; f.status='active';
    }
  });
  const opts = `<option value="ALL">Todas las categorías</option>` + DIVISIONS.map(d=>`<option value="${d.id}">${divName(d.id)}</option>`).join('');
  const statusOpts = ['ALL','active','injured','retired'].map(s=>`<option value="${s}">${s==='ALL'?'Todos los estados':s==='active'?'Activos':s==='injured'?'Lesionados':'Retirados'}</option>`).join('');
  let list = STATE.fighters.slice();
  if(UI.rosterFilter!=='ALL') list=list.filter(f=>f.division===UI.rosterFilter);
  if(UI.rosterStatusFilter && UI.rosterStatusFilter!=='ALL') list=list.filter(f=>f.status===UI.rosterStatusFilter);
  if(UI.rosterSearch) list=list.filter(f=>f.name.toLowerCase().includes(UI.rosterSearch.toLowerCase()));
  list.sort((a,b)=>b.rankScore-a.rankScore);
  return `
  <div class="card">
    <h2>Roster (${list.length} / ${STATE.fighters.length})</h2>
    <select id="fDiv">${opts}</select>
    <select id="fStatus">${statusOpts}</select>
    <input id="fSearch" placeholder="Buscar peleador..." value="${UI.rosterSearch}">
  </div>
  <div class="card">
    <table><thead><tr><th>Nombre</th><th>Div.</th><th>Récord</th><th>Estado</th></tr></thead>
    <tbody>
    ${list.map(f=>`<tr class="clickable" data-id="${f.id}">
      <td>${fName(f)}${fighterTrend(f)}${f.hof?' <span class="pill hof">HOF</span>':''}</td>
      <td style="font-size:.72rem">${divName(f.division)}</td>
      <td>${f.record.wins}-${f.record.losses}-${f.record.draws}</td>
      <td>${fighterStatusPill(f)}</td>
    </tr>`).join('')}

}

// Cambio de categoría de peso desde el perfil (antes solo existía en el Editor, sin ningún
// efecto secundario). Si el peleador es campeón (indiscutido o interino) de su división
// actual, el título queda vacante — un campeón real no se lleva el cinturón a otro peso.
function changeFighterDivision(fid, newDivId){
  const f = STATE.fighters.find(x=>x.id===fid); if(!f || newDivId===f.division) return;
  const oldDivId = f.division;
  STATE.titles.forEach(t=>{
    if(t.divisionId!==oldDivId) return;
    if(t.holderId===f.id){
      const r=(f.titleReigns||[]).find(rr=>rr.titleId===t.id&&!rr.isInterim&&!rr.lostDate);
      if(r) r.lostDate=STATE.meta.currentDate;
      t.holderId=null;
      logEvent(`🏆 ${fName(t)} queda vacante: ${fName(f)} cambia a ${divName(newDivId)}.`);
    }
    if(t.interimHolderId===f.id){
      const r=(f.titleReigns||[]).find(rr=>rr.titleId===t.id&&rr.isInterim&&!rr.lostDate);
      if(r) r.lostDate=STATE.meta.currentDate;
      t.interimHolderId=null;
    }
  });
  f.manualRankDivision = null; // el override de ranking de categoría no tiene sentido en la nueva
  f.division = newDivId;
  f.lastDivisionChangeDate = STATE.meta.currentDate;
  logEvent(`⚖️ ${fName(f)} cambia de categoría: ${divName(oldDivId)} → ${divName(newDivId)}.`);
}

      <p class="muted">GOAT score: <b>${goatScore(f)}</b> · Rank score: <b>${f.rankScore.toFixed(1)}</b> · General: <b>${generalScore(f)}</b> · ATP pts: <b>${STATE.atpPoints?.[f.id]||0}</b></p>
