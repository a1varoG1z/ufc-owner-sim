<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>UFC Owner Sim</title>
<style>
  :root{
    --bg:#0c0d10; --bg2:#15171c; --bg3:#1d2027; --line:#2a2e38;
    --red:#d7263d; --red2:#a81f31; --gold:#e3b341; --green:#3fbf6f; --blue:#4d9de0;
    --txt:#e9e9ee; --txt2:#9aa0ad; --txt3:#666c79;
    --ko:#ef5350; --sub:#ce93d8; --dec:#90caf9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:64px;}
  h1,h2,h3,h4{margin:.3em 0; font-weight:700;}
  h1{font-size:1.3rem} h2{font-size:1.1rem} h3{font-size:1rem} h4{font-size:.9rem;color:var(--txt2)}
  a{color:var(--blue)}
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg2),var(--bg2) 90%,transparent);
    padding:10px 12px 6px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .topbar .brand{font-weight:800;letter-spacing:.5px;color:var(--red)}
  .topbar .date{font-size:.8rem;color:var(--txt2)}
  .container{padding:10px 10px 90px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .card.tight{padding:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row > *{flex:1}
  .btn{display:inline-block;background:var(--bg3);border:1px solid var(--line);color:var(--txt);
    padding:9px 12px;border-radius:9px;font-size:.85rem;cursor:pointer;text-align:center;user-select:none}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--red);border-color:var(--red2);color:#fff;font-weight:700}
  .btn.green{background:#1f3d2c;border-color:var(--green);color:var(--green)}
  .btn.gold{background:#3a2f12;border-color:var(--gold);color:var(--gold)}
  .btn.small{padding:5px 9px;font-size:.75rem}
  .btn.full{width:100%}
  .btn.danger{background:#3a1414;border-color:var(--red);color:#ff8a8a}
  .btn[disabled]{opacity:.35;pointer-events:none}
  input,select,textarea{background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:8px;font-size:.85rem;width:100%;margin:3px 0;font-family:inherit}
  label{font-size:.75rem;color:var(--txt2);display:block;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:.8rem}
  th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--txt2);font-weight:600;font-size:.72rem;text-transform:uppercase}
  tr.clickable{cursor:pointer}
  tr.clickable:active{background:var(--bg3)}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:700;background:var(--bg3);border:1px solid var(--line)}
  .pill.champ{background:#3a2f12;color:var(--gold);border-color:var(--gold)}
  .pill.interim{background:#2a2640;color:#b79bff;border-color:#7d5fff}
  .pill.retired{background:#2a2a2a;color:#888}
  .pill.injured{background:#3a1414;color:#ff8a8a;border-color:#b44}
  .pill.hof{background:#102a3a;color:#6fc8ff;border-color:#3a7da8}
  .muted{color:var(--txt2);font-size:.78rem}
  .tabs{display:flex;overflow-x:auto;gap:6px;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--line);
    position:sticky;top:46px;z-index:19}
  .tabs::-webkit-scrollbar{display:none}
  /* Degradado en los bordes — pista visual de que la barra sigue más allá de la pantalla */
  .tabs::before,.tabs::after{content:'';position:absolute;top:0;bottom:0;width:20px;pointer-events:none;z-index:1}
  .tabs::before{left:0;background:linear-gradient(to right,var(--bg2),transparent)}
  .tabs::after{right:0;background:linear-gradient(to left,var(--bg2),transparent)}
  .tab{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--bg3);font-size:.78rem;white-space:nowrap;border:1px solid var(--line)}
  .tab.active{background:var(--red);border-color:var(--red2);color:#fff;font-weight:700}
  /* Separador sutil entre grupos temáticos de pestañas */
  .tab-group-start{margin-left:10px;position:relative}
  .tab-group-start::before{content:'';position:absolute;left:-8px;top:1px;bottom:1px;width:1px;background:var(--line)}
  .statbar{height:6px;border-radius:99px;background:var(--bg3);overflow:hidden;margin-top:2px}
  .statbar i{display:block;height:100%;background:var(--blue)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .fightcard-item{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px;background:var(--bg3)}
  .vs{font-weight:800;color:var(--red);text-align:center;font-size:.75rem}
  .log{font-size:.78rem;color:var(--txt2);max-height:220px;overflow-y:auto;border-top:1px solid var(--line);padding-top:6px}
  .log div{margin-bottom:4px}
  .closebtn{position:absolute;top:10px;right:10px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end}
  .modal{background:var(--bg2);width:100%;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px;position:relative;border-top:1px solid var(--line)}
  .badge-row{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
  .section-title{display:flex;justify-content:space-between;align-items:center}
  textarea.code{font-family:monospace;font-size:.72rem;min-height:300px;white-space:pre}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--gold);
    padding:8px 14px;border-radius:10px;font-size:.8rem;z-index:99;max-width:90vw;text-align:center}
  .fighterImg{display:block;max-width:200px;width:100%;margin:0 auto 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);object-fit:cover;object-position:50% 8%}
  .hofBadge{background:linear-gradient(90deg,#7a5c00,#d4af37,#7a5c00);color:#1a1300;font-weight:800;text-align:center;
    padding:8px 10px;border-radius:8px;margin:6px 0 10px;letter-spacing:.5px;font-size:.85rem;box-shadow:0 0 12px rgba(212,175,55,.5)}
  /* Fight Viewer */
  .fv-matchup{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
  .fv-fighter{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
  .fv-avatar{margin-bottom:4px}
  .fv-name{font-weight:700;font-size:1rem;line-height:1.2}
  .fv-winner{color:var(--gold)}
  .fv-vs{font-size:1.4rem;font-weight:900;color:var(--muted);flex:0 0 auto}
  .fv-win-badge{background:var(--gold);color:#1a1300;font-weight:800;font-size:.7rem;padding:2px 8px;border-radius:20px;margin-top:4px}
  .fv-loss-badge{background:var(--bg3);color:var(--muted);font-size:.7rem;padding:2px 8px;border-radius:20px;margin-top:4px}
  .fv-winner-line{text-align:center;padding:8px;background:var(--bg3);border-radius:8px;margin-top:4px}
  /* Fight Viewer — modal unificado con el resto de la app (usa las mismas variables de tema) */
  .fv-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:10px 0;overflow-y:auto}
  .fv-modal{background:var(--bg2);width:100%;max-width:480px;border-radius:14px;overflow:hidden;border:1px solid var(--line);max-height:92vh;overflow-y:auto}
  .fv-head{background:var(--bg3);padding:10px 14px;border-bottom:1px solid var(--line)}
  .fv-panel{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:.7rem}
  .fv-narr{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:14px;min-height:100px}
  .fv-live{display:inline-flex;align-items:center;gap:6px;font-size:.65rem;color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .fv-live-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:fvPulse 1s infinite}
  @keyframes fvPulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes fvShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
  .fv-hit{animation:fvShake .35s}
  /* Ring visual — representación esquemática (estilo Football Manager 2D), no física.
     Los "monigotes" son SVG de trazos (muñecos de palo) coloreados vía currentColor;
     el de la ficha B se refleja en horizontal para que mire hacia el rival. */
  .fv-ring{position:relative;height:160px;margin:0 0 8px;border-radius:16px;
    background:radial-gradient(ellipse at center, var(--bg3) 0%, var(--bg) 100%);border:2px solid var(--line);overflow:hidden}
  .fv-ring::before{content:'';position:absolute;inset:10px;border:2px dashed rgba(255,255,255,.06);border-radius:50%}
  .fv-token{position:absolute;width:34px;height:64px;margin:-56px 0 0 -17px;
    display:flex;flex-direction:column;align-items:center;transition:left .35s ease,top .35s ease}
  .fv-token.a{color:var(--red)}
  .fv-token.b{color:var(--blue)}
  .fv-fig-mirror{display:block}
  .fv-token.b .fv-fig-mirror{transform:scaleX(-1)}
  .fv-fig{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
  .fv-token-name{font-size:.55rem;color:var(--txt2);white-space:nowrap;margin-top:1px;font-weight:600}
  .fv-token.throw .fv-fig{animation:fvThrow .35s ease}
  .fv-token.impact .fv-fig{animation:fvImpact .4s ease}
  .fv-token.down .fv-fig{animation:fvDown .5s ease forwards;opacity:.55}
  .fv-token.winglow .fv-fig{animation:fvGlowWin 1s ease-in-out infinite}
  .fv-spark{position:absolute;transform:translate(-50%,-50%);font-size:1.5rem;animation:fvSparkPop .6s ease-out forwards;pointer-events:none}
  @keyframes fvThrow{0%{transform:scale(1)}35%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes fvImpact{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
  @keyframes fvDown{0%{transform:rotate(0) translateY(0);opacity:1}100%{transform:rotate(75deg) translateY(14px);opacity:.6}}
  @keyframes fvGlowWin{0%,100%{filter:drop-shadow(0 0 2px var(--gold))}50%{filter:drop-shadow(0 0 7px var(--gold))}}
  @keyframes fvSparkPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
</style>

/* ====================== UTILIDADES ====================== */
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9);}
function rand(min,max){return Math.random()*(max-min)+min;}
function randi(min,max){return Math.floor(rand(min,max+1));}
function pick(arr){return arr[randi(0,arr.length-1)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fmtDate(d){ if(!d) return '-'; const dt=new Date(d); return dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});}
function addDays(dateStr,days){ const d=new Date(dateStr); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10);}
function ageFromDob(dob, ref){ const a=new Date(ref); const b=new Date(dob); let age=a.getFullYear()-b.getFullYear(); const m=a.getMonth()-b.getMonth(); if(m<0||(m===0&&a.getDate()<b.getDate())) age--; return age;}
function toast(msg,ms=2400,cat='general'){
  const cfg=UI.notifCfg||{}; if(cfg[cat]===false) return;
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms);
}
function divName(id){ const d=DIVISIONS.find(x=>x.id===id); return d? d.name : id; }

/* ====================== ESTADO GLOBAL ====================== */
let STATE = null;
let UI = {tab:'dashboard', rosterFilter:'ALL', rosterSearch:'', selectedFighter:null, newEventCard:[], newEventDivFilter:'ALL', rankEditScope:'P4P'};

function freshState(){
  return {
    meta:{ currentDate: '2026-01-15', eventSeq:1, fightSeq:1, leagueName:'UFC', budget: 5000000 },
    divisions: DIVISIONS.map(d=>({...d, championId:null, interimChampionId:null})),
    titles: [],
    fighters: [],
    events: [],
    records: { fastestKO:null, fastestSub:null, latestKO:null, latestSub:null },
    log: [],
    rivalries: {},        // {fid1_fid2: {fights, lastDate}}
    rematches: {},        // {fid: {opponentId, titleId}} — rematch clauses pending
    scoutCandidates: [],  // pending scout pool
    newsLog: [],           // narrative world news
    atpPoints: {},
    rankingHistory: [],
    statsHistory: {},
    milestonesReached: [],
    rivalPromotions: [],  // ligas rivales — ver seedRivalPromotions()
    pendingNegotiations: [], // [{fighterId, rivalOfferSalary}] avisos de contrato a renovar
    callouts: [], // [{id, callerId, targetId, divisionId, eventSeqIssued}] retos entre peleadores
    budgetLedger: [], // [{date, amount, reason, balance}] historial de movimientos de presupuesto
    playerPrestigeHistory: [], // [{date, prestige}] para la gráfica comparativa en Promotoras
    rivalNewsLog: [], // [{date, promo, msg}] noticias de las promotoras rivales — feed separado del tuyo
  };
}

function logEvent(msg){
  STATE.log.unshift({date:STATE.meta.currentDate, msg});
  if(STATE.log.length>400) STATE.log.length=400;
}
// Registra un movimiento de presupuesto (evento, fichaje, ajuste manual...) para poder
// reconstruir después una gráfica real de evolución del presupuesto — sumar solo `_finance.net`
// de eventos se queda corto, porque fichajes y ajustes manuales también mueven el dinero.
function recordBudgetTx(amount, reason, date){
  if(!STATE.budgetLedger) STATE.budgetLedger=[];
  STATE.budgetLedger.push({date:date||STATE.meta.currentDate, amount, reason, balance:STATE.meta.budget||0});
  if(STATE.budgetLedger.length>500) STATE.budgetLedger.shift();
}

/* ====================== GENERACIÓN DE PELEADORES SEED ====================== */
function makeFighter(divisionId, gender){
  const first = pick(FIRST_M);
  const last = pick(LAST);
  const age = randi(22,33);
  const dob = `${2026-age}-${String(randi(1,12)).padStart(2,'0')}-${String(randi(1,28)).padStart(2,'0')}`;
  const debutYearsAgo = randi(2,9);
  const debut = `${2026-debutYearsAgo}-0${randi(1,9)}-1${randi(0,9)}`;
  const stats = {};
  STAT_KEYS.forEach(([k])=> stats[k]=randi(45,88));
  // un par de fighters con algo de tope alto para que el roster tenga variedad
  if(Math.random()<0.3){ const boost=pick(STAT_KEYS)[0]; stats[boost]=clamp(stats[boost]+randi(8,14),1,99); }
  return {
    id: uid('F'),
    name: `${first} ${last}`,
    nickname: pick(NICK_POOL),
    gender, country: pick(COUNTRIES),
    dob, debut,
    division: divisionId,
    stats,
    longevity: randi(82,100),
    status:'active', // active | retired | injured
    injury:{active:false, untilDate:null, note:''},
    record:{wins:0,losses:0,draws:0,nc:0,koWins:0,subWins:0,decWins:0,koLosses:0,subLosses:0,decLosses:0,ufcFights:0,ufcWins:0,ufcLosses:0,ufcKoWins:0,ufcSubWins:0,ufcDecWins:0,ufcKoLosses:0,ufcSubLosses:0,ufcDecLosses:0},
    imageUrl:null,
    bonuses:{fightOfNight:0, performanceOfNight:0},
    titleReigns:[], // {titleId, wonDate, lostDate, defenses}
    fightHistory:[], // fightIds
    lastEventSeq:null,
    hof:false,
    rankScore:0,
    contract: makeContract(Math.round(STAT_KEYS.reduce((s,[k])=>s+stats[k],0)/STAT_KEYS.length))
  };
}

// ── Contrato: bolsa por pelea, peleas restantes, y "personalidad negociadora" ──
// `level` = nivel general aproximado (0-99, tipo generalScore()). `rep` = reputación/fama (0-100).
// Sin datos, asume un peleador medio. El salario sigue una curva de "estrellato": la fama pesa
// más que el nivel puro (como en la UFC real, donde el tirón de público manda más que el ranking),
// y crece de forma exponencial — la mayoría del roster cobra poco, pero las superestrellas
// cobran mucho más que proporcionalmente. Así hay disparidad real entre un peleador de prelims
// y un campeón mediático, en vez de una banda estrecha para todo el roster.
function starPower(level, rep){
  const lvl = level!=null ? level : randi(45,88);
  const fame = rep!=null ? rep : 50;
  return clamp(lvl*0.35 + fame*0.65, 0, 100);
}
// Curva de sueldo compartida (fichajes, negociación e ingresos de evento parten todos de aquí):
// exponente alto para que solo el tramo top (fama+nivel casi al máximo, tipo un Conor McGregor)
// se dispare muy por encima del resto — el grueso del roster apenas se mueve, pero una
// superestrella real puede llegar a cobrar varias veces más que un top-10 normal.
function starPayCurve(power){
  const t = clamp(power,0,100)/100;
  return 10000 + Math.pow(t,6.5)*2000000;
}
// Valor de mercado "justo" de un peleador para estimar ingresos de evento (independiente de lo
// que realmente cobra — ver el comentario en finishEvent). Reutilizado también por el creador
// de eventos para mostrar una estimación de ingresos/beneficio antes de simular.
function fairPurse(level, rep){ return starPayCurve(starPower(level, rep))*1.08; }
// opts: {isTitle, isInterim, isMinorTitle, isContender, isRival, isCallout} — el hype/estipulación
// del combate también vende entradas y PPV, no solo la fama individual de cada peleador.
function estimateFightRevenue(fairA, fairB, opts){
  opts = opts||{};
  let rev=(fairA+fairB)*1.13+12000;
  if(opts.isTitle) rev *= opts.isInterim ? 1.12 : opts.isMinorTitle ? 1.15 : 1.25;
  if(opts.isContender) rev *= 1.08;
  if(opts.isRival) rev *= 1.12;
  if(opts.isCallout) rev *= 1.10;
  return rev;
}
function fightRevenueOpts(ft, a, b){
  const title = ft.titleId ? STATE.titles.find(t=>t.id===ft.titleId) : null;
  return {
    isTitle: !!ft.titleId,
    isInterim: !!ft.isInterim,
    isMinorTitle: title?.kind==='minor',
    isContender: !!ft.isContender,
    isRival: (a && b) ? isRival(a.id, b.id) : false,
    isCallout: !!ft.isCallout,
  };
}
// Estimación de "compras PPV" — una métrica de cara al jugador, independiente de la economía
// abstracta en dólares, para que el hype de un cartel se sienta como una cifra real de UFC
// (100k de una cartelera floja, hasta millones para un evento estelar). Tira sobre todo del
// combate principal (idx 0), con un pequeño extra por la profundidad del resto de la cartelera.
function estimateEventBuys(ev){
  if(!ev.card.length) return 0;
  const main = ev.card[0];
  const mA=STATE.fighters.find(x=>x.id===main.fighterA), mB=STATE.fighters.find(x=>x.id===main.fighterB);
  if(!mA||!mB) return 0;
  const mainPower=(starPower(generalScore(mA),mA.reputation)+starPower(generalScore(mB),mB.reputation))/2;
  const t=mainPower/100;
  let buys = 40000 + Math.pow(t,4)*1400000;
  const opts = fightRevenueOpts(main, mA, mB);
  if(opts.isTitle) buys *= opts.isInterim ? 1.15 : opts.isMinorTitle ? 1.2 : 1.35;
  if(opts.isContender) buys *= 1.08;
  if(opts.isRival) buys *= 1.2;
  const restPower = ev.card.slice(1,4).reduce((s,ft)=>{
    const a=STATE.fighters.find(x=>x.id===ft.fighterA), b=STATE.fighters.find(x=>x.id===ft.fighterB);
    if(!a||!b) return s;
    return s+(starPower(generalScore(a),a.reputation)+starPower(generalScore(b),b.reputation))/2;
  },0);
  buys *= 1 + Math.min(0.15, restPower/100*0.03);
  return buys;
}
function makeContract(level, rep){
  const power = starPower(level, rep);
  const base = starPayCurve(power);
  const noise = 1 + randi(-15,15)/100;
  const salary = clamp(Math.round(base*noise/500)*500, 8000, 2500000);
  const finishBonus = clamp(Math.round(salary*0.4/500)*500, 3000, 1000000);
  return {
    salary,
    finishBonus,                    // extra si gana por KO/Sumisión
    fightsLeft: randi(2,5),         // combates restantes en el contrato actual
    demandLevel: clamp(Math.round(power*0.7+randi(-8,8)),5,95), // 0-100: los mejores exigen más al negociar
    loyalty: randi(20,80),          // 0-100: resistencia a irse por dinero a una rival
    signedDate: STATE.meta?.currentDate||null, // para el histórico de contratos del peleador
  };
}

const SPONSOR_NAMES = ['Rekt Energy','Ironclad Supplements','Apex Gear','Titan Nutrition','Warpath Apparel',
  'Blackout Energy','Grit Combat Wear','Northstar Bank','Momentum Insurance','Vortex Hydration','Fury Watches','Cage Fuel'];
// Tras cada combate, un peleador puede ganar o perder un patrocinador según su reputación y el resultado.
// El ingreso del sponsor se sim­plifica como "revuelo mediático" que suma a los ingresos del evento
// (no se lleva una cuenta bancaria separada por peleador) — ver economía en finishEvent().
function maybeUpdateSponsor(f, won, method){
  const rep = f.reputation||50;
  if(f.sponsor){
    let dropChance = 0.04;
    if(!won && method==='KO/TKO') dropChance += 0.14;
    else if(!won && method==='Sumisión') dropChance += 0.08;
    else if(!won) dropChance += 0.04;
    if(rep<45) dropChance += 0.15;
    if(Math.random()<dropChance){
      logEvent(`📉 ${fName(f)} pierde el patrocinio de ${f.sponsor.name}.`);
      f.sponsor=null;
    }
  } else if(rep>=58 && Math.random()<0.10+Math.max(0,(rep-58))*0.004){
    const incomePerFight = clamp(Math.round((rep-45)*300/1000)*1000, 2000, 60000);
    f.sponsor = {name: pick(SPONSOR_NAMES), incomePerFight};
    logEvent(`🤝 ${fName(f)} firma patrocinio con ${f.sponsor.name} ($${incomePerFight.toLocaleString()}/combate).`);
  }
}

    id: uid('F'), name:rf.name, nickname:rf.nickname, gender:rf.gender, country:rf.country,
    dob:rf.dob, debut:rf.debut, division:rf.division, stats, longevity,

    titleReigns:[], fightHistory:[], lastEventSeq:null,

  };
}

function seedFighters(){
  if(typeof INITIAL_STATE!=='undefined' && INITIAL_STATE){
    // Cargar el estado importado por el usuario (peleadores reales con récord, peleas UFC y campeones)
    const imported = JSON.parse(JSON.stringify(INITIAL_STATE));
    STATE.fighters = imported.fighters;
    STATE.titles = imported.titles;
    STATE.divisions = imported.divisions;
    STATE.meta = {...STATE.meta, ...imported.meta};
    if(imported.records) STATE.records = imported.records;
    STATE.rivalries = imported.rivalries || {};
    STATE.rematches = imported.rematches || {};
    STATE.atpPoints = imported.atpPoints || {};
    STATE.rankingHistory = imported.rankingHistory || [];
    STATE.statsHistory = imported.statsHistory || {};
    STATE.milestonesReached = imported.milestonesReached || [];
    STATE.newsLog = imported.newsLog || [];
    STATE.rivalNewsLog = imported.rivalNewsLog || [];
    // saneo: asegurar que todo peleador tiene los campos nuevos (ufcFights, imageUrl)
    STATE.fighters.forEach(f=>{
      // CRÍTICO: generar id si falta (peleadores importados sin id rompen toda la app)
      if(!f.id) f.id = uid('F');
      f.record = f.record || {};
      if(f.record.ufcFights==null) f.record.ufcFights = (f.record.wins||0)+(f.record.losses||0)+(f.record.draws||0)+(f.record.nc||0);
      if(f.record.ufcWins==null) f.record.ufcWins = Math.min(f.record.wins||0, f.record.ufcFights);
      if(f.record.ufcLosses==null) f.record.ufcLosses = Math.min(f.record.losses||0, Math.max(0,f.record.ufcFights-f.record.ufcWins));
      if(f.record.ufcKoWins==null) f.record.ufcKoWins = f.record.koWins||0;
      if(f.record.ufcSubWins==null) f.record.ufcSubWins = f.record.subWins||0;
      if(f.record.ufcDecWins==null) f.record.ufcDecWins = f.record.decWins||0;
      if(f.record.ufcKoLosses==null) f.record.ufcKoLosses = f.record.koLosses||0;
      if(f.record.ufcSubLosses==null) f.record.ufcSubLosses = f.record.subLosses||0;
      if(f.record.ufcDecLosses==null) f.record.ufcDecLosses = f.record.decLosses||0;
      if(f.imageUrl===undefined) f.imageUrl = null;
      if(f.imageUrl==null) f.imageUrl = '';
      // Campos opcionales que algunos peleadores importados pueden no tener
      if(!f.bonuses) f.bonuses = {fightOfNight:0, performanceOfNight:0};
      if(!f.titleReigns) f.titleReigns = [];
      if(!f.fightHistory) f.fightHistory = [];
      if(f.lastEventSeq===undefined) f.lastEventSeq = null;
      if(f.hof===undefined) f.hof = false;
      if(f.rankScore===undefined) f.rankScore = 0;
      if(f.longevity===undefined) f.longevity = 80;
      if(!f.injury) f.injury = {active:false, untilDate:null, note:''};
      if(!f.status) f.status = 'active';
      if(!f.gender) f.gender = 'M';
      // Asignar estilo de pelea si no lo tiene
      if(!f.fightStyle) f.fightStyle = FIGHTER_STYLES[f.name] || 'technical';
      // Daño acumulado de KO en la carrera (afecta al chin efectivo en simulación)
      if(f.chinDamage==null) f.chinDamage = Math.min((f.record.ufcKoLosses||0)*2, 15);
      // Racha empieza siempre en 0 al cargar el estado inicial
      f.momentum = 0;
      // Roster inicial de la UFC: todos arrancan con 3 peleas de contrato restante
      if(!f.contract) f.contract = {...makeContract(generalScore(f), f.reputation), fightsLeft:3};
    });
  } else {
    STATE.fighters = REAL_FIGHTERS.map(makeRealFighter);
  }
  // si alguna categoría se quedara con menos de 2 peleadores, se completa con generados aleatoriamente
  DIVISIONS.forEach(div=>{
    const count = STATE.fighters.filter(f=>f.division===div.id).length;
    for(let i=count;i<2;i++) STATE.fighters.push(makeFighter(div.id, div.gender));
  });
  // asegurar que existen los títulos de división + BMF (por si el estado importado no los trae todos)
  DIVISIONS.forEach(d=>{
    if(!STATE.titles.find(t=>t.divisionId===d.id)){
      STATE.titles.push({id: uid('T'), name: `Cinturón de ${divName(d.id)}`, divisionId:d.id, holderId:null, interimHolderId:null, isInterim:false, history:[]});
    }
  });
  if(!STATE.titles.find(t=>t.divisionId===null)){
    STATE.titles.push({id:uid('T'), name:'Cinturón BMF', divisionId:null, holderId:null, interimHolderId:null, isInterim:false, history:[]});
  }
  STATE.divisions.forEach(d=>{
    const t = STATE.titles.find(x=>x.divisionId===d.id);
    d.championId = t? t.holderId : null;
  });

  // Garantizar mínimo 15 peleadores activos por categoría (genera peleadores automáticamente si faltan)
  autoFillDivisions();
  // Inicializar snapshots de stats para todos los peleadores (para que el gráfico de evolución tenga un punto inicial)
  if(!STATE.statsHistory) STATE.statsHistory={};
  STATE.fighters.forEach(f=>{ if(!STATE.statsHistory[f.id]||STATE.statsHistory[f.id].length===0) saveStatSnapshot(f, STATE.meta.currentDate, 'Inicio'); });
  logEvent(`Liga inicializada con ${STATE.fighters.length} peleadores.`);
  saveLocal();
}

/* ====================== PROMOTORAS RIVALES ====================== */
// Peleador "ligero" de una promotora rival: solo lo justo para correr por simulateFight()
// y llevar un récord/campeones propios — no participa en el resto de sistemas del jugador.
function makeRivalFighter(divisionId){
  const first=pick(FIRST_M), last=pick(LAST);
  const age=randi(21,34);
  const dob=`${2026-age}-${String(randi(1,12)).padStart(2,'0')}-${String(randi(1,28)).padStart(2,'0')}`;
  const stats={}; STAT_KEYS.forEach(([k])=>stats[k]=randi(45,85));
  return {
    id: uid('RF'), name:`${first} ${last}`, division:divisionId, dob,
    stats, fightStyle: pick(Object.keys(FIGHT_STYLES)), chinDamage:0,
    record:{wins:0,losses:0}, longevity: randi(70,100),
  };
}
const RIVAL_PROMOTION_SEEDS = [
  {name:'Apex Fighting Championship', short:'AFC'},
  {name:'Global Combat League', short:'GCL'},
  {name:'Iron Cage Federation', short:'ICF'},
];
function seedRivalPromotions(){
  STATE.rivalPromotions = RIVAL_PROMOTION_SEEDS.map(rn=>{
    const fighters=[];
    DIVISIONS.forEach(d=>{ for(let i=0;i<randi(4,7);i++) fighters.push(makeRivalFighter(d.id)); });
    const titles = DIVISIONS.map(d=>{
      const pool=fighters.filter(f=>f.division===d.id);
      const champ = pool.length? pick(pool): null;
      return {divisionId:d.id, holderId:champ?champ.id:null, holderName:champ?champ.name:null};
    });
    const prestige = randi(25,55);
    return {
      id: uid('RP'), name:rn.name, short:rn.short,
      // prestigeBaseline = "nivel" real/tier de la promotora — el prestigio fluctúa por resultados
      // recientes pero siempre revierte hacia este ancla, para que no todas converjan a 99 con el tiempo.
      prestige, prestigeBaseline: prestige, budget: randi(1,4)*1000000,
      fighters, titles, recentEvents:[], eventSeq:1,
    };
  });
}
// Noticia cruzada de una promotora rival — feed SEPARADO del tuyo (STATE.rivalNewsLog), para
// que el mundo rival se sienta vivo sin mezclarse con las noticias de tu propia liga.
function pushRivalNews(promo, msg, date){
  if(!STATE.rivalNewsLog) STATE.rivalNewsLog=[];
  STATE.rivalNewsLog.unshift({date, promo:promo.short||promo.name, msg});
  if(STATE.rivalNewsLog.length>60) STATE.rivalNewsLog.length=60;
}
// Mínimo de peleadores por división que una promotora rival mantiene en plantilla — el
// extremo bajo del rango original con el que se sembró (randi(4,7) en seedRivalPromotions).
const RIVAL_MIN_ROSTER_PER_DIV = 4;
// Simula un evento interno de una promotora rival: 2-4 combates entre peleadores propios
// de la misma división, reutilizando el motor real (simulateFight). Actualiza récords,
// campeones propios y prestigio — no toca nada del roster del jugador. También aplica
// desgaste/retiro por edad a quien pelea (igual que a tu propio roster) y repone con
// debutantes, para que la plantilla rival tenga el mismo ciclo de vida que la tuya.
function simulateRivalEvent(promo, date){
  const byDiv = {};
  promo.fighters.forEach(f=>{ (byDiv[f.division]=byDiv[f.division]||[]).push(f); });
  const candidateDivs = Object.keys(byDiv).filter(d=>byDiv[d].length>=2);
  if(!candidateDivs.length) return null;
  const numFights = randi(2,4);
  const usedIds = new Set();
  const fights = [];
  const retiredIds = new Set();
  for(let i=0;i<numFights;i++){
    const div = pick(candidateDivs);
    const pool = byDiv[div].filter(f=>!usedIds.has(f.id));
    if(pool.length<2) continue;
    const a = pick(pool);
    const b = pick(pool.filter(f=>f.id!==a.id));
    usedIds.add(a.id); usedIds.add(b.id);
    const title = promo.titles.find(t=>t.divisionId===div);
    const isTitleFight = title && (title.holderId===a.id || title.holderId===b.id) && Math.random()<0.4;
    const r = simulateFight(a, b, {rounds: isTitleFight?5:3});
    const winner = r.winner.id===a.id? a : b, loser = r.winner.id===a.id? b : a;
    winner.record.wins++; loser.record.losses++;
    if(isTitleFight && title.holderId!==winner.id){
      const prevHolderName=title.holderName;
      title.holderId=winner.id; title.holderName=winner.name;
      pushRivalNews(promo, `${winner.name} le arrebata el título de ${divName(div)} a ${prevHolderName||'?'} en ${promo.short}.`, date);
    }
    else if(title && !title.holderId){
      title.holderId=winner.id; title.holderName=winner.name;
      pushRivalNews(promo, `${winner.name} se corona primer campeón de ${divName(div)} en ${promo.short} (título vacante).`, date);
    }
    fights.push({aName:a.name,bName:b.name,winnerName:winner.name,method:methodLabel(r),round:r.round,divisionId:div,titleFight:!!isTitleFight});

    // Desgaste + retiro por edad/longevidad — mismo criterio que applyPostFightWearAndInjury,
    // simplificado (sin lesiones: estos peleadores no participan en tu sistema de enfermería).
    [winner, loser].forEach(rf=>{
      let wear = randi(1,3);
      if(r.method!=='Decisión') wear += randi(0,2);
      rf.longevity = clamp((rf.longevity??80)-wear, 0, 100);
      const age = ageFromDob(rf.dob, date);
      let retireProb=0;
      if(age>=39) retireProb+=0.35; else if(age>=36) retireProb+=0.16; else if(age>=33) retireProb+=0.05;
      if(rf.longevity<=15) retireProb+=0.45; else if(rf.longevity<=30) retireProb+=0.2; else if(rf.longevity<=45) retireProb+=0.08;
      if(!retiredIds.has(rf.id) && Math.random()<clamp(retireProb,0,0.9)){
        retiredIds.add(rf.id);
        const heldTitle=promo.titles.find(t=>t.holderId===rf.id);
        if(heldTitle){
          pushRivalNews(promo, `${rf.name} se retira siendo campeón de ${divName(heldTitle.divisionId)} en ${promo.short} — el título queda vacante.`, date);
          heldTitle.holderId=null; heldTitle.holderName=null;
        }
      }
    });
  }
  if(!fights.length) return null;
  // Retirar a quien lo haya ganado, y reponer cada división hasta el mínimo con debutantes.
  if(retiredIds.size) promo.fighters = promo.fighters.filter(f=>!retiredIds.has(f.id));
  DIVISIONS.forEach(d=>{
    const count = promo.fighters.filter(f=>f.division===d.id).length;
    for(let i=count;i<RIVAL_MIN_ROSTER_PER_DIV;i++) promo.fighters.push(makeRivalFighter(d.id));
  });
  promo.eventSeq++;
  const ev = {id:uid('RPEV'), name:`${promo.short} ${promo.eventSeq}`, date, fights};
  promo.recentEvents.unshift(ev);
  if(promo.recentEvents.length>15) promo.recentEvents.length=15;
  // Prestigio: fluctúa con los resultados recientes (más si hubo pelea de título) pero
  // siempre revierte hacia su prestigeBaseline (el "nivel" real de la promotora), para que
  // no todas las rivales converjan monótonamente a 99 con el tiempo.
  if(promo.prestigeBaseline==null) promo.prestigeBaseline = promo.prestige;
  const prestigeSwing = fights.some(f=>f.titleFight) ? randi(-1,3) : randi(-2,2);
  const prestigeReversion = Math.round((promo.prestigeBaseline - promo.prestige) * 0.08);
  promo.prestige = clamp(promo.prestige + prestigeSwing + prestigeReversion, 5, 99);
  promo.budget += randi(20,80)*1000;
  if(!promo.prestigeHistory) promo.prestigeHistory=[];
  promo.prestigeHistory.push({date, prestige:promo.prestige});
  if(promo.prestigeHistory.length>60) promo.prestigeHistory.shift();
  return ev;
}
// Avanza todas las promotoras rivales un "turno" — se llama cada vez que el jugador
// termina uno de sus propios eventos, para que el mundo rival progrese al mismo ritmo.
function advanceRivalPromotions(date){
  (STATE.rivalPromotions||[]).forEach(promo=>{ if(Math.random()<0.7) simulateRivalEvent(promo, date); });
  // Snapshot del prestigio del jugador al mismo ritmo, para la gráfica comparativa de Promotoras.
  if(!STATE.playerPrestigeHistory) STATE.playerPrestigeHistory=[];
  STATE.playerPrestigeHistory.push({date, prestige:playerPrestige()});
  if(STATE.playerPrestigeHistory.length>60) STATE.playerPrestigeHistory.shift();
}
// ¿Hay una promotora rival interesada en robar a este peleador al expirar su contrato?
// Devuelve null (nadie pica) o {promoId, promoName, amount} — la oferta que usará de palanca en la negociación.
function computeRivalInterest(f){
  if(!STATE.rivalPromotions||!STATE.rivalPromotions.length) return null;
  const interested = STATE.rivalPromotions.filter(()=>Math.random()<0.35);
  if(!interested.length) return null;
  const rp = pick(interested);
  const base = (f.contract?.salary)||20000;
  const amount = Math.round(base*(1.05+Math.random()*0.35)/1000)*1000;
  return {promoId:rp.id, promoName:rp.name, amount};
}

/* ====================== MOTOR DE SIMULACIÓN ====================== */
// Estima el % de victoria simulando el combate muchas veces con el mismo motor real (round a round),
// no con una comparación de nivel general. Así el striker con buena TDD, el pegador con poco nivel
// general pero mucho KO, el wrestler de control, etc. se reflejan correctamente en el marchmaking.
function winProbabilities(fA, fB, rounds=3){
  const N = 400; // más muestras = probabilidad más suavizada
  // Aplica el mismo bonus de racha que usa la simulación real (momentumBonus) — si no, el
  // % mostrado antes del combate no reflejaba que un peleador en racha caliente ya llega
  // reforzado, y podía no coincidir con lo que realmente decide el resultado.
  const mA=momentumBonus(fA), mB=momentumBonus(fB);
  const fAb=mA?{...fA,stats:{...fA.stats,...Object.fromEntries(Object.entries(fA.stats).map(([k,v])=>[k,Math.min(99,v+mA)]))}}:fA;
  const fBb=mB?{...fB,stats:{...fB.stats,...Object.fromEntries(Object.entries(fB.stats).map(([k,v])=>[k,Math.min(99,v+mB)]))}}:fB;
  let winsA = 0;
  for(let i=0;i<N;i++){
    if(simulateFight(fAb, fBb, {rounds}).winner===fAb) winsA++;
  }
  const raw = winsA/N*100;
  // Comprimir hacia 50 para reflejar la aleatoriedad real del deporte
  // Un 85% simulado → 72% mostrado, un 60% → 57%, un 50% → 50%
  const compressed = 50 + (raw-50)*0.75;
  const probA = clamp(Math.round(compressed), 5, 95);
  return {probA, probB: 100-probA};
}
function overallRating(f){
  const s=f.stats;
  let base = s.power*0.15 + s.striking*0.22 + s.wrestlingOff*0.14 + s.wrestlingDef*0.12 + s.ground*0.15 + s.cardio*0.12 + s.chin*0.10;
  base *= (f.longevity/100)*0.25 + 0.75; // el desgaste resta un poco de rendimiento
  return base;
}

    m:n=>[`${n} dispara la doble pero el rival sprawla brillantemente.`,`Defensa de derribo — ${n} no consigue el doble.`,`El rival bloquea la cadera de ${n} — sprawl perfecto.`,`${n} intenta la doble pero el rival se pelea con el cuello y aguanta.`]},
  single_leg:{
    l:n=>[`${n} consigue la pierna y completa el derribo.`,`Pierna simple de ${n} — agarra, gira y derriba.`,`${n} captura la pierna y lleva al rival a la lona.`,`${n} tira del single leg y usa la cadera para terminar el derribo.`],
    m:n=>[`${n} agarra la pierna pero el rival aguanta y escapa.`,`El rival aguanta en pie — ${n} no puede completar el single.`,`${n} tiene la pierna pero el rival lo apoya contra la jaula.`]},
  trip:{
    l:n=>[`Trip desde el clinch de ${n} — el rival cae.`,`${n} usa el cuerpo a cuerpo para llevarlo al suelo.`,`${n} engancha la pierna desde el clinch y ejecuta el trip. ¡Limpio!`,`${n} usa la jaula, gira y hace caer al rival.`],
    m:n=>[`${n} intenta el trip pero su rival aguanta.`,`El rival sale del clinch antes de que ${n} pueda ejecutar el trip.`]},
  RNC:{l:(w,l)=>[`¡${w} consigue la espalda y aprieta el cuello! ${l} golpea la lona.`,`¡Rear naked choke de ${w}! ${l} se duerme.`,`${w} encaja ambos ganchos, busca el cuello y aprieta — ${l} no tiene salida.`,`${w} comprime la carótida con el RNC. ${l} palmea antes de perder el conocimiento.`],att:n=>[`${n} se mueve a la espalda buscando el RNC.`,`${n} encaja un gancho y busca el cuello.`,`${n} tiene la espalda — busca la mano libre para cerrar el RNC.`],esc:(n,d)=>[`${d} defiende — escapa del intento de RNC de ${n}.`,`${d} mete la barbilla y libera el cuello — sale del RNC de ${n}.`,`${d} gira el cuerpo y escapa antes de que ${n} cierre el choke.`]},
  triangle:{l:(w,l)=>[`¡${w} cierra el triángulo! ${l} golpea la lona.`,`¡Triángulo de ${w}! ${l} toca.`,`${w} cruza la pierna, sube las caderas y aprieta el triángulo — ${l} toca.`,`${w} consigue el ángulo, cierra el triángulo y ${l} se rinde.`],att:n=>[`${n} busca el triángulo desde la guardia.`,`${n} lleva las piernas hacia el cuello — intenta cerrar el triángulo.`],esc:(n,d)=>[`${d} eleva y escapa del triángulo de ${n}.`,`${d} apila al rival y consigue sacar la cabeza del triángulo de ${n}.`]},
  armbar:{l:(w,l)=>[`¡${w} gira para el armbar! ${l} grita de dolor y cede.`,`Armbar limpio de ${w} — el brazo no puede más.`,`${w} extiende el brazo, bloquea la cadera y aplica el armbar — ${l} toca.`,`${w} captura el brazo, gira y tira — el codo de ${l} no aguanta más.`],att:n=>[`${n} intenta el armbar desde la guardia.`,`${n} abre las piernas y gira en busca del armbar.`],esc:(n,d)=>[`${d} apila y escapa del armbar de ${n}.`,`${d} gira el codo y libera el brazo del armbar de ${n}.`]},
  guillotine:{l:(w,l)=>[`¡Guillotina de ${w}! ${l} toca.`,`${w} atrapa el cuello y aprieta.`,`${w} captura la cabeza cuando ${l} intenta el derribo — guillotina de cuello.`,`${w} cae a la guardia con la guillotina cerrada y ${l} no tiene salida.`],att:n=>[`${n} busca la guillotina en la separación.`,`${n} captura la cabeza del rival en el momento del derribo — guillotina.`],esc:(n,d)=>[`${d} mete la cabeza y escapa de la guillotina de ${n}.`,`${d} sale a un lado — la guillotina de ${n} no tiene el ángulo.`]},
  heel_hook:{l:(w,l)=>[`¡Heel hook de ${w}! ${l} no puede girar y cede.`,`¡${w} atrapa el talón! ${l} toca inmediatamente.`,`${w} captura la pierna y aplica el heel hook — ${l} toca antes de que algo cruja.`,`${w} entra al inside heel hook — ${l} sabe que si no toca la rodilla explota.`],att:n=>[`${n} va a buscar el heel hook.`,`${n} cae al entangle y busca el talón.`],esc:(n,d)=>[`${d} gira correctamente y escapa del heel hook de ${n}.`,`${d} siente el heel hook de ${n} pero gira a tiempo y libera el pie.`]},
  kimura:{l:(w,l)=>[`¡Kimura de ${w}! ${l} debe ceder antes de que le rompan el brazo.`,`${w} consigue el kimura desde la guardia lateral.`,`${w} captura el brazo, gira y aprieta el kimura — ${l} toca o se rompe.`,`${w} encaja el grip de kimura y usa el cuerpo para dar la vuelta — ${l} se rinde.`],att:n=>[`${n} busca el kimura desde el suelo.`,`${n} captura la muñeca y busca el ángulo para el kimura.`],esc:(n,d)=>[`${d} escapa del kimura de ${n} rodando.`,`${d} libera el brazo antes de que ${n} pueda cerrar el kimura.`]},
};

const _pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const _fmt=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const _emptyStats=()=>({sigL:0,sigA:0,headL:0,bodyL:0,legsL:0,tdL:0,tdAtt:0,subAtt:0,kd:0,ctrl:0,fightTime:0});

// ── Selección de técnica según estilo ─────────────────────────────────────────
function _pickTech(style, hLegs){
  const pools={
    finisher: [['cross',3],['hook',3],['uppercut',2],['head_kick',2],['body_punch',1],['jab',1],['spinning',1]],
    pressure: [['jab',3],['body_punch',3],['cross',2],['body_kick',2],['hook',2],['leg_kick',2]],
    counter:  [['cross',3],['hook',2],['uppercut',2],['jab',2],['head_kick',1],['spinning',1]],
    technical:[['jab',3],['cross',2],['body_kick',2],['leg_kick',2],['body_punch',2],['uppercut',1]],
    grappler: [['jab',2],['cross',1],['body_punch',2],['body_kick',1],['hook',1]],
    submission:[['jab',2],['cross',1],['body_punch',2],['body_kick',1]],
  };
  let pool=([...(pools[style]||pools.technical)]);
  if(hLegs<70) pool.push(['leg_kick',2]);
  if(hLegs<50) pool.push(['leg_kick',3]);
  const tot=pool.reduce((s,[,w])=>s+w,0);
  let r=Math.random()*tot;
  for(const [t,w] of pool){r-=w;if(r<=0)return t;}
  return 'jab';
}

// ── Resolución de una acción ──────────────────────────────────────────────────
function _resolveAct(pos, fA, fB, sA, sB, hA, hB, styleA, styleB, round, totalRounds){
  const R=round/totalRounds;
  const act={type:'strike',subtype:'jab',narr:'',dA:0,dB:0,npos:pos,kd:null,fin:null,
    sigA:false,missA:false,sigB:false,missB:false,zoneA:null,zoneB:null,
    tdAttA:false,tdLandedA:false,tdAttB:false,tdLandedB:false,
    subAttA:false,subAttB:false,kdA:false,kdB:false,ctrlA:0,ctrlB:0,dur:15};

  // ── STANDING ─────────────────────────────────────────────────────────────
  if(pos==='standing'){
    // Decide quién ataca (influenciado por estilo y momentum)
    const aggrA=(styleA==='pressure'?0.60:styleA==='finisher'?0.55:styleA==='counter'?0.40:0.50)
               +(sA.str-sB.str)/400;
    const attackerIsA=Math.random()<clamp(aggrA,0.25,0.75);
    const att=attackerIsA?fA:fB, def=attackerIsA?fB:fA;
    const sAtt=attackerIsA?sA:sB, sDef=attackerIsA?sB:sA;
    const hDef=attackerIsA?hB:hA;
    const styleAtt=attackerIsA?styleA:styleB;
    const styleDef=attackerIsA?styleB:styleA;

    // Para el técnico completo: adapta su plan según el estilo del rival
    const _oppIsStriker=(['finisher','counter','pressure'].includes(styleDef));
    const _oppIsGrappler=(['grappler','submission'].includes(styleDef));

    // Probabilidad de intento de derribo — técnico lee al rival
    const tdProb=styleAtt==='grappler'?0.22
      :styleAtt==='submission'?0.22
      :styleAtt==='pressure'?0.10
      :styleAtt==='technical'?(_oppIsStriker?0.22:_oppIsGrappler?0.07:0.18)  // vs striker→wrestler; vs grappler→striker
      :0.06;
    
    if(Math.random()<tdProb){
      // TAKEDOWN ATTEMPT
      const tdType=Math.random()<0.5?'double_leg':'single_leg';
      // Finishers sprawl más agresivamente para evitar el suelo (su peor escenario)
      const _sprawlBonus=(attackerIsA?styleB:styleA)==='finisher'?1.06:1.0;
      const tdSuccess=(sAtt.woff*(0.8+Math.random()*0.4))>(sDef.wdef*(0.8+Math.random()*0.4)*0.92*_sprawlBonus);
      act.type='takedown'; act.subtype=tdType; act.dur=22;
      act[attackerIsA?'tdAttA':'tdAttB']=true;
      if(tdSuccess){
        act[attackerIsA?'tdLandedA':'tdLandedB']=true;
        act.npos=attackerIsA?'ground_A_top':'ground_B_top';
        const slamDmg=randi(3,6);
        if(attackerIsA){act.dB=slamDmg; act.zoneA='body';} else {act.dA=slamDmg; act.zoneB='body';}
        act.narr=_pick(_N[tdType].l(att.name));
        if(attackerIsA){act.ctrlA=35;} else {act.ctrlB=35;}
      } else {
        act.narr=_pick(_N[tdType].m(att.name));
        act.npos='standing';
      }
      return act;
    }

    // Clinch entry
    const clinchProb=styleAtt==='grappler'?0.14:styleAtt==='pressure'?0.13:styleAtt==='submission'?0.16:styleAtt==='technical'?(_oppIsStriker?0.14:_oppIsGrappler?0.06:0.12):0.08;
    if(Math.random()<clinchProb){ act.type='clinch_entry'; act.npos='clinch'; act.dur=12;
      act.narr=`${att.name} busca el cuerpo a cuerpo y consigue el clinch.`; return act; }

    // STRIKING BURST — 2-4 attempts to reflect realistic volume
    const tech=_pickTech(styleAtt, attackerIsA?hDef.legs:hA.legs);
    const techData=_T[tech]||_T.jab;
    act.type='strike'; act.subtype=tech; act.dur=techData[4];
    const zone=techData[1];
    const defStat=attackerIsA?sB.def:sA.def;
    const accAdj=techData[3]*(0.6+sAtt.str/100*0.7)*(1-defStat*0.35);

    // Burst: múltiples golpes por intercambio, ONE check de KO al final
    const burstSize=styleAtt==='pressure'?randi(3,5):styleAtt==='finisher'?randi(3,5):styleAtt==='counter'?randi(2,4):styleAtt==='technical'?(_oppIsGrappler?randi(4,6):randi(3,5)):randi(2,3);
    let landedCount=0, totalDmg=0;
    for(let bi=0;bi<burstSize;bi++){
      const bl=Math.random()<clamp(accAdj,0.10,0.82);
      if(bl){landedCount++;const bd=zone==='head'?randi(4,10):zone==='body'?randi(3,9):randi(2,6);totalDmg+=Math.round(bd*techData[2]*(0.7+sAtt.pow/100*0.6));}
      if(attackerIsA){if(bl)act.sigA=(act.sigA||0)+1;else act.missA=(act.missA||0)+1;}else{if(bl)act.sigB=(act.sigB||0)+1;else act.missB=(act.missB||0)+1;}
    }
    // Counter: un intento del defensor
    const techB=_pickTech(attackerIsA?styleB:styleA,attackerIsA?hA.legs:hB.legs);
    const techDataB=_T[techB]||_T.cross; const zoneB=techDataB[1];
    const accAdjB=techDataB[3]*(0.6+(attackerIsA?sB.str:sA.str)/100*0.7)*(1-(attackerIsA?sA.def:sB.def)*0.35);
    const cLanded=Math.random()<clamp(accAdjB*0.48,0.07,0.58);
    let cDmg=0;
    if(cLanded){cDmg=Math.round((zoneB==='head'?randi(3,8):randi(2,6))*techDataB[2]*(0.65+(attackerIsA?sB.pow:sA.pow)/100*0.5));}
    else{if(attackerIsA)act.missB=(act.missB||0)+1;else act.missA=(act.missA||0)+1;}

    if(landedCount>0){
      if(attackerIsA){act.dB=totalDmg;act.zoneA=zone;}else{act.dA=totalDmg;act.zoneB=zone;}
      act.narr=_pick(_N[tech].l(att.name));
    } else {
      act.narr=_pick(_N[tech].m(att.name));
    }
    if(cLanded){
      if(attackerIsA){act.dA=cDmg;act.zoneB=zoneB;act.sigB=(act.sigB||0)+1;}else{act.dB=cDmg;act.zoneA=zoneB;act.sigA=(act.sigA||0)+1;}
      act.narr+=' '+def.name+(zoneB==='head'?' responde al mentón.':' contraataca al cuerpo.');
    }

    // ONE KO check per exchange — con multiplicador de peso y estilo finalizador
    if(landedCount>0 && zone==='head'){
      const koM=sAtt.koMult||1; // peso pesado / finisher / counter bonus
      const effChin=attackerIsA?(sB.chin*(1-clamp((100-hB.head)/160,0,0.5))):(sA.chin*(1-clamp((100-hA.head)/160,0,0.5)));
      const kdChance=clamp((sAtt.pow*0.90-effChin*0.84)/300,0,0.033)*koM*(1+R*0.4)*Math.min(landedCount,2)*0.6;
      if(Math.random()<kdChance){
        act.narr=`⚡ ¡${att.name} conecta y ${def.name} va a la lona!`;
        if(attackerIsA){act.kdB=true;act.kd='B';act.dB+=8;}else{act.kdA=true;act.kd='A';act.dA+=8;}
        const koChance=clamp((sAtt.pow-effChin*0.73)/235,0,0.11)*koM*(1+R*0.5);
        if(Math.random()<koChance){act.fin={s:attackerIsA?'A':'B',m:'KO/TKO'};act.narr=_pick([`💥 ¡${att.name} conecta el golpe definitivo y ${def.name} cae! ¡El árbitro para!`,`💥 ¡Nocaut! ${att.name} encuentra el hueco.`]);}
      }
      if(!act.fin){
        const directKo=clamp((sAtt.pow*(0.7+Math.random()*0.6)-effChin*(0.84+Math.random()*0.4))/490,0,0.0075)*koM*(1+R*0.25);
        if(Math.random()<directKo){act.fin={s:attackerIsA?'A':'B',m:'KO/TKO'};act.narr=_pick([`💥 ¡${att.name} conecta el upper perfecto y ${def.name} cae!`,`💥 Combinación demoledora de ${att.name} — el árbitro interviene.`]);}
      }
    }

    // CONTRA-ATAQUE: counter fighters responden al ataque con 1 golpe limpio (28% prob)
    // Counter-attack: harder vs explosive finisher combos, easier vs predictable pressure
    const _ctrTrig = (attackerIsA?styleA:styleB)==='finisher'?0.08:(attackerIsA?styleA:styleB)==='pressure'?0.18:0.12;
    if(!act.fin && (attackerIsA?styleB:styleA)==='counter' && Math.random()<_ctrTrig){
      const cSAtt=attackerIsA?sB:sA;
      const cEffChin=attackerIsA?(sA.chin*(1-clamp((100-hA.head)/160,0,0.5))):(sB.chin*(1-clamp((100-hB.head)/160,0,0.5)));
      const cKoMult=attackerIsA?sA.koMult:sB.koMult;
      const cLanded=Math.random()<0.52; // counter fighters son precisos
      if(cLanded){
        const cDmg=Math.round(randi(4,10)*1.1*(0.75+cSAtt.pow/100*0.45));
        if(attackerIsA){act.sigB=(act.sigB||0)+1;act.dA=(act.dA||0)+cDmg;act.zoneB='head';}
        else{act.sigA=(act.sigA||0)+1;act.dB=(act.dB||0)+cDmg;act.zoneA='head';}
        act.narr=(act.narr||'')+` ${attackerIsA?def.name:att.name} responde con un counter.`;
        // Posibilidad de KO en counter (counter golpea a alguien que viene en movimiento = más daño)
        if(Math.random()<clamp((cSAtt.pow-cEffChin*0.73)/235,0,0.11)*cKoMult*(1+R*0.5)){
          act.fin={s:attackerIsA?'B':'A',m:'KO/TKO'};
          act.narr=_pick([`💥 ¡${attackerIsA?fB.name:fA.name} aprovecha el hueco y conecta el counter perfecto — NOCAUT!`,`💥 Counter demoledor de ${attackerIsA?fB.name:fA.name}! El árbitro para.`]);
        }
      }
    }
    return act;
  }

  // ── CLINCH ───────────────────────────────────────────────────────────────
  if(pos==='clinch'){
    const domA=(sA.woff+sA.str)*( 0.8+Math.random()*0.4)>(sB.woff+sB.str)*(0.8+Math.random()*0.4);
    const domN=domA?fA.name:fB.name, subN=domA?fB.name:fA.name;
    act.type='clinch'; act.dur=18;

    const tdFromClinch=Math.max(styleA==='grappler'?0.45:styleA==='submission'?0.50:0.22,
                                styleB==='grappler'?0.45:styleB==='submission'?0.50:0.22);
    if(Math.random()<tdFromClinch){
      const tripSuccess=Math.random()<0.55;
      act.subtype='trip';
      if(tripSuccess){
        const attIsA=(styleA==='grappler'||styleA==='submission')&&Math.random()<0.6;
        act.npos=attIsA?'ground_A_top':'ground_B_top';
        if(attIsA){act.tdLandedA=true;act.tdAttA=true;act.ctrlA=30;}
        else {act.tdLandedB=true;act.tdAttB=true;act.ctrlB=30;}
        act.narr=_pick(_N.trip.l(attIsA?fA.name:fB.name));
      } else {
        act.npos='standing'; act.narr=_pick(_N.trip.m(domN));
      }
    } else {
      // Clinch strikes
      act.subtype='clinch_work';
      const kneeDmgA=randi(3,8), kneeDmgB=randi(3,8);
      if(domA){act.dB=kneeDmgA+2; act.dA=kneeDmgB-2; act.sigA=true; act.zoneA='body';}
      else {act.dA=kneeDmgA+2; act.dB=kneeDmgB-2; act.sigB=true; act.zoneB='body';}
      act.npos=Math.random()<0.45?'standing':'clinch';
      act.narr=`${domN} domina el clinch con rodillazos al cuerpo. ${act.npos==='standing'?'El árbitro los separa.':''}`;
    }
    return act;
  }

  // ── SUELO — TOP ────────────────────────────────────────────────────────
  if(pos==='ground_A_top'||pos==='ground_B_top'){
    const topIsA=pos==='ground_A_top';
    const topF=topIsA?fA:fB, botF=topIsA?fB:fA;
    const sTop=topIsA?sA:sB, sBot=topIsA?sB:sA;
    const hBot=topIsA?hB:hA;

    act.ctrlA=topIsA?30:0; act.ctrlB=topIsA?0:30;
    act.dur=28;

    // Sub attempt check
    const _styleTop=topIsA?styleA:styleB;
    const _styleBotOpp=topIsA?styleB:styleA;
    const _topOppIsStriker=['finisher','counter','pressure'].includes(_styleBotOpp);
    const subProb=_styleTop==='submission'?0.24:_styleTop==='grappler'?0.18
      :_styleTop==='technical'?(_topOppIsStriker?0.22:0.12):0.08;
    if(Math.random()<subProb||(pos==='back_A'||pos==='back_B')){
      const subs=['RNC','triangle','armbar','guillotine','kimura','heel_hook'];
      const subWeights=[3,2,2,2,1,1]; const subW=subWeights.reduce((a,b)=>a+b);
      let sr=Math.random()*subW; let subType='RNC';
      subs.forEach((s,i)=>{sr-=subWeights[i]; if(sr<=0&&subType==='RNC'&&i>0) subType=subs[i];});
      // Back position heavily favors RNC
      if(pos==='back_A'||pos==='back_B') subType='RNC';
      
      act.type='sub_attempt'; act.subtype=subType;
      if(topIsA) act.subAttA=true; else act.subAttB=true;
      act.narr=_pick((_N[subType]?.att||_N.RNC.att)(topF.name));

      const subSucc=(sTop.grd*(0.8+Math.random()*0.4))>(sBot.sub_esc*(0.8+Math.random()*0.4)*100*1.25);
      if(subSucc){
        act.fin={s:topIsA?'A':'B', m:'Sumisión'};
        act.narr=_pick((_N[subType]?.l||_N.RNC.l)(topF.name, botF.name));
      } else {
        act.narr=_pick((_N[subType]?.esc||_N.RNC.esc)(topF.name, botF.name));
        // Escape to standing
        const escapeProb=clamp(0.30+(sBot.wdef/100)*0.25+(sBot.card/100)*0.15-(sTop.woff/100)*0.15,0.22,0.65);
        act.npos=Math.random()<escapeProb?'standing':pos;
      }
      return act;
    }

    // GnP
    act.type='gnp';
    const gnpTech=Math.random()<0.35?'gnp_elbow':'gnp_punch';
    act.subtype=gnpTech; const zone=_T[gnpTech][1];
    const gnpAcc=_T[gnpTech][3]*(0.6+sTop.str/100*0.6);
    const gnpLanded=Math.random()<clamp(gnpAcc,0.3,0.78);
    if(gnpLanded){
      const dmg=Math.round((randi(5,12))*_T[gnpTech][2]*(0.7+sTop.pow/100*0.5));
      if(topIsA){act.dB=dmg;act.sigA=true;act.zoneA=zone;}else{act.dA=dmg;act.sigB=true;act.zoneB=zone;}
      act.narr=_pick(_N[gnpTech].l(topF.name));
      // TKO from GnP
      const effChin=topIsA?(sB.chin*(1-clamp((100-hB.head)/160,0,0.5))):(sA.chin*(1-clamp((100-hA.head)/160,0,0.5)));
      const tkoChance=clamp((sTop.pow-effChin*0.88)/255,0,0.025)*(sTop.wMult||1)*(1+R*0.25);
      if(Math.random()<tkoChance){
        act.fin={s:topIsA?'A':'B', m:'KO/TKO'};
        act.narr=`💥 ¡Ground and pound devastador de ${topF.name}! El árbitro interviene para proteger a ${botF.name}.`;
      }
    } else {
      act.narr=_pick(_N[gnpTech].m(topF.name));
    }

    // Bottom fighter scramble attempt
    const escapeProb=clamp(0.28+(sBot.wdef/100)*0.22+(sBot.card/100)*0.15-(sTop.woff/100)*0.12,0.18,0.60);
    if(Math.random()<escapeProb && !act.fin){
      act.npos='standing'; act.ctrlA=0; act.ctrlB=0;
      act.narr+=' '+`${botF.name} trabaja para levantarse y consigue volver a los pies.`;
    }
    return act;
  }

  // ── ESPALDA (back_A / back_B) ─────────────────────────────────────────
  if(pos==='back_A'||pos==='back_B'){
    act.dur=25; act.type='back_control';
    const topIsA=pos==='back_A';
    const topF=topIsA?fA:fB, botF=topIsA?fB:fA;
    const sTop=topIsA?sA:sB, sBot=topIsA?sB:sA;
    act.ctrlA=topIsA?30:0; act.ctrlB=topIsA?0:30;
    // Sub attempt very likely from back
    act.type='sub_attempt'; act.subtype='RNC';
    if(topIsA) act.subAttA=true; else act.subAttB=true;
    act.narr=_pick(_N.RNC.att(topF.name));
    const subSucc=(sTop.grd*(0.8+Math.random()*0.4))>(sBot.sub_esc*(0.8+Math.random()*0.4)*100*0.96);
    if(subSucc){
      act.fin={s:topIsA?'A':'B', m:'Sumisión'};
      act.narr=_pick(_N.RNC.l(topF.name, botF.name));
    } else {
      act.narr=_pick(_N.RNC.esc(topF.name, botF.name));
      act.npos=Math.random()<0.5?'standing':'ground_'+(topIsA?'A':'B')+'_top';
    }
    return act;
  }

  // Fallback
  act.narr=`${fA.name} y ${fB.name} se miden en el centro.`; return act;
}

// ── Simular un asalto completo ────────────────────────────────────────────────
function _simRound(fA, fB, sA, sB, hA, hB, styleA, styleB, round, totalRounds){
  let pos='standing', timeElapsed=0;
  const actions=[], stsA=_emptyStats(), stsB=_emptyStats();
  const dmgToA={head:0,body:0,legs:0}, dmgToB={head:0,body:0,legs:0};
  let finish=null;
  // Golpes en el último minuto del asalto — los jueces reales valoran "cerrar fuerte"
  let lateA=0, lateB=0;

  while(timeElapsed<300 && !finish){
    const act=_resolveAct(pos, fA, fB, sA, sB, hA, hB, styleA, styleB, round, totalRounds);
    actions.push(act);
    timeElapsed+=act.dur||15;
    pos=act.npos||pos;
    const inLateWindow=timeElapsed>=240; // último minuto (de 300s)

    // Accumulate A stats (what A did TO B)
    if(act.sigA){stsA.sigL+=act.sigA;stsA.sigA+=act.sigA;}
    if(act.missA) stsA.sigA+=act.missA;
    if(act.sigA&&act.zoneA){if(act.zoneA==='head')stsA.headL+=act.sigA;else if(act.zoneA==='body')stsA.bodyL+=act.sigA;else if(act.zoneA==='legs')stsA.legsL+=act.sigA;}
    if(act.tdAttA) stsA.tdAtt++; if(act.tdLandedA) stsA.tdL++;
    if(act.subAttA) stsA.subAtt++; if(act.kdB) stsA.kd++;
    if(act.ctrlA) stsA.ctrl+=act.ctrlA;
    if(inLateWindow){ if(act.sigA) lateA+=act.sigA; if(act.kdB) lateA+=15; }

    // Accumulate B stats (what B did TO A)
    if(act.sigB){stsB.sigL+=act.sigB;stsB.sigA+=act.sigB;}
    if(act.missB) stsB.sigA+=act.missB;
    if(act.sigB&&act.zoneB){if(act.zoneB==='head')stsB.headL+=act.sigB;else if(act.zoneB==='body')stsB.bodyL+=act.sigB;else if(act.zoneB==='legs')stsB.legsL+=act.sigB;}
    if(act.tdAttB) stsB.tdAtt++; if(act.tdLandedB) stsB.tdL++;
    if(act.subAttB) stsB.subAtt++; if(act.kdA) stsB.kd++;
    if(act.ctrlB) stsB.ctrl+=act.ctrlB;
    if(inLateWindow){ if(act.sigB) lateB+=act.sigB; if(act.kdA) lateB+=15; }

    // Health damage by zone
    if(act.dB>0){const z=act.zoneA||'head';dmgToB[z]+=(act.dB)*(z==='legs'?1.5:z==='body'?1.2:1);}
    if(act.dA>0){const z=act.zoneB||'head';dmgToA[z]+=(act.dA)*(z==='legs'?1.5:z==='body'?1.2:1);}

    if(act.fin){finish=act.fin; break;}
  }

  // UFC round scoring: golpes efectivos (la cabeza puntúa algo más que el cuerpo, y el
  // cuerpo algo más que la pierna — como en el criterio real de "effective striking", no
  // solo volumen bruto) + grappling + knockdowns + un pequeño plus por cerrar el asalto fuerte.
  const scA=(stsA.headL*1.15 + stsA.bodyL*1.0 + stsA.legsL*0.85) + stsA.tdL*14 + stsA.ctrl/22 + stsA.kd*28 + lateA*0.6;
  const scB=(stsB.headL*1.15 + stsB.bodyL*1.0 + stsB.legsL*0.85) + stsB.tdL*14 + stsB.ctrl/22 + stsB.kd*28 + lateB*0.6;
  const winner=scA>scB?'A':scB>scA?'B':Math.random()<0.5?'A':'B';

  // El bucle suma la duración de la última acción DESPUÉS de comprobar timeElapsed<300, así que
  // esa última acción puede empujar timeElapsed más allá de los 300s reales del asalto (ej. 327s
  // → se mostraría "5:27", imposible en un asalto de 5 minutos). Se acota el tiempo de pelea real
  // a un máximo de 300s (un asalto no puede durar más), y el de un finish concreto a 299s: un
  // finish real nunca puede caer en o después del final del asalto — si el tiempo se agota antes,
  // el combate pasa a decisión, no a un finish.
  stsA.fightTime=Math.min(timeElapsed,300); stsB.fightTime=stsA.fightTime;
  const displayTimeInRound = Math.min(timeElapsed, 299);
  return {actions, statsA:stsA, statsB:stsB, dmgToA, dmgToB,
          winner, scA:Math.round(scA), scB:Math.round(scB), pos, finish, timeInRound:displayTimeInRound};
}

// ── TARJETAS DE LOS 3 JUECES (sistema real de 10 puntos de la UFC) ──────────
// Reglas unificadas de MMA (verificado): el ganador de cada asalto se lleva 10 puntos y el
// perdedor 9 (asalto competido), o 8 si lo domina claramente (o hay un KD claro que decide);
// un asalto realmente parejo puede puntuarse 10-10 (raro). NO existe ningún descuento fijo de
// puntos por derribo — los derribos solo cuentan como parte del "grappling efectivo" a la hora
// de decidir quién gana el asalto, igual que los golpes. Los descuentos de puntos en la UFC real
// son solo por FALTAS (no simuladas aquí), nunca por derribos.
// Decisión unánime = los 3 jueces coinciden en el ganador. Dividida = 2 jueces para el ganador,
// 1 para el perdedor. Mayoría = 2 jueces para el ganador, 1 ve el combate empatado.
function generateJudgeScorecards(roundDetails, canonicalWinner){
  const scoredRounds = roundDetails.filter(rd=>rd.winner!=='finish');
  const CLOSE_THRESHOLD = 10; // asaltos reñidos donde un juez puede legítimamente discrepar
  const judges = [];
  for(let j=0;j<3;j++){
    let totalA=0, totalB=0;
    scoredRounds.forEach(rd=>{
      const trueWinner = rd.winner; // 'A' o 'B' — ya decidido en _simRound sin ruido de percepción
      const diff = Math.abs((rd.scoreA||0)-(rd.scoreB||0));
      // En un asalto reñido, un juez concreto tiene una pequeña probabilidad de verlo al revés
      // que el resultado "real" de las estadísticas — así es como discrepan jueces de verdad.
      let roundWinner = trueWinner;
      if(diff<CLOSE_THRESHOLD && Math.random()<0.15) roundWinner = trueWinner==='A'?'B':'A';
      const kdA=rd.statsA?.kd||0, kdB=rd.statsB?.kd||0;
      const kdEdgeForWinner = roundWinner==='A' ? kdA-kdB : kdB-kdA;
      // Asalto dominante (10-8): margen muy amplio o doble derribo/castigo claro — en la UFC real
      // esto ocurre en una minoría de asaltos, no en la mitad de ellos.
      const dominant = diff>=52 || kdEdgeForWinner>=2;
      const ptsWinner=10, ptsLoser=dominant?8:9;
      if(roundWinner==='A'){ totalA+=ptsWinner; totalB+=ptsLoser; } else { totalB+=ptsWinner; totalA+=ptsLoser; }
    });
    judges.push({totalA, totalB});
  }
  // Garantiza consistencia con el ganador real de la pelea (roundsA/roundsB): al menos 2 de los
  // 3 jueces tienen que coincidir con él, si no el ruido podría producir un resultado imposible
  // (el combate "lo gana" un peleador pero la mayoría de tarjetas dicen lo contrario).
  const winnerKey = canonicalWinner==='A'?'totalA':'totalB', loserKey=canonicalWinner==='A'?'totalB':'totalA';
  let agree = judges.filter(jc=>jc[winnerKey]>jc[loserKey]).length;
  for(let j=0; j<judges.length && agree<2; j++){
    if(judges[j][winnerKey]<=judges[j][loserKey]){
      const need=judges[j][loserKey]-judges[j][winnerKey]+1;
      judges[j][winnerKey]+=need;
      agree++;
    }
  }
  return judges;
}
function judgeDecType(judges, canonicalWinner){
  const winnerKey = canonicalWinner==='A'?'totalA':'totalB', loserKey=canonicalWinner==='A'?'totalB':'totalA';
  const picks = judges.map(jc=> jc[winnerKey]>jc[loserKey] ? 'winner' : jc[winnerKey]<jc[loserKey] ? 'loser' : 'draw');
  const winnerPicks = picks.filter(p=>p==='winner').length;
  if(winnerPicks>=3) return 'Unánime';
  if(picks.includes('draw')) return 'Mayoría';
  return 'Dividida';
}

// ── FUNCIÓN PRINCIPAL simulateFight ──────────────────────────────────────────
function simulateFight(fA, fB, opts={}){
  const rounds=opts.rounds||3;
  const fStyleA=fA.fightStyle||'technical', fStyleB=fB.fightStyle||'technical';
  const careerDmgA=(fA.chinDamage||0)*4, careerDmgB=(fB.chinDamage||0)*4;

  // Salud por zona (persiste entre asaltos)
  let hA={head:Math.max(40,100-careerDmgA), body:100, legs:100};
  let hB={head:Math.max(40,100-careerDmgB), body:100, legs:100};

  let roundsA=0, roundsB=0;
  const roundScores=[], roundDetails=[];
  let result=null;
  const fsA=_emptyStats(), fsB=_emptyStats();

  for(let r=1; r<=rounds&&!result; r++){
    const fatA=1-Math.max(0,r-1)*(1-fA.stats.cardio/100)*0.09*(1-(1-hA.body/100)*0.2);
    const fatB=1-Math.max(0,r-1)*(1-fB.stats.cardio/100)*0.09*(1-(1-hB.body/100)*0.2);
    const legMA=1-(1-hA.legs/100)*0.22, legMB=1-(1-hB.legs/100)*0.22;

    // Multiplicadores de KO por categoría de peso y estilo
    const wMultA=fA.division==='M_HEAVY'?1.22:fA.division==='M_LHEAVY'?1.11:fA.division==='M_MIDDLE'?1.04:1.0;
    const wMultB=fB.division==='M_HEAVY'?1.22:fB.division==='M_LHEAVY'?1.11:fB.division==='M_MIDDLE'?1.04:1.0;
    const comboPowA=fA.stats.power*0.68+fA.stats.striking*0.32;const powBonusA=Math.max(0,Math.pow(Math.max(0,comboPowA-83)/19,1.25)*0.62);const _techKoA=(['finisher','counter','pressure'].includes(fStyleB)?1.05:['grappler','submission'].includes(fStyleB)?1.42:1.22);
    const styleKoA=(fStyleA==='finisher'?1.38:fStyleA==='counter'?1.30:fStyleA==='pressure'?1.20:fStyleA==='technical'?_techKoA:fStyleA==='grappler'?0.90:fStyleA==='submission'?0.85:1.0);const koMultA=styleKoA*wMultA*(1+powBonusA);
    const comboPowB=fB.stats.power*0.68+fB.stats.striking*0.32;const powBonusB=Math.max(0,Math.pow(Math.max(0,comboPowB-83)/19,1.25)*0.62);
    const _techKoB=(['finisher','counter','pressure'].includes(fStyleA)?1.05:['grappler','submission'].includes(fStyleA)?1.42:1.22);
    const styleKoB=(fStyleB==='finisher'?1.38:fStyleB==='counter'?1.30:fStyleB==='pressure'?1.20:fStyleB==='technical'?_techKoB:fStyleB==='grappler'?0.90:fStyleB==='submission'?0.85:1.0);const koMultB=styleKoB*wMultB*(1+powBonusB);
    const sA={
      str:(fA.stats.striking*0.55+fA.stats.power*0.45)*fatA,
      pow:fA.stats.power*fatA,
      def:clamp((fA.stats.chin*0.25+fA.stats.striking*0.35+fA.stats.cardio*0.40)*fatA/100,0,0.88),
      woff:fA.stats.wrestlingOff*fatA*legMA,
      wdef:fA.stats.wrestlingDef*legMA,
      grd:fA.stats.ground*fatA,
      sub_esc:clamp((fA.stats.wrestlingDef*0.5+fA.stats.ground*0.5)/100,0,0.96),
      chin:fA.stats.chin*(1-clamp((careerDmgA+(100-hA.head))/300,0,0.50)),
      card:fA.stats.cardio,
      wMult:wMultA, koMult:koMultA,
    };
    const sB={
      str:(fB.stats.striking*0.55+fB.stats.power*0.45)*fatB,
      pow:fB.stats.power*fatB,
      def:clamp((fB.stats.chin*0.25+fB.stats.striking*0.35+fB.stats.cardio*0.40)*fatB/100,0,0.88),
      woff:fB.stats.wrestlingOff*fatB*legMB,
      wdef:fB.stats.wrestlingDef*legMB,
      grd:fB.stats.ground*fatB,
      sub_esc:clamp((fB.stats.wrestlingDef*0.5+fB.stats.ground*0.5)/100,0,0.96),
      chin:fB.stats.chin*(1-clamp((careerDmgB+(100-hB.head))/300,0,0.50)),
      card:fB.stats.cardio,
      wMult:wMultB, koMult:koMultB,
    };

    const rr=_simRound(fA, fB, sA, sB, hA, hB, fStyleA, fStyleB, r, rounds);

    // Update health
    hA.head=Math.max(0,hA.head-rr.dmgToA.head*0.35);
    hA.body=Math.max(0,hA.body-rr.dmgToA.body*0.9);
    hA.legs=Math.max(0,hA.legs-rr.dmgToA.legs);
    hB.head=Math.max(0,hB.head-rr.dmgToB.head*0.35);
    hB.body=Math.max(0,hB.body-rr.dmgToB.body*0.9);
    hB.legs=Math.max(0,hB.legs-rr.dmgToB.legs);

    // Accumulate fight stats
    const ra=rr.statsA, rb=rr.statsB;
    for(const k of Object.keys(fsA)){fsA[k]+=(ra[k]||0); fsB[k]+=(rb[k]||0);}

    // fightTime accumulated via stats loop (ra.fightTime / rb.fightTime)

    if(rr.finish){
      result={winner:rr.finish.s==='A'?fA:fB, loser:rr.finish.s==='A'?fB:fA,
              method:rr.finish.m, round:r, time:_fmt(rr.timeInRound)};
      if(rr.finish.doctor) result.doctorStop=true;
      roundScores.push('finish');
      roundDetails.push({round:r,actions:rr.actions,winner:'finish',scoreA:rr.scA,scoreB:rr.scB,pos:rr.pos,statsA:ra,statsB:rb,hA:{...hA},hB:{...hB},dmgToA:rr.dmgToA,dmgToB:rr.dmgToB});
      break;
    }

    // Parada médica entre asaltos (lesión grave — ~2% por combate máximo)
    if(r<rounds){
      const cutA=Math.max(0,(50-hA.head)/50)*0.012+Math.max(0,(40-hA.body)/40)*0.003;
      const cutB=Math.max(0,(50-hB.head)/50)*0.012+Math.max(0,(40-hB.body)/40)*0.003;
      if(Math.random()<cutA){
        result={winner:fB,loser:fA,method:'KO/TKO',round:r,time:'5:00',doctorStop:true};
        roundScores.push(rr.winner); roundDetails.push({round:r,actions:rr.actions,winner:rr.winner,scoreA:rr.scA,scoreB:rr.scB,pos:rr.pos,statsA:ra,statsB:rb,hA:{...hA},hB:{...hB},dmgToA:rr.dmgToA,dmgToB:rr.dmgToB});
        break;
      }
      if(Math.random()<cutB){
        result={winner:fA,loser:fB,method:'KO/TKO',round:r,time:'5:00',doctorStop:true};
        roundScores.push(rr.winner); roundDetails.push({round:r,actions:rr.actions,winner:rr.winner,scoreA:rr.scA,scoreB:rr.scB,pos:rr.pos,statsA:ra,statsB:rb,hA:{...hA},hB:{...hB},dmgToA:rr.dmgToA,dmgToB:rr.dmgToB});
        break;
      }
    }

    if(rr.winner==='A') roundsA++; else roundsB++;
    roundScores.push(rr.winner);
    roundDetails.push({round:r,actions:rr.actions,winner:rr.winner,scoreA:rr.scA,scoreB:rr.scB,pos:rr.pos,statsA:ra,statsB:rb,hA:{...hA},hB:{...hB},dmgToA:rr.dmgToA,dmgToB:rr.dmgToB});
  }

  if(!result){
    const winner=roundsA>=roundsB?fA:fB;
    const canonicalWinner=winner===fA?'A':'B';
    // Tarjetas reales de los 3 jueces (sistema de 10 puntos) — decType sale de cómo puntúa
    // cada juez de verdad, no de un porcentaje inventado a partir del margen de asaltos.
    const judgeScores = generateJudgeScorecards(roundDetails, canonicalWinner);
    const decType = judgeDecType(judgeScores, canonicalWinner);
    result={winner,loser:winner===fA?fB:fA,method:'Decisión',decType,round:rounds,time:'5:00',judgeScores};
  }

  result.totalRounds=rounds; result.roundScores=roundScores; result.roundDetails=roundDetails;
  result.knockdownsA=fsA.kd; result.knockdownsB=fsB.kd;
  result.fightStatsA=fsA; result.fightStatsB=fsB;
  const close=result.method==='Decisión'?Math.abs(roundsA-roundsB)<=1:result.round>=Math.ceil(rounds*0.6);
  result.fightOfNight=close&&Math.random()<0.22;
  // Señal "candidata" a Actuación de la Noche — la selección FINAL (máx. 2 por evento, como en
  // la UFC real) se decide en finishEvent() comparando todas las peleas de la cartelera; este
  // flag solo alimenta esa comparación y sirve de vista previa antes de que acabe el evento.
  result.performance=!result.fightOfNight&&(result.method==='KO/TKO'||result.method==='Sumisión')&&Math.random()<0.35;
  return result;
}

// ── Actualizar estadísticas de carrera del peleador ──────────────────────────
function updateCareerStats(fighter, fightStats, won){
  if(!fighter.careerStats) fighter.careerStats={sigL:0,sigA:0,headL:0,bodyL:0,legsL:0,tdL:0,tdAtt:0,subAtt:0,kd:0,ctrl:0,fightTime:0,fights:0};
  const cs=fighter.careerStats;
  cs.fights++;
  for(const k of ['sigL','sigA','headL','bodyL','legsL','tdL','tdAtt','subAtt','kd','ctrl','fightTime']){
    cs[k]+=(fightStats[k]||0);
  }
}

// Etiqueta completa del método incluyendo tipo de decisión
function methodLabel(resultOrFt){
  const m=resultOrFt?.method||resultOrFt?.result?.method||'?';
  if(m!=='Decisión') return m;
  const dt=resultOrFt?.decType||resultOrFt?.result?.decType;
  return dt?`Decisión ${dt}`:m;
}
// Abreviatura compacta tipo transmisión real (UD/SD/MD) — para sitios donde no cabe
// "Decisión Unánime/Dividida/Mayoría" entero (listas, tablas, tarjetas de combate).
function methodAbbr(resultOrFt){
  const m=resultOrFt?.method||resultOrFt?.result?.method||'?';
  if(m!=='Decisión') return m;
  const dt=resultOrFt?.decType||resultOrFt?.result?.decType;
  return dt==='Unánime'?'UD':dt==='Dividida'?'SD':dt==='Mayoría'?'MD':m;
}
// Color del método
function methodColor(m){
  if(!m) return 'var(--dec)';
  return m==='KO/TKO'?'var(--ko)':m==='Sumisión'?'var(--sub)':'var(--dec)';
}

// Derived career stats (computed on demand)
function careerDerived(f){
  const cs=f.careerStats; if(!cs||!cs.fights) return null;
  const mins=cs.fightTime/60||1;
  return {
    slpm:+(cs.sigL/mins).toFixed(1),
    strAcc:cs.sigA>0?+(cs.sigL/cs.sigA*100).toFixed(0):0,
    tdAcc:cs.tdAtt>0?+(cs.tdL/cs.tdAtt*100).toFixed(0):0,
    subPerFight:+(cs.subAtt/cs.fights).toFixed(1),
    kdPerFight:+(cs.kd/cs.fights).toFixed(2),
    ctrlPerMin:+(cs.ctrl/60/cs.fights).toFixed(1),
    fights:cs.fights,
  };
}



/* ====================== LESIONES / LONGEVIDAD / RETIRO ====================== */
function applyPostFightWearAndInjury(fighter, won, method, eventDate){
  // desgaste de longevidad
  let wear = randi(1,3);
  if(method==='KO/TKO' && !won) wear += randi(2,5);
  if(method!=='Decisión') wear += randi(0,2);
  fighter.longevity = clamp(fighter.longevity-wear, 0, 100);

  // LESIONES GRANULARES — mayor variedad de tipos
  const injuryChance = 0.04
    + (method==='KO/TKO' && !won ? 0.07 : 0)
    + (method==='Sumisión' && !won ? 0.04 : 0)
    + (!won && method==='Decisión' ? 0.02 : 0);
  if(Math.random()<injuryChance){
    let injuryType, days, statPenalty=null, injType='general';
    if(method==='KO/TKO' && !won){
      const opts=[
        {note:'Conmoción cerebral',days:[90,300],stat:{key:'chin',d:-randi(1,3)},type:'concussion'},
        {note:'Protocolo neurológico (USADA)',days:[120,365],stat:{key:'chin',d:-randi(1,2)},type:'concussion'},
        {note:'Fractura orbital',days:[60,120],stat:null,type:'concussion'},
        {note:'Lesión cervical',days:[90,180],stat:{key:'striking',d:-1},type:'joint'},
        {note:'Hemorragia nasal severa (cirugía)',days:[45,90],stat:null,type:'general'},
        {note:'Conmoción de grado 2',days:[60,150],stat:{key:'chin',d:-1},type:'concussion'},
        {note:'Fractura de pómulo',days:[75,150],stat:null,type:'general'},
        {note:'Lesión de retina',days:[90,270],stat:{key:'striking',d:-2},type:'concussion'},
        {note:'Fractura mandibular',days:[120,240],stat:{key:'power',d:-1},type:'general'},
      ];
      const o=pick(opts); injuryType=o.note; days=randi(o.days[0],o.days[1]); statPenalty=o.stat||null; injType=o.type;
    } else if(method==='Sumisión' && !won){
      const opts=[
        {note:'Desgarro de hombro (Bankart)',days:[120,300],stat:{key:'wrestlingDef',d:-randi(1,2)},type:'joint'},
        {note:'Lesión de codo (ligamento UCL)',days:[90,210],stat:{key:'ground',d:-1},type:'joint'},
        {note:'Rotura de menisco',days:[120,270],stat:{key:'cardio',d:-randi(1,2)},type:'joint'},
        {note:'Lesión de cuello (vértebra)',days:[90,180],stat:null,type:'joint'},
        {note:'Esguince grave de tobillo',days:[45,90],stat:{key:'cardio',d:-1},type:'joint'},
        {note:'Fractura de costilla (presión)',days:[60,120],stat:{key:'cardio',d:-1},type:'general'},
        {note:'Luxación de cadera',days:[90,210],stat:{key:'wrestlingOff',d:-1},type:'joint'},
        {note:'Lesión de muñeca (radio)',days:[60,150],stat:{key:'striking',d:-1},type:'joint'},
        {note:'Rotura del manguito rotador',days:[150,365],stat:{key:'ground',d:-2},type:'joint'},
      ];
      const o=pick(opts); injuryType=o.note; days=randi(o.days[0],o.days[1]); statPenalty=o.stat||null; injType=o.type;
    } else if(!won){
      const opts=[
        {note:'Fractura de mano (metacarpiano)',days:[45,90],stat:{key:'striking',d:-1},type:'general'},
        {note:'Costillas fracturadas',days:[60,120],stat:{key:'cardio',d:-1},type:'general'},
        {note:'Esguince de tobillo (grado II)',days:[25,60],stat:null,type:'general'},
        {note:'Corte profundo (cirugía plástica)',days:[30,75],stat:null,type:'general'},
        {note:'Lesión de nariz (septoplastia)',days:[30,60],stat:null,type:'general'},
        {note:'Distensión muscular (isquiotibial)',days:[20,50],stat:{key:'cardio',d:-1},type:'general'},
        {note:'Fractura de pulgar',days:[30,75],stat:{key:'power',d:-1},type:'general'},
        {note:'Contusión renal',days:[45,90],stat:{key:'cardio',d:-1},type:'general'},
        {note:'Desgarro del bíceps',days:[90,180],stat:{key:'wrestlingOff',d:-1},type:'joint'},
        {note:'Lesión de ligamento (rodilla)',days:[120,300],stat:{key:'cardio',d:-2},type:'joint'},
      ];
      const o=pick(opts); injuryType=o.note; days=randi(o.days[0],o.days[1]); statPenalty=o.stat||null; injType=o.type;
    } else {
      // Ganador lesionado (menos frecuente)
      const opts=[
        {note:'Desgarro muscular (entrenamiento)',days:[20,60],stat:null,type:'general'},
        {note:'Fractura de mano',days:[30,60],stat:{key:'striking',d:-1},type:'general'},
        {note:'Esguince de muñeca',days:[15,40],stat:null,type:'general'},
        {note:'Corte (puntos de sutura)',days:[10,25],stat:null,type:'general'},
        {note:'Sobrecarga en hombro',days:[20,45],stat:{key:'wrestlingOff',d:-1},type:'joint'},
        {note:'Esguince de dedo',days:[10,30],stat:null,type:'general'},
      ];
      const o=pick(opts); injuryType=o.note; days=randi(o.days[0],o.days[1]); statPenalty=o.stat||null; injType=o.type;
    }
    fighter.injury={active:true, untilDate:addDays(eventDate,days), note:injuryType, type:injType};
    fighter.status='injured';
    if(statPenalty) fighter.stats[statPenalty.key]=clamp((fighter.stats[statPenalty.key]||70)+statPenalty.d,1,99);
    logEvent(`🩹 ${fName(fighter)}: ${injuryType} (${days} días). Vuelve: ${fmtDate(fighter.injury.untilDate)}`);
  }

  // retiro
  const age = ageFromDob(fighter.dob, eventDate);
  let retireProb = 0;
  if(age>=39) retireProb += 0.35;
  else if(age>=36) retireProb += 0.16;
  else if(age>=33) retireProb += 0.05;
  if(fighter.longevity<=15) retireProb += 0.45;
  else if(fighter.longevity<=30) retireProb += 0.2;
  else if(fighter.longevity<=45) retireProb += 0.08;
  if(!won && method==='KO/TKO') retireProb += 0.06;
  // Lesión de conmoción aumenta retiro
  if(fighter.injury?.type==='concussion') retireProb += 0.12;
  retireProb = clamp(retireProb,0,0.9);
  if(fighter.status!=='retired' && Math.random()<retireProb){
    const wantsRetire = confirm(`${fName(fighter)} (${age} años, ${fighter.record.wins}-${fighter.record.losses}) quiere retirarse tras este combate.\n\n¿Permites la retirada?`);
    if(!wantsRetire){ logEvent(`💪 ${fName(fighter)} decide continuar peleando a pesar de su edad.`); return; }
    fighter.status='retired';
    STATE.titles.forEach(title=>{
      if(title.holderId===fighter.id){
        const reign = (fighter.titleReigns||[]).find(r=>r.titleId===title.id && !r.lostDate);
        if(reign) reign.lostDate = eventDate;
        title.holderId = null; title.isInterim = false;
        logEvent(`🏆 ${fName(title)} queda vacante: ${fName(fighter)} se retira.`);
      }
    });
    logEvent(`👋 ${fName(fighter)} (${age} años) anuncia su retirada.`);
    const wantsHof = confirm(`${fName(fighter)} se retira (${fighter.record.wins}-${fighter.record.losses}, GOAT score ${goatScore(fighter)}).\n\n¿Quieres añadirlo al Hall of Fame?`);
    if(wantsHof){ fighter.hof = true; logEvent(`🏛 ${fName(fighter)} es inducido al Hall of Fame.`); }
  }
}
