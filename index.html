      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>🩸 Salud por zona:</b> La cabeza/cuerpo/piernas acumulan daño entre asaltos. La cabeza dañada = más KO. Cuerpo dañado = menos cardio. Piernas dañadas = peor defensa de derribos.</div>
      <div style="padding:4px 0"><b>🏥 Parada médica:</b> Con daño acumulado severo en cabeza, el médico puede parar el combate entre asaltos (~1.5% de combates). Cuenta como KO/TKO.</div>
    </div>
  </div>

  <div class="card">
    <h3>📋 Tarjetas de los jueces</h3>
    <p class="muted" style="font-size:.8rem">Las decisiones siguen el sistema real de 10 puntos obligatorios de la UFC, con 3 jueces independientes:</p>
    <div style="font-size:.78rem;line-height:1.7">
      <div>• <b>Ganador del asalto: 10 puntos.</b> Perdedor: <b>9</b> en un asalto normal, <b>8</b> en un asalto dominante (margen muy amplio o doble derribo/castigo claro).</div>
      <div>• <b>No existe descuento de puntos por derribo.</b> En la UFC real, las deducciones solo ocurren por faltas (golpes ilegales, agarrar la valla…), nunca por conseguir un derribo.</div>
      <div>• En asaltos reñidos, cada juez tiene una pequeña probabilidad de ver el ganador al revés que las estadísticas reales del asalto — así es como discrepan los jueces de verdad.</div>
      <div>• <b>UD (Unánime):</b> los 3 jueces coinciden. <b>SD (Dividida):</b> 2 jueces para el ganador, 1 para el perdedor. <b>MD (Mayoría):</b> 2 jueces para el ganador, 1 ve el combate empatado.</div>
    </div>
    <p class="muted" style="margin-top:8px;font-size:.78rem">💡 Verificado con miles de combates simulados: ~85% Unánime, ~11% Dividida, ~4% Mayoría — en línea con las proporciones reales de la UFC. Las tarjetas se muestran en el resultado del combate, el visor en vivo y el resumen de evento.</p>
  </div>

  <div class="card">
    <h3>📡 Estadísticas de carrera</h3>
    <p class="muted" style="font-size:.8rem">Se acumulan automáticamente de cada combate simulado. Requieren mínimo 3 peleas UFC para aparecer en los líderes de la sección Estadísticas.</p>
    <div style="font-size:.78rem;margin-top:6px">
      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>💥 SLpM</b> — Significant strikes per minute. Mide el volumen ofensivo. Pressure fighters suelen ser líderes.</div>
      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>🎯 Precisión</b> — Golpes sig. conectados / intentados × 100. Counter fighters y técnicos suelen destacar.</div>
      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>🤼 TD%</b> — Derribos completados / intentados × 100. Grapplers de alto nivel superan el 80%.</div>
      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>🔱 Sub att./pelea</b> — Intentos de sumisión por combate. Estilos submission lideran siempre.</div>
      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>⚡ KDs/pelea</b> — Knockdowns infligidos por combate promedio.</div>
      <div style="padding:4px 0"><b>🏔️ Ctrl/pelea</b> — Minutos de control posicional promedio por combate.</div>
    </div>
    <p class="muted" style="margin-top:8px;font-size:.78rem">💡 Los <b>badges de Top 5</b> en el perfil se recalculan en tiempo real comparando con todos los peleadores activos con 2+ peleas UFC.</p>
  </div>

  <div class="card">
    <h3>💼 Contratos y renegociación</h3>
    <p class="muted" style="font-size:.8rem">Cada peleador tiene bolsa por pelea, bonus por finalización (~40% de la bolsa), peleas restantes en el contrato, exigencia (0-100, ligada a su nivel) y lealtad (0-100, resistencia a irse por dinero).</p>
    <div style="font-size:.78rem;line-height:1.7">
      <div>• Al agotarse las peleas del contrato, se abre una negociación de hasta 3 rondas.</div>
      <div>• Desde la primera ronda se muestra la bolsa mínima real que aceptará — igualar o superar esa cifra firma el contrato inmediatamente, sin sorpresas.</div>
      <div>• Una promotora rival puede ofertar por el peleador durante la negociación, presionando la cifra al alza.</div>
      <div>• Si no se llega a un acuerdo en 3 rondas, el peleador queda libre (o ficha por la rival si había oferta de por medio).</div>
    </div>
  </div>

  <div class="card">
    <h3>🏢 Promotoras rivales</h3>
    <p class="muted" style="font-size:.8rem">3 promotoras compiten con la tuya, cada una con su propio roster, campeones y presupuesto. Simulan sus propios eventos automáticamente al terminar los tuyos.</p>
    <div style="font-size:.78rem;line-height:1.7">
      <div>• Puedes comprar los derechos de cualquier peleador de su roster para ficharlo.</div>
      <div>• El prestigio de cada promotora fluctúa con sus resultados pero siempre revierte hacia su nivel base, para que ninguna converja a la cima con el tiempo.</div>
      <div>• Puedes ver su cartelera reciente y comparar tu cuota de prestigio con la suya en la pestaña Promotoras.</div>
    </div>
  </div>

  <div class="card">
    <h3>⚔️ Rivalidades</h3>
    <p class="muted" style="font-size:.8rem">Se activan automáticamente cuando dos peleadores se enfrentan 2 o más veces. Con 3+ combates pasa a ser "rivalidad oficial".</p>
    <p class="muted" style="font-size:.78rem">💡 Una pelea de rivalidad genera un ~12-20% más de ingresos que una pelea equivalente sin historia — el público paga por ver un ajuste de cuentas.</p>
  </div>

  <div class="card">
    <h3>🏆 Premios anuales</h3>
    <p class="muted" style="font-size:.8rem">Los premios se entregan automáticamente cuando el primer evento de un nuevo año se completa. Se almacenan en el historial de la sección Estadísticas.</p>
    <div style="font-size:.78rem;margin-top:6px">
      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>🏆 Peleador del Año</b> — Mayor puntuación anual (victorias ×3, + peleas por título ×5, + finalizaciones ×2).</div>
      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>🏅 Pelea del Año</b> — Seleccionada entre las peleas catalogadas como Pelea de la Noche.</div>
      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>💥 KO del Año</b> — El KO más rápido del año (con algo de azar para variedad).</div>
      <div style="padding:4px 0;border-bottom:1px solid #1a1a1a"><b>🤼 Sumisión del Año</b> — Seleccionada aleatoriamente entre todas las sumisiones del año.</div>
      <div style="padding:4px 0"><b>⭐ Actuación del Año</b> — Seleccionada entre las catalogadas como Actuación de la Noche.</div>
    </div>
  </div>`;
}
function tplSettings(){
  const cfg=getCfg();
  const nc=UI.notifCfg||{};
  const notifToggles=[
    ['lesion','🩹 Lesiones','injury'],['sancion','🚫 Sanciones','sanction'],
    ['retiro','👋 Retiros','retire'],['titulo','🏆 Cambios de título','title'],
    ['simulation','⚙️ Motor de simulación','simulation'],['careerStats','📡 Estadísticas de carrera','careerStats'],['premio','🏅 Premios anuales','award'],['milestone','🎯 Milestones','milestone'],
  ].map(([key,label,cat])=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1a1a1a">
      <span style="font-size:.82rem">${label}</span>
      <label style="position:relative;display:inline-block;width:36px;height:20px;cursor:pointer">
        <input type="checkbox" id="notif_${key}" ${nc[cat]!==false?'checked':''} style="opacity:0;width:0;height:0;position:absolute">
        <span style="position:absolute;inset:0;border-radius:20px;background:${nc[cat]!==false?'#e53935':'#333'};transition:.2s"></span>
        <span style="position:absolute;left:${nc[cat]!==false?'18':'2'}px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s"></span>
      </label>
    </div>`).join('');
  return `
  <div class="card">
    <h3>🔔 Notificaciones</h3>
    <p class="muted" style="font-size:.75rem">Activa o desactiva las notificaciones emergentes por tipo.</p>
    ${notifToggles}
  </div>
  <div class="card">
    <h2>🎮 Opciones de Fantasía</h2>
    <p class="muted" style="font-size:.78rem">Ajustes que modifican la simulación para hacerla más disfrutabe según tu preferencia.</p>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a1a">
      <div>
        <div style="font-weight:700;font-size:.88rem">🔒 Mantener nivel de peleadores</div>
        <div class="muted" style="font-size:.74rem;margin-top:3px">Los atributos no cambian con el tiempo — ni mejoran los jóvenes ni decaen los veteranos. Los peleadores mantienen sus estadísticas para siempre.</div>
      </div>
      <label style="position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;margin-left:12px">
        <input type="checkbox" id="fantasyFreezeStats" ${STATE.meta.fantasyFreezeStats?'checked':''} style="opacity:0;width:0;height:0">
        <span style="position:absolute;cursor:pointer;inset:0;background:${STATE.meta.fantasyFreezeStats?'#d4af37':'#333'};border-radius:24px;transition:.3s">
          <span style="position:absolute;height:18px;width:18px;left:${STATE.meta.fantasyFreezeStats?'23':'3'}px;bottom:3px;background:white;border-radius:50%;transition:.3s"></span>
        </span>
      </label>
    </div>
  </div>
  <div class="card">
    <h2>☁️ Guardado en GitHub</h2>
    <p class="muted">Configura tu repositorio y un Personal Access Token (con permiso "repo" / contenido) para guardar y cargar tu partida en un fichero JSON del repo. El token solo se guarda en este dispositivo (localStorage), nunca se sube a ningún sitio.</p>
    <label>Usuario/Organización</label><input id="cfgOwner" value="${cfg.owner||''}" placeholder="tu-usuario">
    <label>Repositorio</label><input id="cfgRepo" value="${cfg.repo||''}" placeholder="ufc-owner-sim">
    <label>Rama</label><input id="cfgBranch" value="${cfg.branch||'main'}">
    <label>Ruta del fichero</label><input id="cfgPath" value="${cfg.path||'data/state.json'}">
    <label>Personal Access Token</label><input id="cfgToken" type="password" value="${cfg.token||''}" placeholder="ghp_xxxxx...">
    <button class="btn full" id="saveCfg">Guardar configuración</button>
    <div class="row" style="margin-top:10px">
      <button class="btn primary full" id="pushBtn">⬆ Guardar partida en GitHub</button>
      <button class="btn full" id="pullBtn">⬇ Cargar partida desde GitHub</button>
    </div>
    <p class="muted" id="ghStatus"></p>
  </div>
  <div class="card">
    <h3>💾 Guardado rápido (slots locales)</h3>
    <p class="muted" style="font-size:.75rem">Guarda hasta 3 copias de tu partida en este navegador, para volver atrás sin depender de exportar/importar ficheros.</p>
    ${SAVE_SLOTS.map(n=>{
      const info=getSlotInfo(n);
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1a1a1a">
        <div>
          <div style="font-weight:700;font-size:.85rem">Slot ${n}</div>
          ${info?`<div class="muted" style="font-size:.7rem">${fmtDate(info.date)} · $${info.budget.toLocaleString()} · ${info.fighterCount} peleadores${info.savedAt?' · guardado '+new Date(info.savedAt).toLocaleString():''}</div>`:'<div class="muted" style="font-size:.7rem">Vacío</div>'}
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn small primary saveSlotBtn" data-slot="${n}">Guardar</button>
          ${info?`<button class="btn small loadSlotBtn" data-slot="${n}">Cargar</button><button class="btn small danger clearSlotBtn" data-slot="${n}">✕</button>`:''}
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="card">
    <h3>Datos locales</h3>
    <div class="row">
      <button class="btn full" id="newGameBtn">🔄 Nueva partida (resetear con 2 por categoría)</button>
      <button class="btn full" id="exportBtn">📤 Exportar JSON (descargar)</button>
    </div>
    <div style="margin-top:8px">
      <label style="font-size:.82rem;font-weight:600;display:block;margin-bottom:4px">📥 Importar JSON de partida</label>
      <p class="muted" style="font-size:.75rem;margin-bottom:6px">Carga un fichero JSON exportado previamente para restaurar una partida guardada. Sustituye el estado actual.</p>
      <input type="file" id="importJsonFile" accept=".json" style="width:100%;font-size:.8rem">
      <button class="btn primary full" id="importJsonBtn" style="margin-top:6px">📥 Importar JSON</button>
    </div>
    ${typeof INITIAL_STATE!=='undefined'&&INITIAL_STATE?`
    <div style="margin-top:10px;padding:10px;background:rgba(183,28,28,.12);border:1px solid rgba(183,28,28,.4);border-radius:8px">
      <div style="font-size:.82rem;font-weight:700;margin-bottom:4px">⚠️ Restablecer partida al estado inicial</div>
      <p class="muted" style="margin-bottom:8px">Elimina todo lo simulado (eventos, resultados, rankings, historial) y vuelve exactamente al JSON inicial cargado. Esta acción no se puede deshacer.</p>
      <button class="btn danger full" id="resetToInitialBtn">🗑️ Volver al estado inicial del JSON</button>
    </div>`:''}
  </div>`;
}
function bindSettings(){
  // Slots de guardado local
  document.querySelectorAll('.saveSlotBtn').forEach(btn=>{
    btn.onclick=()=>{
      const n=btn.dataset.slot;
      const info=getSlotInfo(n);
      if(info && !confirm(`El Slot ${n} ya tiene una partida guardada (${fmtDate(info.date)}). ¿Sobrescribir?`)) return;
      saveToSlot(n); render(); toast(`Partida guardada en Slot ${n} ✅`);
    };
  });
  document.querySelectorAll('.loadSlotBtn').forEach(btn=>{
    btn.onclick=()=>{
      const n=btn.dataset.slot;
      if(!confirm(`¿Cargar la partida del Slot ${n}? Se perderá el progreso actual no guardado.`)) return;
      if(loadFromSlot(n)) toast(`Partida cargada desde Slot ${n} ✅`);
    };
  });
  document.querySelectorAll('.clearSlotBtn').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const n=btn.dataset.slot;
      if(!confirm(`¿Vaciar el Slot ${n}? Esta acción no se puede deshacer.`)) return;
      clearSlot(n); render(); toast(`Slot ${n} vaciado`);
    };
  });
  // Notificaciones
  const notifMap={notif_lesion:'injury',notif_sancion:'sanction',notif_retiro:'retire',notif_titulo:'title',notif_premio:'award',notif_milestone:'milestone'};
  Object.entries(notifMap).forEach(([id,cat])=>{
    const el=document.getElementById(id);
    if(el) el.onchange=()=>{ if(!UI.notifCfg)UI.notifCfg={}; UI.notifCfg[cat]=el.checked; render(); };
  });
  const freezeToggle = document.getElementById('fantasyFreezeStats');
  if(freezeToggle){
    freezeToggle.onchange=()=>{
      STATE.meta.fantasyFreezeStats = freezeToggle.checked;
      saveLocal();
      // Re-render to update toggle appearance
      const span=freezeToggle.nextElementSibling;
      if(span){
        span.style.background=freezeToggle.checked?'#d4af37':'#333';
        span.firstElementChild.style.left=freezeToggle.checked?'23px':'3px';
      }
      toast(freezeToggle.checked?'🔒 Nivel de peleadores bloqueado':'🔓 Nivel de peleadores activado');
    };
  }
  document.getElementById('saveCfg').onclick=()=>{
    setCfg({owner:val('cfgOwner'),repo:val('cfgRepo'),branch:val('cfgBranch')||'main',path:val('cfgPath')||'data/state.json',token:val('cfgToken')});
    toast('Configuración guardada');
  };
  function val(id){return document.getElementById(id).value.trim();}
  document.getElementById('pushBtn').onclick=async()=>{
    const cfg=getCfg(); const status=document.getElementById('ghStatus');
    if(!cfg.owner||!cfg.repo||!cfg.token){ status.textContent='Falta configuración (usuario/repo/token).'; return; }
    status.textContent='Guardando...';
    try{
      const apiUrl=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
      let sha=null;
      const getRes = await fetch(apiUrl+`?ref=${cfg.branch}`, {headers:{Authorization:`token ${cfg.token}`}});
      if(getRes.status===200){ const j=await getRes.json(); sha=j.sha; }
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(STATE,null,1))));
      const putRes = await fetch(apiUrl, {
        method:'PUT', headers:{Authorization:`token ${cfg.token}`, 'Content-Type':'application/json'},
        body: JSON.stringify({message:`Guardado partida ${STATE.meta.currentDate}`, content, sha: sha||undefined, branch:cfg.branch})
      });
      if(putRes.ok){ status.textContent='✅ Guardado correctamente en GitHub.'; toast('Partida guardada en GitHub'); }
      else { const e=await putRes.json(); status.textContent='❌ Error: '+(e.message||putRes.status); }
    }catch(e){ status.textContent='❌ Error de red: '+e.message; }
  };
  document.getElementById('pullBtn').onclick=async()=>{
    const cfg=getCfg(); const status=document.getElementById('ghStatus');
    if(!cfg.owner||!cfg.repo){ status.textContent='Falta configuración (usuario/repo).'; return; }
    status.textContent='Cargando...';
    try{
      const raw=`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${cfg.path}`;
      const res = await fetch(raw+`?t=${Date.now()}`);
      if(!res.ok){ status.textContent='❌ No se encontró el fichero en el repo.'; return; }
      const json = await res.json();
      STATE=json; saveLocal(); render();
      status.textContent='✅ Partida cargada desde GitHub.'; toast('Partida cargada');
    }catch(e){ status.textContent='❌ Error: '+e.message; }
  };
  document.getElementById('newGameBtn').onclick=()=>{
    if(!confirm('Esto borrará tu partida actual y generará 2 peleadores por categoría. ¿Continuar?')) return;
    STATE=freshState(); seedFighters(); render(); toast('Nueva partida generada');
  };
  document.getElementById('exportBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(STATE,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ufc_state.json'; a.click();
  };
  const importBtn=document.getElementById('importJsonBtn');
  if(importBtn) importBtn.onclick=()=>{
    const file=document.getElementById('importJsonFile')?.files?.[0];
    if(!file) return toast('Selecciona un fichero JSON primero');
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const parsed=JSON.parse(e.target.result);
        if(!parsed.fighters||!parsed.divisions) return toast('❌ JSON inválido: no parece un estado de UFC Owner Sim');
        if(!confirm(`¿Importar estado?\n• ${parsed.fighters?.length||0} peleadores\n• ${parsed.events?.filter(x=>x.status==='completed').length||0} eventos completados\n\nEsto reemplazará la partida actual.`)) return;
        STATE=parsed;
        saveLocal(); UI.tab='dashboard'; render();
        toast('Partida importada correctamente ✅');
      }catch(ex){ toast('❌ Error al leer JSON: '+ex.message); }
    };
    reader.readAsText(file);
  };
  const resetBtn=document.getElementById('resetToInitialBtn');
  if(resetBtn) resetBtn.onclick=()=>{
    if(!confirm('⚠️ Esto eliminará TODA la partida simulada (eventos, resultados, historial, rankings) y volverá al estado del JSON inicial.\n\nSe perderá todo el progreso. ¿Estás seguro?')) return;
    localStorage.removeItem(LS_KEY);
    STATE=freshState();
    seedFighters();
    UI.tab='dashboard';
    render();
    toast('Partida restablecida al estado inicial ✅');
  };
}

/* ====================== INIT ====================== */
async function init(){
  const local = loadLocal();
  if(local){
    STATE=local;
    // Migración: eliminar cualquier peleador femenino que pudiera haberse guardado en versiones anteriores
    const before=STATE.fighters.length;
    STATE.fighters=STATE.fighters.filter(f=>f.gender!=='F' && !String(f.division||'').startsWith('W_'));
    if(STATE.fighters.length<before) console.log(`Migración: eliminados ${before-STATE.fighters.length} peleadores femeninos del estado guardado.`);
  } else {
    STATE=freshState();
    seedFighters();
    seedRivalPromotions();
  }
  // Si no hay ningún evento completado, resetear momentum a 0 para todos (estado inicial limpio)
  if(!STATE.events.filter(e=>e.status==='completed').length){
    STATE.fighters.forEach(f=>{ f.momentum=0; });
  }
  // Migración: partidas guardadas antes de contratos/promotoras rivales/presupuesto
  if(STATE.meta.budget==null) STATE.meta.budget = 5000000;
  if(!STATE.pendingNegotiations) STATE.pendingNegotiations = [];
  STATE.fighters.forEach(f=>{ if(!f.contract) f.contract = makeContract(generalScore(f), f.reputation); });
  if(!STATE.rivalPromotions || !STATE.rivalPromotions.length) seedRivalPromotions();
  if(!STATE.callouts) STATE.callouts = [];
  // Garantizar snapshot inicial para el gráfico de evolución de atributos
  if(!STATE.statsHistory) STATE.statsHistory={};
  STATE.fighters.forEach(f=>{
    if(!STATE.statsHistory[f.id]||STATE.statsHistory[f.id].length===0)
      saveStatSnapshot(f, STATE.meta?.currentDate||new Date().toISOString().slice(0,10), 'Inicio');
  });
  refreshRankings();

  // Delegado global: cualquier elemento con [data-id] abre el perfil del peleador.
  // Funciona en TODAS las pestañas sin necesidad de enlazar manualmente cada render.
  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-id]');
    if(!el) return;
    // Ignorar elementos que tienen su propio handler especial (botones de acción)
    if(el.tagName==='BUTTON' || el.tagName==='SELECT' || el.tagName==='INPUT') return;
    if(el.classList.contains('signBtn') || el.classList.contains('clearRematch')) return;
    const fid = el.dataset.id;
    if(fid && STATE.fighters.find(f=>f.id===fid)){
      openFighterModal(fid);
    }
  });

  render();
}
init();
</script>
