function finishEvent(ev){
  // FOTN: la pelea más espectacular del evento
  const completedFights = ev.card.filter(ft=>ft.result);
  if(completedFights.length>0){
    const fotnScores = completedFights.map(ft=>{
      const r=ft.result;
      const fAf=STATE.fighters.find(x=>x.id===ft.fighterA), fBf=STATE.fighters.find(x=>x.id===ft.fighterB);
      let score=Math.random()*30;
      if(r.method==='KO/TKO')score+=40; else if(r.method==='Sumisión')score+=30; else score+=10;
      if(fAf&&fBf){const diff=Math.abs(overallRating(fAf)-overallRating(fBf));score+=Math.max(0,20-diff*2);}
      if(r.fightOfNight)score+=20;
      return {ft,score};
    });
    fotnScores.sort((a,b)=>b.score-a.score);
    const fotnFight=fotnScores[0].ft;
    fotnFight.result.isFOTN=true;
    const fotnW=STATE.fighters.find(x=>x.id===fotnFight.result.winnerId);
    const fotnL=STATE.fighters.find(x=>x.id===fotnFight.result.loserId);
    if(fotnW)fotnW.bonuses.fightOfNight++;
    if(fotnL)fotnL.bonuses.fightOfNight++;
    logEvent(`🌟 FOTN: ${fotnW?fotnW.name:'?'} vs ${fotnL?fotnL.name:'?'}`);

    // POTN: hasta 2 actuaciones individuales por evento (la cifra real de la UFC — 1 Pelea de la
    // Noche + 2 Actuaciones de la Noche por cartelera), en peleas distintas de la FOTN.
    const potnScores = completedFights.filter(ft=>ft!==fotnFight).map(ft=>{
      const r=ft.result;
      let score=Math.random()*25;
      if(r.method==='KO/TKO')score+=35; else if(r.method==='Sumisión')score+=30; else score+=8;
      if(r.round===1)score+=12; else if(r.round===2)score+=6;
      if(r.performance)score+=10;
      return {ft,score};
    });
    potnScores.sort((a,b)=>b.score-a.score);
    potnScores.slice(0,2).forEach(({ft})=>{
      ft.result.isPOTN=true;
      const pw=STATE.fighters.find(x=>x.id===ft.result.winnerId);
      if(pw){ pw.bonuses.performanceOfNight++; logEvent(`⭐ POTN: ${pw.name}`); }
    });
  }
  // ── PREMIOS ANUALES — se entregan cuando se supera el 31 de diciembre ────────
  const evYear = parseInt((ev.date||'2025').slice(0,4));
  const lastAwardYear = STATE.meta.lastAwardYear ?? (evYear - 2);
  ev._newAwardYears = [];
  if(evYear > lastAwardYear){
    for(let awardYear = lastAwardYear + 1; awardYear < evYear; awardYear++){
      if(giveAwardsForYear(awardYear)) ev._newAwardYears.push(awardYear);
    }
  }

  // ── SANCIONES Y SUSPENSIONES ────────────────────────────────────────────
  // Probabilidad baja de que un peleador activo sea sancionado tras un evento
  // Sanciones: probabilidad baja (~0.4% por evento), duraciones realistas.
  // Suspensiones largas (1-2 años) solo para dopaje grave — y son muy raras.
  const SANCTION_TYPES=[
    {note:'Dopaje — EPO (USADA)',        days:[180,365], cat:'doping',  stripTitle:true,  weight:1},
    {note:'Dopaje — esteroides',         days:[180,270], cat:'doping',  stripTitle:true,  weight:1},
    {note:'Dopaje — hormona de crecimiento', days:[90,180], cat:'doping', stripTitle:false, weight:1},
    {note:'Dopaje — sustancia desconocida', days:[60,120], cat:'doping', stripTitle:false, weight:2},
    {note:'Conducta antideportiva',      days:[15,45],   cat:'conduct', stripTitle:false, weight:4},
    {note:'Altercado fuera del octágono',days:[30,90],   cat:'conduct', stripTitle:false, weight:3},
    {note:'Incumplimiento de peso',      days:[30,60],   cat:'conduct', stripTitle:false, weight:3},
    {note:'No presentarse a control antidopaje', days:[45,90], cat:'doping', stripTitle:false, weight:2},
    {note:'Amenazas a rival',            days:[15,45],   cat:'conduct', stripTitle:false, weight:4},
    {note:'Sustancia prohibida (marihuana)', days:[15,45], cat:'doping', stripTitle:false, weight:3},
  ];
  // Probabilidad: 0.4% por peleador activo por evento (~1 sanción cada 25 eventos en liga de 200)
  const activeFighters = STATE.fighters.filter(f=>f.status==='active'||f.status==='injured');
  activeFighters.forEach(fighter=>{
    if(Math.random()<0.004){
      // Selección ponderada — conductas leves más frecuentes que dopaje grave
      const pool=SANCTION_TYPES.flatMap(s=>Array(s.weight).fill(s));
      const sanction=pool[~~(Math.random()*pool.length)];
      const days=randi(sanction.days[0],sanction.days[1]);
      if(!fighter.suspension) fighter.suspension={active:false,untilDate:null,note:'',cat:'',history:[]};
      fighter.suspension.history=fighter.suspension.history||[];
      fighter.suspension.history.push({note:sanction.note,days,date:ev.date,cat:sanction.cat});
      fighter.suspension.active=true;
      fighter.suspension.untilDate=addDays(ev.date,days);
      fighter.suspension.note=sanction.note;
      fighter.suspension.cat=sanction.cat;
      const prevStatus=fighter.status;
      fighter.status='suspended';
      // Si es campeón y la sanción conlleva despojo de título
      if(sanction.stripTitle){
        STATE.titles.forEach(t=>{
          if(t.holderId===fighter.id){
            const reign=(fighter.titleReigns||[]).find(r=>r.titleId===t.id&&!r.isInterim&&!r.lostDate);
            if(reign) reign.lostDate=ev.date;
            t.holderId=null;
            logEvent(`🚫 ${fName(t)} queda VACANTE — ${fName(fighter)} sancionado por dopaje.`);
            richToast(`🚫 ${fName(fighter)} despojado de ${fName(t)} por sanción de dopaje`,'🚫','#ef5350',5000);
          }
          if(t.interimHolderId===fighter.id){
            const reign=(fighter.titleReigns||[]).find(r=>r.titleId===t.id&&r.isInterim&&!r.lostDate);
            if(reign) reign.lostDate=ev.date;
            t.interimHolderId=null;
          }
        });
      }
      logEvent(`🚫 ${fName(fighter)} sancionado: ${sanction.note} · ${days} días (hasta ${fmtDate(fighter.suspension.untilDate)})`);
      richToast(`🚫 ${fName(fighter)}: ${sanction.note}`,'🚫','#ef5350',5000);
    }
  });

  ev.status='completed';

  // ── ECONOMÍA: ingresos del evento (popularidad de las peleas) menos bolsas pagadas ──
  // Bonos reales en dólares (como en la UFC real): Pelea de la Noche y Actuación de la Noche
  // son bonos fijos en efectivo, no solo contadores de prestigio.
  const FOTN_BONUS_USD = 50000, POTN_BONUS_USD = 50000;
  let eventRevenue=0, totalPurses=0, totalBonusPayouts=0;
  completedFights.forEach(ft=>{
    const r=ft.result; if(!r) return;
    const fA=STATE.fighters.find(x=>x.id===ft.fighterA), fB=STATE.fighters.find(x=>x.id===ft.fighterB);
    if(!fA||!fB) return;
    // Los ingresos se calculan por el valor de mercado "justo" del peleador (fama/nivel), NO por
    // lo que realmente cobra — así, si el jugador le paga de más respecto a su tirón real, ese
    // exceso sale directamente del margen (decisión mala = pierdes dinero), y si negocia una
    // bolsa por debajo de su valor, el margen mejora. Esto mantiene el negocio sano a cualquier
    // escala de estrellato sin blindar al jugador de sus propias decisiones de contratación.
    const fairA=fairPurse(generalScore(fA),fA.reputation), fairB=fairPurse(generalScore(fB),fB.reputation);
    let fightRevenue=estimateFightRevenue(fairA,fairB,fightRevenueOpts(ft,fA,fB));
    // Variación real por cómo sale el combate: ni el mejor cartel garantiza recaudación si el
    // público reacciona mal (combate soso, poca acción...) — así hasta un evento bien pagado
    // puede acabar perdiendo dinero, como en la vida real. La estimación previa (tplEventBuilder)
    // muestra el valor ESPERADO; el resultado real siempre puede variar por encima o por debajo.
    fightRevenue *= 0.7 + Math.random()*0.6;
    if(r.method==='Decisión' && r.decType==='Unánime') fightRevenue *= 0.9;
    if(r.isFOTN) fightRevenue*=1.15;
    eventRevenue+=Math.round(fightRevenue);
    [fA,fB].forEach(pf=>{
      if(!pf.contract) pf.contract=makeContract(generalScore(pf), pf.reputation);
      let bonusMoney=0;
      if(r.winnerId===pf.id && r.method!=='Decisión') bonusMoney+=(pf.contract.finishBonus||0);
      if(r.isFOTN) bonusMoney+=FOTN_BONUS_USD;
      if(r.isPOTN && r.winnerId===pf.id) bonusMoney+=POTN_BONUS_USD;
      const purse=(pf.contract.salary||0)+bonusMoney;
      totalPurses+=purse;
      totalBonusPayouts+=bonusMoney;
      if(!pf.earnings) pf.earnings={totalPurses:0,totalBonusMoney:0};
      pf.earnings.totalPurses+=(pf.contract.salary||0);
      pf.earnings.totalBonusMoney+=bonusMoney;
      if(pf.sponsor) eventRevenue+=(pf.sponsor.incomePerFight||0);
    });
  });
  STATE.meta.budget=(STATE.meta.budget||0)+eventRevenue-totalPurses;
  recordBudgetTx(eventRevenue-totalPurses, `Evento: ${fName(ev)}`, ev.date);
  // Compras PPV: cifra de cara al jugador (no forma parte del dinero real del negocio), con la
  // misma variación por cómo sale el combate principal — un main event soso vende menos.
  let estBuys = estimateEventBuys(ev);
  const mainResult = ev.card[0]?.result;
  if(mainResult){
    estBuys *= 0.75 + Math.random()*0.5;
    if(mainResult.method==='Decisión' && mainResult.decType==='Unánime') estBuys *= 0.9;
    if(mainResult.isFOTN) estBuys *= 1.1;
  }
  ev._finance={revenue:eventRevenue, purses:totalPurses, bonusPayouts:totalBonusPayouts, net:eventRevenue-totalPurses, buys:Math.round(estBuys)};
  const net=eventRevenue-totalPurses;
  logEvent(`💰 ${fName(ev)}: ingresos $${eventRevenue.toLocaleString()} − bolsas $${totalPurses.toLocaleString()} = ${net>=0?'+':''}$${net.toLocaleString()}`);

  STATE.meta.eventSeq++;
  evolveAttributes(ev.date);
  // Lesiones de entrenamiento (probabilidad baja)
  applyTrainingInjuries(ev.date);
  // Decaimiento ATP
  decayAtpPoints(ev.date);

  // 4. Verificar presión de defensas de título
  ev._titleAlerts = checkTitleDefensePressure(ev.date);

  // 9. Noticias narrativas
  generateNews(STATE.fighters);

  // Callouts entre peleadores
  generateCallouts(ev.date);
  expireStaleCallouts();

  // Scouting periódico (cada 3 eventos)
  if(STATE.meta.eventSeq % 3 === 0) generateScoutCandidates();

  // Las promotoras rivales avanzan un turno al mismo ritmo que tú
  advanceRivalPromotions(ev.date);

  // Negociaciones olvidadas: si llevan 5+ eventos sin atender, se resuelven solas al valor de
  // mercado actual del peleador (no a su tarifa antigua) — así ignorar la negociación no genera
  // una ventaja económica pasiva por dejar a una estrella en ascenso con contrato de novato.
  (STATE.pendingNegotiations||[]).slice().forEach(n=>{
    if(STATE.meta.eventSeq-(n.eventSeqCreated||0)>=5){
      const pf=STATE.fighters.find(x=>x.id===n.fighterId);
      STATE.pendingNegotiations=STATE.pendingNegotiations.filter(x=>x!==n);
      if(pf){
        if(!pf.contractHistory) pf.contractHistory=[];
        pf.contractHistory.push({salary:pf.contract.salary, finishBonus:pf.contract.finishBonus, fightsLeft:pf.contract.fightsLeft, signedDate:pf.contract.signedDate||null, endedDate:ev.date});
        const fresh=makeContract(generalScore(pf), pf.reputation);
        pf.contract.salary=fresh.salary; pf.contract.finishBonus=fresh.finishBonus; pf.contract.fightsLeft=3; pf.contract.signedDate=ev.date;
        logEvent(`📄 ${fName(pf)} renueva en silencio a valor de mercado ($${fresh.salary.toLocaleString()}/pelea) — nadie atendió la negociación.`);
      }
    }
  });

  refreshRankings();
  saveRankingSnapshot(ev.id, ev.date);
  autoFillDivisions();
  logEvent(`✅ ${fName(ev)} completado (${completedFights.length} combates).`);
  // El resumen lo muestran los callers DESPUÉS de render(), no aquí
  ev._completedFights = completedFights; // guardar referencia para el resumen
}

}

/* ====================== MOMENTUM Y RACHAS ====================== */
function updateMomentum(fighter, won){
  if(!fighter.momentum) fighter.momentum=0;
  // won=true: W, won=false: L, won='draw': no change
  if(won===true){  fighter.momentum = Math.min((fighter.momentum||0)+1, 10); }
  else if(won===false){ fighter.momentum = 0; }
  // draws don't reset streak
}
// Bonus temporal de atributos por racha (solo para la simulación, no modifica stats reales)
function momentumBonus(f){
  const m = f.momentum||0;
  if(m<3) return 0;
  if(m<5) return 2;
  if(m<8) return 4;
  return 6;
}

/* ====================== MISS WEIGHT / SOBREPESO / CORTE DE PESO ====================== */
// El corte de peso (Seguro/Normal/Agresivo) ya no lo elige el jugador: cada peleador lo decide
// por su cuenta (autoWeightCutMode), justo antes de simularse su combate. Agresivo sube el riesgo
// de no dar el peso, pero si lo da, rehidrata con ventaja física (+stats).
function autoWeightCutMode(){
  const r=Math.random();
  return r<0.12?'aggressive' : r<0.42?'safe' : 'normal';
}
function weightCutMissProb(mode){ return mode==='safe'?0.02 : mode==='aggressive'?0.16 : 0.06; }
function weightCutBonus(fight, fighterId, missedId){
  if(!fighterId || missedId===fighterId) return 0;
  const mode = fight.fighterA===fighterId ? fight.weightCutA : fight.weightCutB;
  return mode==='aggressive' ? 3 : 0;
}
// Llamado antes de simular un combate. Asigna el modo de corte de peso de cada peleador
// (si aún no lo tenía) y devuelve qué peleador faltó al peso (o null).
function checkMissWeight(fight){
  if(!fight.weightCutA) fight.weightCutA=autoWeightCutMode();
  if(!fight.weightCutB) fight.weightCutB=autoWeightCutMode();
  const probA = weightCutMissProb(fight.weightCutA);
  const probB = weightCutMissProb(fight.weightCutB);
  const a = Math.random()<probA? fight.fighterA : null;
  const b = !a && Math.random()<probB? fight.fighterB : null;
  return a||b||null;
}

/* ====================== LESIONES DE ENTRENAMIENTO ====================== */
// Se llama en finishEvent — probabilidad muy baja de lesión sin combatir
function applyTrainingInjuries(eventDate){
  const TRAINING_INJURY_PROB = 0.015; // 1.5% por peleador por evento
  STATE.fighters.filter(f=>f.status==='active').forEach(f=>{
    if(Math.random()<TRAINING_INJURY_PROB){
      const days=randi(30,120);
      f.injury={active:true,untilDate:addDays(eventDate,days),note:pick(['Lesión de rodilla','Fractura de mano','Desgarro muscular','Lesión de hombro','Esguince de tobillo'])};
      f.status='injured';
      logEvent(`🩹 ${fName(f)} sufre una lesión entrenando (${f.injury.note}) y estará fuera hasta ${fmtDate(f.injury.untilDate)}.`);
    }
  });
}

/* ====================== ATP RANKING POINTS ====================== */
// Los puntos ATP coexisten con el rankScore, añaden dinámica de decaimiento y valor por rival
function awardAtpPoints(winner, loser, isTitle){
  if(!STATE.atpPoints) STATE.atpPoints={};
  const loserPts = STATE.atpPoints[loser.id]||0;
  // Puntos según ranking del rival (cuanto mejor el rival, más puntos)
  const divList = divisionTop15(winner.division);
  const loserPos = divList.findIndex(x=>x.id===loser.id);
  const basePts = loserPos===0?500:loserPos===1?400:loserPos<=3?300:loserPos<=7?200:loserPos<=10?150:100;
  const titleBonus = isTitle?200:0;
  STATE.atpPoints[winner.id]=(STATE.atpPoints[winner.id]||0)+basePts+titleBonus;
  // Penalización por derrota (pierde el 30% de sus puntos actuales)
  STATE.atpPoints[loser.id]=Math.round((STATE.atpPoints[loser.id]||0)*0.7);
}
// Decaimiento semestral: llamado al finalizar cada evento, reduce puntos del campo inactivo
function decayAtpPoints(eventDate){
  if(!STATE.atpPoints) return;
  Object.keys(STATE.atpPoints).forEach(fid=>{
    const f=STATE.fighters.find(x=>x.id===fid); if(!f) return;
    // Peleadores sin pelear en +180 días pierden 10% de puntos por evento
    const lastFight = f.lastEventSeq!=null?
      STATE.events.find(e=>e.seq===f.lastEventSeq&&e.status==='completed')?.date : null;
    const days = lastFight? Math.round((new Date(eventDate)-new Date(lastFight))/86400000) : 999;
    if(days>180) STATE.atpPoints[fid]=Math.round(STATE.atpPoints[fid]*0.9);
  });
}

function tplTitleTimeline(tid){
  const title=STATE.titles.find(t=>t.id===tid); if(!title) return '';
  // Reconstruir reinados con fechas
  const reigns=[];
  STATE.fighters.forEach(f=>{
    (f.titleReigns||[]).filter(r=>r.titleId===tid).forEach(r=>{
      const start=new Date(r.wonDate), end=r.lostDate?new Date(r.lostDate):new Date(STATE.meta.currentDate);
      const days=Math.round((end-start)/86400000);
      reigns.push({f, start, end, days, defenses:r.defenses||0, isInterim:r.isInterim, wonDate:r.wonDate, lostDate:r.lostDate});
    });
  });
  reigns.sort((a,b)=>a.start-b.start);

  const totalDays=reigns.reduce((s,r)=>s+r.days,0)||1;

      const pct=Math.max(3,Math.round(r.days/totalDays*100));

function saveRankingSnapshot(eventId, eventDate){

    p4p:p4pTop15().map((f,i)=>({id:f.id,name:f.name,pos:i+1})), divisions:{}};
  DIVISIONS.forEach(d=>{snapshot.divisions[d.id]=divisionTop15(d.id).map((f,i)=>({id:f.id,name:f.name,pos:i+1}));});
  STATE.rankingHistory.push(snapshot);
  if(STATE.rankingHistory.length>50) STATE.rankingHistory.shift();

function tplRankingHistory(){
  const snaps=STATE.rankingHistory||[];
  if(!snaps.length) return `<div class="card"><h2>📈 Historial de Rankings</h2><p class="muted">Aún no hay snapshots. Se guardan automáticamente tras cada evento.</p></div>`;
  const selDiv=UI.rhDiv||'p4p';
  const divOpts=`<option value="p4p">P4P</option>`+DIVISIONS.map(d=>`<option value="${d.id}">${divName(d.id)}</option>`).join('');
  // Filtrar peleadores por división seleccionada
  let fighters;
  if(selDiv==='p4p'){
    const idsInP4P=new Set(snaps.flatMap(s=>s.p4p.map(x=>x.id)));
    fighters=STATE.fighters.filter(f=>idsInP4P.has(f.id)||f.status!=='retired').slice().sort((a,b)=>b.rankScore-a.rankScore);
  } else {
    const idsInDiv=new Set(snaps.flatMap(s=>(s.divisions[selDiv]||[]).map(x=>x.id)));
    fighters=STATE.fighters.filter(f=>f.division===selDiv||idsInDiv.has(f.id)).slice().sort((a,b)=>b.rankScore-a.rankScore);
    if(!fighters.length) fighters=STATE.fighters.filter(f=>f.division===selDiv);
  }
  const validIds=new Set(fighters.map(f=>f.id));
  if(UI.rhFid && !validIds.has(UI.rhFid)) UI.rhFid=fighters[0]?.id;
  const selFid=UI.rhFid||fighters[0]?.id;
  const fOpts=fighters.map(f=>{
    const isC=STATE.titles.some(t=>t.holderId===f.id);
    const isI=STATE.titles.some(t=>t.interimHolderId===f.id);
    return `<option value="${f.id}">${isC?'🏆 ':isI?'🥈 ':''}${fName(f)}${f.status==='retired'?' (ret.)':''}</option>`;
  }).join('');
  const chartData=snaps.map(s=>{
    const list=selDiv==='p4p'?s.p4p:(s.divisions[selDiv]||[]);
    const entry=list.find(x=>x.id===selFid);
    return {date:s.date,pos:entry?entry.pos:null};
  }).filter(x=>x.pos!==null);
  const W=340,H=150,PAD=32;
  let svg='';
  if(chartData.length>=2){
    const xs=chartData.map((_,i)=>PAD+(i/(chartData.length-1))*(W-PAD*2));
    const ys=chartData.map(d=>PAD+(d.pos-1)/(14)*(H-PAD*2));
    [1,5,10,15].forEach(p=>{const y=PAD+(p-1)/14*(H-PAD*2);svg+=`<line x1="${PAD}" y1="${y}" x2="${W-PAD}" y2="${y}" stroke="#222" stroke-width="1"/><text x="${PAD-4}" y="${y+4}" fill="#555" font-size="9" text-anchor="end">#${p}</text>`;});
    svg+=`<polyline points="${xs.map((x,i)=>`${x},${ys[i]}`).join(' ')}" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linejoin="round"/>`;
    chartData.forEach((d,i)=>{
      svg+=`<circle cx="${xs[i]}" cy="${ys[i]}" r="4" fill="#d4af37"/>`;
      if(i===0||i===chartData.length-1||chartData.length<=8) svg+=`<text x="${xs[i]}" y="${ys[i]-8}" fill="#d4af37" font-size="8" text-anchor="middle">#${d.pos}</text>`;
    });

/* ====================== RICH TOASTS ====================== */
const _toastQueue=[];let _toastActive=false;
function richToast(msg, icon='ℹ️', color='#d4af37', duration=4000, cat='general'){
  const cfg=UI.notifCfg||{}; if(cfg[cat]===false) return;
  _toastQueue.push({msg,icon,color,duration});
  if(!_toastActive) _drainToasts();
}
function _drainToasts(){
  if(!_toastQueue.length){_toastActive=false;return;}
  _toastActive=true;
  const {msg,icon,color,duration}=_toastQueue.shift();
  // Remove any existing toast
  document.querySelectorAll('.rich-toast').forEach(e=>e.remove());
  const el=document.createElement('div');
  el.className='rich-toast';
  el.style.cssText=`position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid ${color};border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;z-index:9999;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,.6);transition:opacity .3s`;
  el.innerHTML=`<span style="font-size:1.5rem">${icon}</span><div style="font-size:.83rem;font-weight:700;color:${color}">${msg}</div>`;
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>{el.remove();setTimeout(_drainToasts,200);},300);},duration);
}

function getPfpRank(f){
  const sorted=STATE.fighters.filter(x=>x.status==='active').sort((a,b)=>b.rankScore-a.rankScore);
  const idx=sorted.findIndex(x=>x.id===f.id);
  return idx>=0&&idx<15?idx+1:null;
}
function getDivRank(f){
  const list=divisionTop15(f.division);
  const idx=list.findIndex(x=>x.id===f.id);
  return idx>=0?idx+1:null;
}
// Igual que divisionTop15 pero sin recortar a 15 — para saber la posición real de cualquier
// peleador de la división (por ejemplo, para juzgar si un sustituto de última hora es un
// reemplazo razonable frente al rival original en términos de ranking, no solo de nivel bruto).
function divisionFullRank(f){
  const divTitle=STATE.titles.find(t=>t.divisionId===f.division && !t.isInterim)||{};
  const champId=divTitle.holderId, interimId=divTitle.interimHolderId;
  const list=STATE.fighters.filter(x=>x.division===f.division && x.status!=='retired')
    .sort((a,b)=>{
      if(a.id===champId) return -1;
      if(b.id===champId) return 1;
      if(a.id===interimId) return -1;
      if(b.id===interimId) return 1;
      const am=a.manualRankDivision, bm=b.manualRankDivision;
      if(am!=null && bm!=null) return am-bm;
      if(am!=null) return -1;
      if(bm!=null) return 1;
      return b.rankScore-a.rankScore;
    });
  const idx=list.findIndex(x=>x.id===f.id);
  return idx>=0?idx+1:null;
}

function fighterColor(fid){
  let h=0; for(let i=0;i<fid.length;i++) h=(h*31+fid.charCodeAt(i))&0xffffffff;

}

// Informe anual de la liga: cifras agregadas de negocio y de combate para un año concreto,
// reutilizando el mismo ev._finance que ya calcula finishEvent() — no inventa datos nuevos.
function computeYearReport(year){
  const yearEvents = STATE.events.filter(e=>e.status==='completed' && parseInt((e.date||'').slice(0,4))===year);
  const yearFights = yearEvents.flatMap(e=>e.card.filter(ft=>ft.result));
  const finishes = yearFights.filter(ft=>ft.result.method!=='Decisión').length;
  const acc = yearEvents.reduce((a,e)=>{
    a.revenue+=e._finance?.revenue||0; a.purses+=e._finance?.purses||0;
    a.net+=e._finance?.net||0; a.buys+=e._finance?.buys||0;
    return a;
  },{revenue:0,purses:0,net:0,buys:0});
  return {
    events: yearEvents.length, fights: yearFights.length,
    finishRate: yearFights.length? Math.round(finishes/yearFights.length*100):0,
    ...acc,
  };
}

  ${block('Más victorias UFC',all.slice().sort((a,b)=>ufcWinsOf(b)-ufcWinsOf(a)),ufcWinsOf)}
  ${block('Más KO/TKO UFC',all.slice().sort((a,b)=>ufcKoWinsOf(b)-ufcKoWinsOf(a)),ufcKoWinsOf,'🥊')}
  ${block('Más sumisiones UFC',all.slice().sort((a,b)=>ufcSubWinsOf(b)-ufcSubWinsOf(a)),ufcSubWinsOf,'🤼')}
  ${block('Más finalizaciones UFC (KO+Sub)',all.slice().sort((a,b)=>(ufcKoWinsOf(b)+ufcSubWinsOf(b))-(ufcKoWinsOf(a)+ufcSubWinsOf(a))),f=>ufcKoWinsOf(f)+ufcSubWinsOf(f),'⚡')}
  ${block('Más defensas de título',all.slice().sort((a,b)=>totalDefensesOf(b)-totalDefensesOf(a)),totalDefensesOf,'🛡️')}
  ${block('Racha activa de victorias',all.filter(f=>currentStreak(f)>0).slice().sort((a,b)=>currentStreak(b)-currentStreak(a)),currentStreak,'🔥')}
  ${block('Más reinados de título',all.slice().sort((a,b)=>totalReignsOf(b)-totalReignsOf(a)),totalReignsOf,'👑')}
  ${block('% victorias UFC (mín.5 peleas UFC)',all.filter(f=>(ufcWinsOf(f)+ufcLossesOf(f))>=5).slice().sort((a,b)=>winPct(b)-winPct(a)),f=>winPct(f)+'%','📈')}
  ${block('% finalizaciones UFC (mín.5 V)',all.filter(f=>ufcWinsOf(f)>=5).slice().sort((a,b)=>finishRate(b)-finishRate(a)),f=>finishRate(f)+'%')}
  ${block('Más peleas en la UFC',all.slice().sort((a,b)=>ufcFightsOf(b)-ufcFightsOf(a)),ufcFightsOf)}
  ${block('Mayor GOAT Score',all.slice().sort((a,b)=>goatScore(b)-goatScore(a)),goatScore,'🐐')}
  ${block('Mejor atributo General',all.slice().sort((a,b)=>generalScore(b)-generalScore(a)),generalScore,'⭐')}
  ${block('Más Peleas de la Noche',all.slice().sort((a,b)=>b.bonuses.fightOfNight-a.bonuses.fightOfNight),f=>f.bonuses.fightOfNight,'🌟')}
  ${block('Más Actuaciones de la Noche',all.slice().sort((a,b)=>b.bonuses.performanceOfNight-a.bonuses.performanceOfNight),f=>f.bonuses.performanceOfNight,'⭐')}
  <h3 style="margin:12px 8px 4px">📉 Datos negativos</h3>
  ${block('Más derrotas UFC',all.slice().sort((a,b)=>ufcLossesOf(b)-ufcLossesOf(a)),ufcLossesOf)}
  ${block('Más KO/TKO recibidos UFC',all.slice().sort((a,b)=>(b.record.ufcKoLosses||0)-(a.record.ufcKoLosses||0)),f=>f.record.ufcKoLosses||0,'💥')}
  ${block('Más sumisiones recibidas UFC',all.slice().sort((a,b)=>(b.record.ufcSubLosses||0)-(a.record.ufcSubLosses||0)),f=>f.record.ufcSubLosses||0)}
  ${block('Más decisiones perdidas UFC',all.slice().sort((a,b)=>(b.record.ufcDecLosses||0)-(a.record.ufcDecLosses||0)),f=>f.record.ufcDecLosses||0)}
  ${block('Más finalizaciones recibidas UFC',all.slice().sort((a,b)=>((b.record.ufcKoLosses||0)+(b.record.ufcSubLosses||0))-((a.record.ufcKoLosses||0)+(a.record.ufcSubLosses||0))),f=>(f.record.ufcKoLosses||0)+(f.record.ufcSubLosses||0),'💀')}
  ${block('Más fallos de peso',all.filter(f=>f.missedWeightCount).slice().sort((a,b)=>(b.missedWeightCount||0)-(a.missedWeightCount||0)),f=>f.missedWeightCount||0,'⚖️')}

  <h3 style="margin:12px 8px 4px">🏆 Récords en combates por el título</h3>
  ${(()=>{
    const titleFights=[];
    STATE.events.filter(e=>e.status==='completed').forEach(ev=>{
      ev.card.filter(ft=>ft.titleId&&ft.result).forEach(ft=>{
        const w=STATE.fighters.find(x=>x.id===ft.result.winnerId);
        const l=STATE.fighters.find(x=>x.id===ft.result.loserId);
        const t=STATE.titles.find(x=>x.id===ft.titleId);
        if(w&&l&&t) titleFights.push({ft,w,l,t,ev,isInterim:ft.isInterim});
      });
    });
    if(!titleFights.length) return '<div class="card"><p class="muted">Sin combates por el título simulados todavía.</p></div>';
    const toSecs=r=>(r.round-1)*300+parseInt(r.time?.split(':')[0]||0)*60+parseInt(r.time?.split(':')[1]||0);
    const titleWins={}, titleLosses={}, titleKoWins={}, titleSubWins={}, titleDecWins={}, titleShots={};
    titleFights.forEach(({ft,w,l})=>{
      titleWins[w.id]=(titleWins[w.id]||0)+1;
      titleLosses[l.id]=(titleLosses[l.id]||0)+1;
      titleShots[w.id]=(titleShots[w.id]||0)+1;
      titleShots[l.id]=(titleShots[l.id]||0)+1;
      if(ft.result.method==='KO/TKO') titleKoWins[w.id]=(titleKoWins[w.id]||0)+1;
      else if(ft.result.method==='Sumisión') titleSubWins[w.id]=(titleSubWins[w.id]||0)+1;
      else titleDecWins[w.id]=(titleDecWins[w.id]||0)+1;
    });
    const finishT=titleFights.filter(f=>f.ft.result.method!=='Decisión');
    const koT=titleFights.filter(f=>f.ft.result.method==='KO/TKO').sort((a,b)=>toSecs(a.ft.result)-toSecs(b.ft.result));
    const subT=titleFights.filter(f=>f.ft.result.method==='Sumisión').sort((a,b)=>toSecs(a.ft.result)-toSecs(b.ft.result));
    const fastest=finishT.slice().sort((a,b)=>toSecs(a.ft.result)-toSecs(b.ft.result))[0];
    const slowest=finishT.slice().sort((a,b)=>toSecs(b.ft.result)-toSecs(a.ft.result))[0];
    const frustratedShots=Object.entries(titleShots).map(([id,shots])=>({id,shots,wins:titleWins[id]||0})).filter(x=>!x.wins&&x.shots>0).sort((a,b)=>b.shots-a.shots).slice(0,5);
    const distinctTitles={};
    titleFights.forEach(({w,t})=>{ if(!distinctTitles[w.id]) distinctTitles[w.id]=new Set(); distinctTitles[w.id].add(t.id); });
    const topMulti=Object.entries(distinctTitles).map(([id,s])=>({id,n:s.size})).sort((a,b)=>b.n-a.n).slice(0,5);
    const defStreaks={};
    titleFights.slice().sort((a,b)=>new Date(a.ev.date)-new Date(b.ev.date)).forEach(({ft,w,l,t})=>{
      if(!defStreaks[t.id]) defStreaks[t.id]={best:0,cur:0,holderId:null,name:null,id:null};
      const d=defStreaks[t.id];
      if(d.holderId===w.id){ d.cur++; if(d.cur>d.best){d.best=d.cur;d.name=w.name;d.id=w.id;} }
      else { d.cur=0; d.holderId=w.id; }
    });
    const bestStreak=Object.values(defStreaks).sort((a,b)=>b.best-a.best)[0];
    const reignDays=[];
    STATE.fighters.forEach(f=>{(f.titleReigns||[]).forEach(r=>{
      const days=Math.round((new Date(r.lostDate||STATE.meta.currentDate)-new Date(r.wonDate))/86400000);
      if(days>0) reignDays.push({f,days,active:!r.lostDate});
    });});
    reignDays.sort((a,b)=>b.days-a.days);
    const maxDef=[];
    STATE.fighters.forEach(f=>{(f.titleReigns||[]).forEach(r=>{if((r.defenses||0)>0) maxDef.push({f,defs:r.defenses,isInterim:r.isInterim});});});
    maxDef.sort((a,b)=>b.defs-a.defs);
    const tblock=(ttl,entries,valFn,icon='')=>{
      const rows=entries.slice(0,6).map((x,i)=>{
        const f=STATE.fighters.find(ff=>ff.id===x.id);
        return f?`<tr class="clickable" data-id="${x.id}"><td>${i+1}</td><td><b>${fName(f)}</b></td><td><b>${valFn(x)}</b></td></tr>`:'';
      }).join('')||'<tr><td colspan="3" class="muted">Sin datos</td></tr>';
      return `<div class="card"><h3>${icon} ${ttl}</h3><table><tbody>${rows}</tbody></table></div>`;
    };
    const fmtTitleRec=(w,l,ft,label)=>{
      const method=ft.result.method, r=ft.result.round, t=ft.result.time;
      return `<div style="padding:3px 0">${label}: <b>${fName(w)}</b> def. ${fName(l)} · R${r} ${t}</div>`;
    };
    return [
      tblock('Más victorias en combates titulares',Object.entries(titleWins).map(([id,n])=>({id,n})).sort((a,b)=>b.n-a.n),x=>x.n,'👑'),
      tblock('Más KO en combate titular',Object.entries(titleKoWins).map(([id,n])=>({id,n})).sort((a,b)=>b.n-a.n),x=>x.n,'💥'),
      tblock('Más sumisiones en combate titular',Object.entries(titleSubWins).map(([id,n])=>({id,n})).sort((a,b)=>b.n-a.n),x=>x.n,'🤼'),
      tblock('Más defensas en un solo reinado',maxDef.map(x=>({id:x.f.id,defs:x.defs})),x=>x.defs,'🛡️'),
      tblock('Reinado más largo (días)',reignDays.map(x=>({id:x.f.id,days:x.days,active:x.active})),x=>x.days+(x.active?' ⭐':''),'📅'),
      topMulti.filter(x=>x.n>1).length?tblock('Campeones en varias divisiones',topMulti.filter(x=>x.n>1),x=>x.n+' títulos','🌍'):'',
      frustratedShots.length?tblock('Más intentos sin ganar el título',frustratedShots.map(x=>({id:x.id,shots:x.shots})),x=>x.shots+' intentos','😤'):'',
      `<div class="card"><h3>⚡ Récords de tiempo en combates titulares</h3>
        <div style="font-size:.78rem">
          ${koT[0]?fmtTitleRec(koT[0].w,koT[0].l,koT[0].ft,'💥 KO más rápido'):''}
          ${subT[0]?fmtTitleRec(subT[0].w,subT[0].l,subT[0].ft,'🤼 Sub más rápida'):''}
          ${slowest&&slowest!==fastest?fmtTitleRec(slowest.w,slowest.l,slowest.ft,'🕐 Fin más tardío'):''}
          ${bestStreak&&bestStreak.best>0?'<div style="padding:3px 0">🛡️ Racha más larga: <b>'+bestStreak.name+'</b> · '+bestStreak.best+' consecutivas</div>':''}
          ${!koT[0]&&!subT[0]?'<p class="muted">Sin finalizaciones en combates titulares aún.</p>':''}
        </div>
      </div>`
    ].join('');
  })()}
  ${recordsSection}`;
}

function tplActivity(){
  const currentYear = (STATE.meta.currentDate||'2025').slice(0,4);

  // ── TOP PELEADORES MÁS ACTIVOS ESTE AÑO ─────────────────────────────
  const fightsThisYear = {};
  STATE.events.filter(e=>e.status==='completed'&&(e.date||'').startsWith(currentYear)).forEach(ev=>{
    ev.card.filter(ft=>ft.result).forEach(ft=>{
      fightsThisYear[ft.fighterA]=(fightsThisYear[ft.fighterA]||0)+1;
      fightsThisYear[ft.fighterB]=(fightsThisYear[ft.fighterB]||0)+1;
    });
  });
  const topActive = Object.entries(fightsThisYear)
    .map(([id,n])=>({f:STATE.fighters.find(x=>x.id===id),n}))
    .filter(x=>x.f)
    .sort((a,b)=>b.n-a.n)
    .slice(0,10);

  const topActiveHtml = topActive.length ? `
  <div class="card">
    <h3>📊 Top activos en ${currentYear}</h3>
    <table><thead><tr><th>#</th><th>Nombre</th><th>Peleas</th><th>División</th></tr></thead><tbody>
    ${topActive.map((x,i)=>`<tr class="clickable" data-id="${x.f.id}">
      <td>${i+1}</td>
      <td>${fName(x.f)}${STATE.titles.some(t=>t.holderId===x.f.id)?' 🏆':''}${x.f.status==='injured'?' 🩹':x.f.status==='suspended'?' 🚫':''}</td>
      <td style="font-weight:700;color:#66bb6a">${x.n}</td>
      <td class="muted" style="font-size:.75rem">${divName(x.f.division)}</td>
    </tr>`).join('')}
    </tbody></table>
  </div>` : `<div class="card"><h3>📊 Top activos en ${currentYear}</h3><p class="muted">Sin eventos completados este año.</p></div>`;

  // ── LISTA GENERAL DE ACTIVIDAD ───────────────────────────────────────
  const list = STATE.fighters.filter(f=>f.status!=='retired').map(f=>{
    let lastDate=null, lastEvName=null;
    if(f.lastEventSeq!=null){
      const ev = STATE.events.find(e=>e.seq===f.lastEventSeq && e.status==='completed');
      if(ev){ lastDate=ev.date; lastEvName=ev.name; }
    }
    const daysSince = lastDate? Math.round((new Date(STATE.meta.currentDate)-new Date(lastDate))/86400000) : null;
    return {f, lastDate, lastEvName, daysSince};
  }).sort((a,b)=>(b.daysSince??99999)-(a.daysSince??99999));

  let rows='', lastEvSeen=null;
  for(const x of list){
    const evKey = x.lastEvName||'Sin peleas';
    if(evKey!==lastEvSeen){
      rows+=`<tr><td colspan="3" style="padding:6px 4px 2px;font-size:.7rem;color:var(--muted);background:var(--bg3);border-top:1px solid var(--line)">📅 ${evKey}${x.lastDate?' · '+fmtDate(x.lastDate):''}</td></tr>`;
      lastEvSeen=evKey;
    }
    const statusBadge = x.f.status==='injured'?' 🩹':x.f.status==='suspended'?' 🚫':'';
    rows+=`<tr class="clickable" data-id="${x.f.id}"><td>${fName(x.f)}${statusBadge}${STATE.titles.some(t=>t.holderId===x.f.id)?' 🏆':''}</td><td>${x.lastDate?fmtDate(x.lastDate):'Nunca'}</td><td>${x.daysSince??'-'}</td></tr>`;
  }
  return `
  ${topActiveHtml}
  <div class="card"><h2>Actividad de peleadores</h2>
  <p class="muted">Agrupado por último evento. Útil para gestionar el cooldown. 🚫 = suspendido.</p>
  <table><thead><tr><th>Nombre</th><th>Última pelea</th><th>Días</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ====================== HALL OF FAME ====================== */
function tplHof(){
  const hofMembers = STATE.fighters.filter(f=>f.hof).sort((a,b)=>goatScore(b)-goatScore(a));
  const showAll = !!UI.hofShowAll;
  const fullList = STATE.fighters.slice().sort((a,b)=>goatScore(b)-goatScore(a));
  const goatList = showAll? fullList : fullList.slice(0,20);
  const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':null;
  const podiumRow = (f,i,extra='')=>{
    const m = medal(i);
    return `<div class="clickable fightcard-item" data-id="${f.id}" style="display:flex;align-items:center;gap:8px;padding:${i<3?'8px 6px':'5px 0'};${i<3?'background:rgba(212,175,55,.06);border-radius:8px':''}">
      <span style="font-size:${i<3?'1.3rem':'.72rem'};color:${i<3?'inherit':'#555'};min-width:26px;text-align:center">${m||`#${i+1}`}</span>
      ${avatarHtml(f,i<3?36:28)}
      <span style="flex:1;font-size:${i<3?'.9rem':'.8rem'};font-weight:${i<3?'800':'400'}">${fName(f)}${f.status==='retired'?' <span class="muted" style="font-weight:400">(ret.)</span>':''}${f.hof?' 🏛':''}</span>
      <span style="font-size:.7rem;color:#555">${f.record.wins}-${f.record.losses}</span>
      ${extra}
    </div>`;
  };
  return `
  <div class="card"><h2>🏛 Hall of Fame</h2>
  ${hofMembers.length? hofMembers.map((f,i)=>podiumRow(f,i,`<span style="font-size:.68rem;color:#888">GOAT ${goatScore(f)}</span>`)).join(''):'<p class="muted">Aún no hay miembros. Indúcelos desde el Editor.</p>'}
  </div>
  <div class="card"><h3>Ranking GOAT (activos y retirados)</h3>
  ${goatList.map((f,i)=>podiumRow(f,i,`<span style="font-size:.68rem;color:#888">${goatScore(f)}</span>`)).join('')}
  <button class="btn small full" id="toggleHofFull" style="margin-top:8px">${showAll? 'Mostrar solo Top 20 ▲' : `Ver lista completa (${fullList.length}) ▼`}</button>
  </div>`;
}
function bindHof(){
  const btn = document.getElementById('toggleHofFull');
  if(btn) btn.onclick=()=>{ UI.hofShowAll = !UI.hofShowAll; render(); };
}

/* ====================== 7. SCOUTING ====================== */
function tplDivisions(){
  const selDiv = UI.divTreeDiv || DIVISIONS[0].id;
  const divOpts = DIVISIONS.map(d=>`<option value="${d.id}"${d.id===selDiv?' selected':''}>${divName(d.id)}</option>`).join('');
  const title = STATE.titles.find(t=>t.divisionId===selDiv&&!t.vacated);
  const champ   = title?.holderId       ? STATE.fighters.find(f=>f.id===title.holderId)       : null;
  const interim = title?.interimHolderId? STATE.fighters.find(f=>f.id===title.interimHolderId): null;
  const champId   = champ?.id;
  const interimId = interim?.id;

  // Árbol de combates: construir grafo de victorias en esta división
  const divFights = STATE.events.filter(e=>e.status==='completed')
    .flatMap(e=>e.card.filter(ft=>ft.result&&(
      STATE.fighters.find(x=>x.id===ft.fighterA)?.division===selDiv ||
      STATE.fighters.find(x=>x.id===ft.fighterB)?.division===selDiv
    )).map(ft=>({...ft.result, date:e.date, evName:e.name, fighterA:ft.fighterA, fighterB:ft.fighterB})));

  // Estadísticas de división
  const divFighters = STATE.fighters.filter(f=>f.division===selDiv);
  const active = divFighters.filter(f=>f.status==='active').length;
  const koCount = divFights.filter(f=>f.method==='KO/TKO').length;
  const subCount = divFights.filter(f=>f.method==='Sumisión').length;
  const decCount = divFights.filter(f=>f.method==='Decisión').length;
  const total = divFights.length;

  // Usar divisionTop15 que ya gestiona campeón en #1, interino en #2, resto por score
  const ranked = divisionTop15(selDiv);

  // Árbol visual: mostrar victorias recientes entre los top fighters
  const treeNodes = ranked.slice(0,8);
  const edges = divFights.filter(ft=>{
    return treeNodes.some(f=>f.id===ft.winnerId) && treeNodes.some(f=>f.id===ft.loserId);
  }).slice(-20); // últimas 20 peleas entre top

  const treeHtml = edges.length ? edges.slice().reverse().map(e=>{
    const w=STATE.fighters.find(f=>f.id===e.winnerId), l=STATE.fighters.find(f=>f.id===e.loserId);
    if(!w||!l) return '';
    const mc=methodColor(e.method);
    return `<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #111">
      <div class="clickable" data-id="${w.id}" style="flex:1;text-align:right;font-size:.78rem;font-weight:700;cursor:pointer">${w.name}</div>
      <div style="text-align:center;min-width:80px">
        <div style="font-size:.6rem;color:${mc};font-weight:700">${methodAbbr(e)}</div>
        <div style="font-size:.58rem;color:#555">R${e.round} · ${e.time||''}</div>
        <div style="font-size:.56rem;color:#444">${e.date?.slice(0,7)||''}</div>
      </div>
      <div class="clickable" data-id="${l.id}" style="flex:1;font-size:.78rem;color:#666;cursor:pointer">${l.name}</div>
    </div>`;
  }).join('') : '<p class="muted">Sin combates registrados en esta división todavía.</p>';

  return `
  <div class="card">
    <h2>🗂️ Árbol de la División</h2>
    <select id="divTreeSel" style="width:100%;margin-bottom:12px">${divOpts}</select>

    <!-- Campeón actual + interino -->
    <div style="display:flex;gap:8px;margin-bottom:12px">
    ${champ ? `<div style="flex:1;text-align:center;padding:12px;background:linear-gradient(135deg,#1a1200,#2a2000);border:1px solid #b8860b;border-radius:10px">
      <div style="font-size:.6rem;color:#b8860b;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">👑 Campeón</div>
      ${avatarHtml(champ,56)}
      <div style="font-weight:800;font-size:.88rem;margin-top:5px">${fName(champ)}</div>
      <div style="font-size:.68rem;color:#888">${champ.record.wins}-${champ.record.losses}</div>
    </div>` : `<div style="flex:1;text-align:center;padding:10px;background:#0d0d0d;border-radius:8px;color:#555;display:flex;align-items:center;justify-content:center">Vacante</div>`}
    ${interim ? `<div style="flex:1;text-align:center;padding:12px;background:linear-gradient(135deg,#1a1040,#0d0d2a);border:1px solid #7d5fff;border-radius:10px">
      <div style="font-size:.6rem;color:#b79bff;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">🥈 Campeón Interino</div>
      ${avatarHtml(interim,56)}
      <div style="font-weight:800;font-size:.88rem;margin-top:5px">${fName(interim)}</div>
      <div style="font-size:.68rem;color:#888">${interim.record.wins}-${interim.record.losses}</div>
    </div>` : ''}
    </div>

    <!-- Stats de la división -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;margin-bottom:12px">
      <div style="background:#0d0d0d;border-radius:6px;padding:6px 2px"><div style="font-weight:700">${active}</div><div style="font-size:.58rem;color:#555">Activos</div></div>
      <div style="background:#0d0d0d;border-radius:6px;padding:6px 2px"><div style="font-weight:700;color:#ef5350">${total?Math.round(koCount/total*100):0}%</div><div style="font-size:.58rem;color:#555">KO rate</div></div>
      <div style="background:#0d0d0d;border-radius:6px;padding:6px 2px"><div style="font-weight:700;color:#ce93d8">${total?Math.round(subCount/total*100):0}%</div><div style="font-size:.58rem;color:#555">Sub rate</div></div>
      <div style="background:#0d0d0d;border-radius:6px;padding:6px 2px"><div style="font-weight:700">${total}</div><div style="font-size:.58rem;color:#555">Peleas</div></div>
    </div>

function generateScoutNarrative(f, divId){
  const s=f.stats, age=ageFromDob(f.dob, STATE.meta.currentDate);
  const style=FIGHT_STYLES[f.fightStyle||'technical'];
  const gen=generalScore(f);
  // Fortaleza dominante
  const statNames={striking:'pegada técnica',power:'potencia de golpeo',wrestlingOff:'wrestling ofensivo',wrestlingDef:'defensa de derribo',ground:'juego de suelo',cardio:'resistencia',chin:'mentón'};
  const sorted=Object.entries(s).sort((a,b)=>b[1]-a[1]);
  const top=sorted[0], weak=sorted[sorted.length-1];
  // Plantillas narrativas
  const ageTag=age<=22?'joven prospecto de '+age+' años':age<=26?'peleador de '+age+' años en su mejor momento':age<=30?'veterano experimentado de '+age+' años':'luchador de '+age+' años con gran experiencia';
  const levelTag=gen>=85?'de élite absoluta':gen>=78?'contendiente sólido':gen>=70?'prospecto prometedor':'debut de nivel inicial';
  const origins=[f.country,'','',''].filter(Boolean);
  const campTags=['','base de boxeo tailandés','formación en lucha olímpica','escuela de sambo','campamento de BJJ élite','formación en kickboxing K-1'].filter(Boolean);
  const campTag=f.fightStyle==='submission'?'con base de grappling':'con base de '+(f.fightStyle==='grappler'?'lucha':'striking');
  const weakTag=weak[1]<70?`, aunque su punto débil es el ${statNames[weak[0]]||weak[0]} (${weak[1]})`:'';
  return `${ageTag} procedente de ${f.country||'destino desconocido'}, ${levelTag}, ${campTag}. Destaca por su ${statNames[top[0]]||top[0]} (${top[1]})${weakTag}. Estilo: ${style?.label||f.fightStyle}. Récord: ${f.record.wins}-${f.record.losses}.`;
}

function bindScout(){
  const wcSel=document.getElementById('wcDivFilter');
  if(wcSel){ wcSel.value=UI.wcDiv||'ALL'; wcSel.onchange=()=>{UI.wcDiv=wcSel.value;render();}; }

  document.querySelectorAll('.wcMoveBtn').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const f=STATE.fighters.find(x=>x.id===btn.dataset.id);
      if(!f) return;
      const newDiv=btn.dataset.div;
      const isChamp=STATE.titles.some(t=>t.holderId===f.id||t.interimHolderId===f.id);
      if(isChamp){
        const titleName=STATE.titles.find(t=>t.holderId===f.id||t.interimHolderId===f.id)?.name||'su título';
        if(!confirm(`⚠️ ${fName(f)} es campeón de ${titleName}.\n\nSi cambia de categoría, el título quedará VACANTE.\n\n¿Confirmar cambio a ${divName(newDiv)}?`)) return;
        STATE.titles.forEach(t=>{
          if(t.holderId===f.id){
            const reign=(f.titleReigns||[]).find(r=>r.titleId===t.id&&!r.isInterim&&!r.lostDate);
            if(reign) reign.lostDate=STATE.meta.currentDate;
            t.holderId=null;
            logEvent(`🏆 ${fName(t)} queda VACANTE — ${fName(f)} cambia a ${divName(newDiv)}.`);
          }
          if(t.interimHolderId===f.id){
            const reign=(f.titleReigns||[]).find(r=>r.titleId===t.id&&r.isInterim&&!r.lostDate);
            if(reign) reign.lostDate=STATE.meta.currentDate;
            t.interimHolderId=null;
          }
        });
      }
      const oldDiv=f.division;
      f.division=newDiv;
      logEvent(`⚖️ ${fName(f)} cambia de ${divName(oldDiv)} a ${divName(newDiv)}.`);
      saveLocal(); render(); toast(`${fName(f)} → ${divName(newDiv)} ✅`);
    };
  });
  document.querySelectorAll('.signBtn').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const c=STATE.scoutCandidates.find(x=>x.id===btn.dataset.id)||STATE.fighters.find(x=>x.id===btn.dataset.id);
      if(!c) return;
      const signingCost=Math.round((10000+generalScore(c)*600)/1000)*1000;
      if((STATE.meta.budget||0)<signingCost){ toast(`❌ Presupuesto insuficiente (necesitas $${signingCost.toLocaleString()})`); return; }
      const divSel=document.querySelector(`.scoutDivSel[data-id="${btn.dataset.id}"]`);
      const divId=divSel?divSel.value:(c.division||DIVISIONS[0].id);
      c.division=divId; c.status='active'; c._scoutExpires=null;
      if(!c.contract) c.contract=makeContract(generalScore(c), c.reputation);
      STATE.meta.budget=(STATE.meta.budget||0)-signingCost;
      recordBudgetTx(-signingCost, `Fichaje de ${fName(c)} (Scouting)`);
      if(!STATE.fighters.find(x=>x.id===c.id)) STATE.fighters.push(c);
      STATE.scoutCandidates=(STATE.scoutCandidates||[]).filter(x=>x.id!==c.id);
      if(!c.debut) c.debut=STATE.meta.currentDate;
      logEvent(`✅ ${fName(c)} fichado para ${divName(divId)} — coste de fichaje $${signingCost.toLocaleString()}.`);
      // Análisis de scout narrativo
      const narrative = generateScoutNarrative(c, divId);
      logEvent(`📋 Informe de scouting: ${narrative}`);
      richToast(`📋 ${fName(c)} fichado — "${narrative.slice(0,60)}..."`, '📋', '#82b1ff', 5000, 'general');
      saveLocal(); render();
    };
  });
  document.querySelectorAll('.unretireBtn').forEach(btn=>{
    btn.onclick=e=>{
      e.stopPropagation();
      const f=STATE.fighters.find(x=>x.id===btn.dataset.id);
      if(!f) return;
      f.status='active'; f.injury={active:false,untilDate:null,note:''};
      logEvent(`🔄 ${fName(f)} vuelve de su retiro y regresa a la competición.`);
      saveLocal(); render(); toast(`${fName(f)} ha vuelto del retiro ✅`);
    };
  });
  const refreshBtn=document.getElementById('refreshScout');
  if(refreshBtn) refreshBtn.onclick=()=>{ generateScoutCandidates(); saveLocal(); render(); toast('Nuevos candidatos generados 🔍'); };
}

function tplRankEditor(){
  const scope = UI.rankEditScope || 'P4P';
  const isP4P = scope==='P4P';
  const pool = isP4P
    ? STATE.fighters.filter(f=>f.status==='active' || f.status==='injured')
    : STATE.fighters.filter(f=>f.division===scope && f.status!=='retired');
  const sorted = pool.slice().sort((a,b)=>{
    const am = isP4P? a.manualRankP4P : a.manualRankDivision;
    const bm = isP4P? b.manualRankP4P : b.manualRankDivision;
    if(am!=null && bm!=null) return am-bm;
    if(am!=null) return -1;
    if(bm!=null) return 1;
    return b.rankScore-a.rankScore;
  }).slice(0,20);

  return `
  <h3>📊 Editar rankings (manual)</h3>
  <p class="muted">Fija a mano la posición de un peleador en el P4P o en el ranking de su categoría. Deja el campo vacío para que vuelva a calcularse automáticamente.</p>
  <select id="rankEditScopeSel">
    <option value="P4P" ${isP4P?'selected':''}>Pound-for-Pound</option>
    ${DIVISIONS.map(d=>`<option value="${d.id}" ${scope===d.id?'selected':''}>${divName(d.id)}</option>`).join('')}
  </select>
  <table style="margin-top:8px"><thead><tr><th>#</th><th>Nombre</th><th>Score auto</th><th>Posición manual</th></tr></thead><tbody>
  ${sorted.map((f,i)=>{
    const manual = isP4P? f.manualRankP4P : f.manualRankDivision;
    return `<tr>
      <td>${i+1}</td>
      <td>${fName(f)}${championBadge(f.id)}</td>
      <td class="muted">${f.rankScore.toFixed(1)}</td>
      <td><input type="number" min="1" max="20" class="rankPosInput" data-fid="${f.id}" value="${manual??''}" placeholder="auto" style="width:70px;margin:0"></td>
    </tr>`;
  }).join('')}
  </tbody></table>
  <div class="row" style="margin-top:8px">
    <button class="btn primary full" id="saveRankPositions">💾 Guardar posiciones</button>
    <button class="btn danger full" id="clearRankPositions">Quitar todas las fijaciones de esta lista</button>
  </div>
  `;
}
function bindRankEditor(){
  const scopeSel = document.getElementById('rankEditScopeSel');
  if(!scopeSel) return;
  scopeSel.onchange = ()=>{ UI.rankEditScope = scopeSel.value; render(); };

  document.getElementById('saveRankPositions').onclick=()=>{
    const isP4P = (UI.rankEditScope||'P4P')==='P4P';
    document.querySelectorAll('.rankPosInput').forEach(inp=>{
      const f = STATE.fighters.find(x=>x.id===inp.dataset.fid);
      if(!f) return;
      const v = inp.value.trim();
      const pos = v===''? null : clamp(parseInt(v)||1,1,99);
      if(isP4P) f.manualRankP4P = pos; else f.manualRankDivision = pos;
    });
    refreshRankings(); saveLocal(); render(); toast('Posiciones de ranking guardadas ✅');
  };
  document.getElementById('clearRankPositions').onclick=()=>{
    const isP4P = (UI.rankEditScope||'P4P')==='P4P';
    STATE.fighters.forEach(f=>{ if(isP4P) f.manualRankP4P=null; else f.manualRankDivision=null; });
    refreshRankings(); saveLocal(); render(); toast('Fijaciones eliminadas, ranking automático restaurado');
  };
}

    stats:{power:60,striking:60,wrestlingOff:60,wrestlingDef:60,ground:60,cardio:60,chin:60},
    longevity:100, status:'active', record:{wins:0,losses:0,draws:0,nc:0,koWins:0,subWins:0,decWins:0,koLosses:0,subLosses:0,decLosses:0,ufcFights:0,ufcWins:0,ufcLosses:0,ufcKoWins:0,ufcSubWins:0,ufcDecWins:0,ufcKoLosses:0,ufcSubLosses:0,ufcDecLosses:0}, hof:false, imageUrl:''};
  const d = f||blank;
  return `
  <h3>${f?('Editando: '+f.name):'Nuevo peleador'}</h3>
  <label>Nombre</label><input id="fld_name" value="${fName(d)}">
  <label>Apodo</label><input id="fld_nick" value="${d.nickname||''}">
  <div class="row">
    <div><label>Género</label><select id="fld_gender"><option value="M" selected>M</option></select></div>
    <div><label>País</label><input id="fld_country" value="${d.country||''}"></div>
  </div>
  <div class="row">
    <div><label>Nacimiento</label><input type="date" id="fld_dob" value="${d.dob}"></div>
    <div><label>Debut</label><input type="date" id="fld_debut" value="${d.debut}"></div>
  </div>
  <label>Categoría de peso</label>
  <select id="fld_division">${DIVISIONS.map(dv=>`<option value="${dv.id}" ${d.division===dv.id?'selected':''}>${divName(dv.id)}</option>`).join('')}</select>
  <label>Estado</label>
  <select id="fld_status">
    <option value="active" ${d.status==='active'?'selected':''}>Activo</option>
    <option value="injured" ${d.status==='injured'?'selected':''}>Lesionado</option>
    <option value="suspended" ${d.status==='suspended'?'selected':''}>Sancionado</option>
    <option value="free_agent" ${d.status==='free_agent'?'selected':''}>Agente libre</option>
    <option value="retired" ${d.status==='retired'?'selected':''}>Retirado</option>
  </select>
  <div class="row">
    <div><label>Sanción hasta (si aplica)</label><input type="date" id="fld_suspUntil" value="${d.suspension?.untilDate||''}"></div>
    <div><label>Motivo de la sanción</label><input id="fld_suspNote" value="${d.suspension?.note||''}" placeholder="ej: Dopaje"></div>
  </div>
  <label>Estilo de pelea</label>
  <select id="fld_style">
    ${Object.entries(FIGHT_STYLES).map(([k,v])=>`<option value="${k}" ${(d.fightStyle||'technical')===k?'selected':''}>${v.icon} ${v.label} — ${v.desc}</option>`).join('')}
  </select>
  <label>URL de imagen del peleador</label>
  <input id="fld_image" value="${d.imageUrl||''}" placeholder="https://...">
  ${d.imageUrl? `<img src="${d.imageUrl}" class="fighterImg" style="max-width:120px;margin-top:6px" onerror="this.style.display='none'">`:''}
  <h4>Atributos</h4>
  <div class="grid2">
    ${STAT_KEYS.map(([k,label])=>`<div><label>${label}</label><input type="number" min="1" max="99" id="fld_stat_${k}" value="${d.stats[k]}"></div>`).join('')}
  </div>
  <label>Longevidad (0-100) — afecta fatiga y probabilidad de retiro</label><input type="number" min="0" max="100" id="fld_longevity" value="${d.longevity}">
  <label>Daño de chin acumulado (0-30) — cada KO recibido añade 2-4 pts; reduce chin efectivo en simulación</label><input type="number" min="0" max="30" id="fld_chinDamage" value="${d.chinDamage||0}">
  <label>Racha activa de victorias (0-10) — da bonus de +2/+4/+6 a todos los stats durante la simulación</label><input type="number" min="0" max="10" id="fld_momentum" value="${d.momentum||0}">
  <label>Reputación (0-100) — popularidad; sube con FOTN, victorias sobre rivales, KOs espectaculares</label><input type="number" min="0" max="100" id="fld_reputation" value="${d.reputation||50}">
  <h4>Récord histórico</h4>
  <label>Peleas disputadas en la UFC</label>
  <input type="number" min="0" id="fld_ufcfights" value="${d.record.ufcFights||0}">
  <div class="grid2">
    <div><label>Victorias en la UFC</label><input type="number" min="0" id="fld_ufcwins" value="${d.record.ufcWins??0}"></div>
    <div><label>Derrotas en la UFC</label><input type="number" min="0" id="fld_ufclosses" value="${d.record.ufcLosses??0}"></div>
  </div>
  <div class="grid3">
    <div><label>KO Victorias (UFC)</label><input type="number" min="0" id="fld_ufckow" value="${d.record.ufcKoWins??0}"></div>
    <div><label>SUB Victorias (UFC)</label><input type="number" min="0" id="fld_ufcsubw" value="${d.record.ufcSubWins??0}"></div>
    <div><label>DEC Victorias (UFC)</label><input type="number" min="0" id="fld_ufcdecw" value="${d.record.ufcDecWins??0}"></div>
    <div><label>KO Derrotas (UFC)</label><input type="number" min="0" id="fld_ufckol" value="${d.record.ufcKoLosses??0}"></div>
    <div><label>SUB Derrotas (UFC)</label><input type="number" min="0" id="fld_ufcsubl" value="${d.record.ufcSubLosses??0}"></div>
    <div><label>DEC Derrotas (UFC)</label><input type="number" min="0" id="fld_ufcdecl" value="${d.record.ufcDecLosses??0}"></div>
  </div>
  <p class="muted" style="margin-top:-2px">Estos campos se usan EXCLUSIVAMENTE para los rankings y las estadísticas de la liga (P4P, por categoría, GOAT y la sección Estadísticas). El récord total de abajo (incluyendo otras promotoras) se muestra siempre tal cual en el perfil, pero no se usa para valorar.</p>
  <div class="grid3">
    <div><label>Victorias</label><input type="number" id="fld_w" value="${d.record.wins}"></div>
    <div><label>Derrotas</label><input type="number" id="fld_l" value="${d.record.losses}"></div>
    <div><label>Empates</label><input type="number" id="fld_dr" value="${d.record.draws}"></div>
    <div><label>KO Victorias</label><input type="number" id="fld_kow" value="${d.record.koWins}"></div>
    <div><label>SUB Victorias</label><input type="number" id="fld_subw" value="${d.record.subWins}"></div>
    <div><label>DEC Victorias</label><input type="number" id="fld_decw" value="${d.record.decWins}"></div>
    <div><label>KO Derrotas</label><input type="number" id="fld_kol" value="${d.record.koLosses||0}"></div>
    <div><label>SUB Derrotas</label><input type="number" id="fld_subl" value="${d.record.subLosses||0}"></div>
    <div><label>DEC Derrotas</label><input type="number" id="fld_decl" value="${d.record.decLosses||0}"></div>
  </div>
  <p class="muted">Atributo General (calculado automáticamente, media de los 7 atributos): <b>${f? generalScore(f) : '—'}</b></p>
  <label style="display:flex;align-items:center;gap:6px;margin-top:8px"><input type="checkbox" id="fld_hof" style="width:auto" ${d.hof?'checked':''}> Miembro del Hall of Fame</label>
  <div class="row" style="margin-top:8px">
    <button class="btn primary full" id="saveFighterBtn">${f?'Guardar cambios':'Crear peleador'}</button>
    ${f?'<button class="btn danger full" id="deleteFighterBtn">Eliminar peleador</button>':''}
  </div>
  `;
}

function bindEditor(){
  document.getElementById('editFighterSel').onchange=e=>{ UI.selectedFighter=e.target.value||null; render(); };
  bindRankEditor();

  // Guardar datos básicos del peleador
  document.getElementById('saveFighterBtn').onclick=()=>{
    const get=id=>document.getElementById(id).value;
    const stats={}; STAT_KEYS.forEach(([k])=> stats[k]=clamp(parseInt(document.getElementById('fld_stat_'+k).value)||50,1,99));
    let f = UI.selectedFighter? STATE.fighters.find(x=>x.id===UI.selectedFighter): null;
    if(!f){ f = {id:uid('F'), fightHistory:[], titleReigns:[], bonuses:{fightOfNight:0,performanceOfNight:0}, injury:{active:false,untilDate:null,note:''}, lastEventSeq:null, rankScore:0}; STATE.fighters.push(f); }
    f.name=get('fld_name'); f.nickname=get('fld_nick')||null; f.gender=get('fld_gender'); f.country=get('fld_country');
    f.dob=get('fld_dob'); f.debut=get('fld_debut'); f.division=get('fld_division'); f.status=get('fld_status');
    if(f.status==='suspended'){
      if(!f.suspension) f.suspension={active:true,history:[]};
      f.suspension.active=true;
      f.suspension.untilDate=get('fld_suspUntil')||null;
      f.suspension.note=get('fld_suspNote')||'Sanción';
    } else if(f.suspension){
      f.suspension.active=false;
    }
    f.imageUrl = get('fld_image').trim()||null;
    f.fightStyle = get('fld_style')||'technical';
    f.stats=stats; f.longevity=clamp(parseInt(get('fld_longevity'))||0,0,100);
    f.chinDamage=clamp(parseInt(get('fld_chinDamage'))||0,0,30);
    f.momentum=clamp(parseInt(get('fld_momentum'))||0,0,10);
    f.reputation=clamp(parseInt(get('fld_reputation'))||50,0,100);
    f.record = {
      wins: parseInt(get('fld_w'))||0, losses: parseInt(get('fld_l'))||0, draws: parseInt(get('fld_dr'))||0, nc: f.record?f.record.nc:0,
      koWins: parseInt(get('fld_kow'))||0, subWins: parseInt(get('fld_subw'))||0, decWins: parseInt(get('fld_decw'))||0,
      koLosses: parseInt(get('fld_kol'))||0, subLosses: parseInt(get('fld_subl'))||0, decLosses: parseInt(get('fld_decl'))||0,
      ufcFights: parseInt(get('fld_ufcfights'))||0,
      ufcWins: parseInt(get('fld_ufcwins'))||0,
      ufcLosses: parseInt(get('fld_ufclosses'))||0,
      ufcKoWins: parseInt(get('fld_ufckow'))||0,
      ufcSubWins: parseInt(get('fld_ufcsubw'))||0,
      ufcDecWins: parseInt(get('fld_ufcdecw'))||0,
      ufcKoLosses: parseInt(get('fld_ufckol'))||0,
      ufcSubLosses: parseInt(get('fld_ufcsubl'))||0,
      ufcDecLosses: parseInt(get('fld_ufcdecl'))||0
    };
    f.hof = document.getElementById('fld_hof').checked;
    if(f.status==='injured' && !f.injury.active){ f.injury={active:true, untilDate:addDays(STATE.meta.currentDate,60), note:'Editado manualmente'}; }
    if(f.status!=='injured'){ f.injury.active=false; }
    refreshRankings(); saveLocal(); UI.selectedFighter=f.id; render(); toast('Peleador guardado ✅');
  };

  const delBtn=document.getElementById('deleteFighterBtn');
  if(delBtn) delBtn.onclick=()=>{
    if(!confirm('¿Eliminar este peleador definitivamente?')) return;
    STATE.fighters = STATE.fighters.filter(x=>x.id!==UI.selectedFighter);
    UI.selectedFighter=null; saveLocal(); render(); toast('Peleador eliminado');
  };

  // Guardar bonos
  const saveBonusesBtn = document.getElementById('saveBonusesBtn');
  if(saveBonusesBtn) saveBonusesBtn.onclick=()=>{
    const f = STATE.fighters.find(x=>x.id===UI.selectedFighter); if(!f) return;
    f.bonuses.fightOfNight = parseInt(document.getElementById('fld_fotn').value)||0;
    f.bonuses.performanceOfNight = parseInt(document.getElementById('fld_potn').value)||0;
    if(!STATE.atpPoints) STATE.atpPoints={};
    STATE.atpPoints[f.id] = Math.max(0,parseInt(document.getElementById('fld_atpPoints').value)||0);
    saveLocal(); toast('Bonos guardados ✅');
  };

  // Reinados: guardar individual
  document.querySelectorAll('[data-savereign]').forEach(btn=>{
    btn.onclick=()=>{
      const f = STATE.fighters.find(x=>x.id===UI.selectedFighter); if(!f) return;
      const idx = parseInt(btn.dataset.savereign);
      const r = f.titleReigns[idx]; if(!r) return;
      r.wonDate = document.getElementById(`reign_won_${idx}`).value || r.wonDate;
      r.lostDate = document.getElementById(`reign_lost_${idx}`).value || null;
      r.defenses = parseInt(document.getElementById(`reign_def_${idx}`).value)||0;
      r.isInterim = document.getElementById(`reign_interim_${idx}`).value==='1';
      // Sincronizar titular del cinturón: si lostDate es null, este peleador es el campeón actual
      syncTitleHolder(f, r);
      rebuildTitleHistory(r.titleId);
      saveLocal(); render(); toast('Reinado guardado ✅');
    };
  });

  // Reinados: eliminar
  document.querySelectorAll('[data-delreign]').forEach(btn=>{
    btn.onclick=()=>{
      const f = STATE.fighters.find(x=>x.id===UI.selectedFighter); if(!f) return;
      const idx = parseInt(btn.dataset.delreign);
      const r = f.titleReigns[idx];
      let affectedTitleId = r? r.titleId : null;
      if(r){
        // Si era el campeón vigente, vacar el cinturón
        const title = STATE.titles.find(t=>t.id===r.titleId);
        if(title && title.holderId===f.id && !r.lostDate){ title.holderId=null; title.isInterim=false; }
      }
      f.titleReigns.splice(idx,1);
      if(affectedTitleId) rebuildTitleHistory(affectedTitleId);
      saveLocal(); render(); toast('Reinado eliminado');
    };
  });

  // Reinados: añadir nuevo
  const addReignBtn = document.getElementById('addReignBtn');
  if(addReignBtn) addReignBtn.onclick=()=>{
    const f = STATE.fighters.find(x=>x.id===UI.selectedFighter); if(!f) return;
    const titleId = document.getElementById('newReign_title').value;
    const wonDate = document.getElementById('newReign_won').value || STATE.meta.currentDate;
    const lostDate = document.getElementById('newReign_lost').value || null;
    const defenses = parseInt(document.getElementById('newReign_def').value)||0;
    const isInterim = document.getElementById('newReign_interim').value==='1';
    if(!titleId) return toast('Selecciona un título');
    const newReign = {titleId, wonDate, lostDate, defenses, isInterim};
    f.titleReigns = f.titleReigns||[];
    f.titleReigns.push(newReign);
    syncTitleHolder(f, newReign);
    rebuildTitleHistory(titleId);
    saveLocal(); render(); toast('Reinado añadido ✅');
  };

  // Gestión directa de titulares
  document.querySelectorAll('[data-setrec]').forEach(btn=>{
    btn.onclick=()=>{
      const key = btn.dataset.setrec;
      const fid = document.getElementById(`rec_fighter_${key}`).value;
      const timeStr = document.getElementById(`rec_time_${key}`).value.trim(); // e.g. "R1 0:15"
      if(!fid || !timeStr) return toast('Selecciona peleador y tiempo');
      const m = timeStr.match(/R(\d)\s*(\d+):(\d+)/);
      if(!m) return toast('Formato: R1 0:15');
      const round=parseInt(m[1]), mins=parseInt(m[2]), secs=parseInt(m[3]);
      const totalSecs = (round-1)*300 + mins*60 + secs;
      STATE.records = STATE.records||{};
      STATE.records[key] = {fighterId:fid, secs:totalSecs, round, time:`${mins}:${String(secs).padStart(2,'0')}`, opponentId:null, date:STATE.meta.currentDate};
      saveLocal(); render(); toast(`Récord ${key} guardado ✅`);
    };
  });

  document.querySelectorAll('[data-settitle]').forEach(btn=>{
    btn.onclick=()=>{
      const titleId = btn.dataset.settitle;
      const title = STATE.titles.find(t=>t.id===titleId); if(!title) return;
      const newHolderId = document.getElementById(`titleHolder_${titleId}`).value||null;
      const newInterim = document.getElementById(`titleInterim_${titleId}`).checked;
      // Cerrar reinado del campeón anterior si existe
      if(title.holderId && title.holderId!==newHolderId){
        const prev = STATE.fighters.find(x=>x.id===title.holderId);
        if(prev){ const r=(prev.titleReigns||[]).find(rr=>rr.titleId===titleId&&!rr.lostDate); if(r) r.lostDate=STATE.meta.currentDate; }
      }
      title.holderId = newHolderId;
      title.isInterim = newInterim;
      // Si hay nuevo campeón, abrir o añadir un reinado sin fecha de pérdida
      let nf = null;
      if(newHolderId){
        nf = STATE.fighters.find(x=>x.id===newHolderId);
        if(nf){
          const existing = (nf.titleReigns||[]).find(r=>r.titleId===titleId&&!r.lostDate);
          if(!existing){
            nf.titleReigns = nf.titleReigns||[];
            const wonDate = STATE.meta.currentDate;
            nf.titleReigns.push({titleId, wonDate, lostDate:null, defenses:0, isInterim:newInterim});
          } else {
            existing.isInterim = newInterim;
          }
        }
        logEvent(`🏆 ${nf?nf.name:'?'} asignado como ${newInterim?'campeón interino':'campeón'} de ${fName(title)} (Editor).`);
      } else {
        logEvent(`⚠️ ${fName(title)} vacado desde el Editor.`);
      }
      rebuildTitleHistory(titleId);
      saveLocal(); render(); toast('Titular actualizado ✅');
    };
  });
  document.querySelectorAll('.titleRenameBtn').forEach(btn=>{
    btn.onclick=()=>{
      const title=STATE.titles.find(t=>t.id===btn.dataset.id); if(!title) return;
      const newName=document.querySelector(`.titleNameFld[data-id="${btn.dataset.id}"]`).value.trim();
      if(!newName) return toast('El nombre no puede estar vacío','⚠️');
      title.name=newName;
      saveLocal(); render(); toast('Título renombrado ✅');
    };
  });
  document.querySelectorAll('.titleDeleteBtn').forEach(btn=>{
    btn.onclick=()=>{
      const title=STATE.titles.find(t=>t.id===btn.dataset.id); if(!title) return;
      if(!confirm(`¿Eliminar "${fName(title)}" definitivamente?\n\nSe borrará también su historial de reinados. Esta acción no se puede deshacer.`)) return;
      STATE.titles=STATE.titles.filter(t=>t.id!==title.id);
      STATE.fighters.forEach(f=>{ f.titleReigns=(f.titleReigns||[]).filter(r=>r.titleId!==title.id); });
      saveLocal(); render(); toast('Título eliminado');
    };
  });

  document.getElementById('delEventBtn').onclick=()=>{
    const id=document.getElementById('delEventSel').value; if(!id) return;
    const ev=STATE.events.find(x=>x.id===id); if(!ev) return;
    const isPending = ev.status!=='completed';
    const msg = isPending
      ? `¿Eliminar el evento "${fName(ev)}"? (no tiene resultados, se borrará sin efectos)`
      : `⚠️ ¿Eliminar "${fName(ev)}" y REVERTIR todos sus resultados?\n\nEsto deshará: victorias, derrotas, KOs, sumisiones, cambios de título, bonos FOTN/POTN.\nEsta acción no se puede deshacer.`;
    if(!confirm(msg)) return;
    if(ev.status==='completed') revertEvent(ev);
    STATE.events = STATE.events.filter(x=>x.id!==id);
    refreshRankings(); saveLocal(); render(); toast('Evento eliminado');
  };
  document.getElementById('applyJson').onclick=()=>{
    try{
      const parsed = JSON.parse(document.getElementById('rawJson').value);
      STATE = parsed; saveLocal(); render(); toast('Estado aplicado desde JSON');
    }catch(e){ toast('JSON inválido: '+e.message, 4000); }
  };
  document.getElementById('refreshJson').onclick=()=> render();

  // ── Awards editor bindings ──────────────────────────────────────────────
  // Save award changes
  document.querySelectorAll('.awardSaveBtn').forEach(btn=>{
    btn.onclick=()=>{
      const year=parseInt(btn.dataset.year);
      const a=STATE.awards.find(x=>x.year===year); if(!a) return;
      // Read all selects for this year
      document.querySelectorAll(`.awardSel[data-year="${year}"]`).forEach(sel=>{
        const field=sel.dataset.field, val=sel.value||null;
        if(field==='fighterOfYear') a.fighterOfYear=val;
        else if(field==='koOfYear_fA') a.koOfYear=val?{fA:val,...(a.koOfYear||{})}:null;
        else if(field==='subOfYear_fA') a.subOfYear=val?{fA:val,...(a.subOfYear||{})}:null;
        else if(field==='performanceOfYear_fA') a.performanceOfYear=val?{fA:val,...(a.performanceOfYear||{})}:null;
      });
      saveLocal(); render(); toast('Premios '+year+' actualizados ✅');
    };
  });

  // Delete award year
  document.querySelectorAll('[data-delaward]').forEach(btn=>{
    btn.onclick=()=>{
      const idx=parseInt(btn.dataset.delaward);
      if(!confirm('¿Eliminar premios de este año?')) return;
      STATE.awards.splice(idx,1);
      saveLocal(); render(); toast('Año de premios eliminado');
    };
  });

  // Add new award year
  const addAwardYearBtn=document.getElementById('addAwardYearBtn');
  if(addAwardYearBtn) addAwardYearBtn.onclick=()=>{
    const yr=parseInt(document.getElementById('newAwardYear').value);
    if(!yr||yr<2020||yr>2099){toast('Año inválido','⚠️');return;}
    if((STATE.awards||[]).some(a=>a.year===yr)){toast('Ese año ya existe','⚠️');return;}
    if(!STATE.awards) STATE.awards=[];
    STATE.awards.push({year:yr,fighterOfYear:null,koOfYear:null,subOfYear:null,performanceOfYear:null,fightOfYear:null});
    STATE.awards.sort((a,b)=>a.year-b.year);
    saveLocal(); render(); toast('Año '+yr+' añadido ✅');
  };

  // Guardar contrato del peleador seleccionado
  const saveContractBtn = document.getElementById('saveContractBtn');
  if(saveContractBtn) saveContractBtn.onclick=()=>{
    const f = STATE.fighters.find(x=>x.id===UI.selectedFighter); if(!f) return;
    if(!f.contract) f.contract = makeContract(generalScore(f), f.reputation);
    f.contract.salary = parseInt(document.getElementById('fld_salary').value)||0;
    f.contract.finishBonus = parseInt(document.getElementById('fld_finishBonus').value)||0;
    f.contract.fightsLeft = clamp(parseInt(document.getElementById('fld_fightsLeft').value)||0,0,20);
    f.contract.demandLevel = clamp(parseInt(document.getElementById('fld_demandLevel').value)||0,0,100);
    f.contract.loyalty = clamp(parseInt(document.getElementById('fld_loyalty').value)||0,0,100);
    saveLocal(); toast('Contrato guardado ✅');
  };

  // Guardar / quitar patrocinador
  const saveSponsorBtn = document.getElementById('saveSponsorBtn');
  if(saveSponsorBtn) saveSponsorBtn.onclick=()=>{
    const f = STATE.fighters.find(x=>x.id===UI.selectedFighter); if(!f) return;
    const name = document.getElementById('fld_sponsorName').value.trim();
    const income = parseInt(document.getElementById('fld_sponsorIncome').value)||0;
    if(!name){ toast('Ponle un nombre al patrocinador','⚠️'); return; }
    f.sponsor = {name, incomePerFight: Math.max(0,income)};
    saveLocal(); render(); toast('Patrocinador guardado ✅');
  };
  const removeSponsorBtn = document.getElementById('removeSponsorBtn');
  if(removeSponsorBtn) removeSponsorBtn.onclick=()=>{
    const f = STATE.fighters.find(x=>x.id===UI.selectedFighter); if(!f) return;
    f.sponsor = null;
    saveLocal(); render(); toast('Patrocinador eliminado');
  };

  // Guardar presupuesto
  const saveBudgetBtn = document.getElementById('saveBudgetBtn');
  if(saveBudgetBtn) saveBudgetBtn.onclick=()=>{

      const pool=fighters.filter(x=>x.division===d.id);
      const champ = pool.length? pick(pool): null;
      return {divisionId:d.id, holderId:champ?champ.id:null, holderName:champ?champ.name:null};
    });
    const newRivalPrestige = randi(25,55);
    STATE.rivalPromotions.push({id:uid('RP'), name, short:short||name.slice(0,3).toUpperCase(), prestige:newRivalPrestige, prestigeBaseline:newRivalPrestige, budget:randi(1,4)*1000000, fighters, titles, recentEvents:[], eventSeq:1});

    rp.fighters.push(f);

  const pullFromRivalSel = document.getElementById('pullFromRivalSel');

    if(isChamp){ const t=rp.titles.find(x=>x.holderId===fid); if(t){ t.holderId=null; t.holderName=null; } }

  };

  const editRivalPromoSel = document.getElementById('editRivalPromoSel');

    UI.editorRivalPromoId = editRivalPromoSel.value; UI.editorRivalFighterId = null; render();

  };

  document.querySelectorAll('.clauseDeleteBtn').forEach(btn=>{

// Sincroniza el titular de un cinturón cuando se edita un reinado
function syncTitleHolder(fighter, reign){
  const title = STATE.titles.find(t=>t.id===reign.titleId); if(!title) return;
  if(!reign.lostDate){
    if(reign.isInterim){
      // Reinado interino activo → asignar interimHolderId (no tocar holderId)
      title.interimHolderId = fighter.id;
    } else {
      // Reinado principal activo → cerrar reinado anterior si era otro
      if(title.holderId && title.holderId!==fighter.id){
        const prev = STATE.fighters.find(x=>x.id===title.holderId);
        if(prev){ const r=(prev.titleReigns||[]).find(rr=>rr.titleId===reign.titleId&&!rr.isInterim&&!rr.lostDate); if(r) r.lostDate=STATE.meta.currentDate; }
      }
      title.holderId = fighter.id;
    }
  } else {
    // Reinado cerrado
    if(!reign.isInterim && title.holderId===fighter.id) title.holderId=null;
    if(reign.isInterim && title.interimHolderId===fighter.id) title.interimHolderId=null;
  }
}

function rebuildTitleHistory(titleId){
  const title = STATE.titles.find(t=>t.id===titleId); if(!title) return;
  const entries = [];
  let activeHolder = null, activeInterim = null;
  STATE.fighters.forEach(f=>{
    (f.titleReigns||[]).filter(r=>r.titleId===titleId).forEach(r=>{
      entries.push({fighterId:f.id, wonEventId:null, wonDate:r.wonDate, isInterim:r.isInterim||false});
      if(!r.lostDate){ if(r.isInterim) activeInterim=f.id; else activeHolder=f.id; }
    });
  });
  entries.sort((a,b)=> new Date(a.wonDate)-new Date(b.wonDate));
  title.history = entries;
  title.holderId = activeHolder;
  title.interimHolderId = activeInterim;
  const div = STATE.divisions.find(d=>d.id===title.divisionId);
  if(div) div.championId = activeHolder;
}
