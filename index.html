/* ====================== NEGOCIACIÓN DE CONTRATOS ====================== */
function openContractNegotiation(fighterId){
  const f = STATE.fighters.find(x=>x.id===fighterId);
  if(!f) return;
  if(!f.contract) f.contract = makeContract(generalScore(f), f.reputation);
  const pending = (STATE.pendingNegotiations||[]).find(n=>n.fighterId===fighterId);
  const rivalOffer = pending?.rivalOfferSalary || null;
  const maxRounds = 3;
  let round = 1;
  let rejectedOffer = null;
  let offer = { salary: f.contract.salary, finishBonus: f.contract.finishBonus, fightsLeft: 3 };

  function desiredSalary(){
    const rep=f.reputation||50, mom=f.momentum||0;
    // Misma curva de estrellato que makeContract(), pero un peleador que ya ha demostrado su
    // valor en la UFC pide algo más que un fichaje nuevo, y una racha caliente sube la exigencia.
    const power = starPower(generalScore(f), rep);
    let base = starPayCurve(power)*1.15;
    base *= (1 + mom*0.06);
    base *= (1 + (f.contract.demandLevel||50)/250);
    if(rivalOffer) base = Math.max(base, rivalOffer.amount*1.05);
    return Math.round(base/500)*500;
  }
  // El mínimo real que aceptará — SIEMPRE es el mismo número que se le enseña al jugador
  // (nunca una cifra intermedia inventada), para que igualar lo que "pide" cierre el trato
  // de verdad, la primera vez, sin sorpresas.
  function minAcceptable(){
    const desired = desiredSalary();
    return Math.round((desired*(1-(f.contract.loyalty||50)/500))/500)*500;
  }

  function resolveFighterLeaves(){
    STATE.pendingNegotiations = (STATE.pendingNegotiations||[]).filter(n=>n.fighterId!==fighterId);
    if(rivalOffer){
      const rp = STATE.rivalPromotions.find(x=>x.id===rivalOffer.promoId);
      STATE.fighters = STATE.fighters.filter(x=>x.id!==fighterId);
      // Se conserva el objeto completo (foto, títulos, historial, contrato...) en vez de recortarlo
      // a un peleador rival "genérico" — así, si se recupera más adelante, vuelve intacto.
      if(rp) rp.fighters.push(f);
      logEvent(`💸 ${fName(f)} ficha por ${rivalOffer.promoName} tras no llegar a un acuerdo.`);
      richToast(`${fName(f)} se marcha a ${rivalOffer.promoName}`,'💸','#ef5350',5000);
    } else {
      f.status='free_agent';
      logEvent(`📄 ${fName(f)} queda como agente libre tras no renovar contrato.`);
      richToast(`${fName(f)} queda libre — puedes re-ficharlo en Scouting`,'📄','#ffb74d',5000);
    }
    saveLocal(); closeModal(); render();
  }

  function renderNegotiation(){
    const threshold = minAcceptable();
    document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <div class="section-title"><h3>💼 Negociación — ${fName(f)}</h3><button class="btn small closebtn" id="negClose">✕</button></div>
        <p class="muted" style="font-size:.78rem">Ronda ${round}/${maxRounds} · Reputación ${f.reputation||50} · Racha ${f.momentum||0} · Exigencia ${f.contract.demandLevel}/100 · Lealtad ${f.contract.loyalty}/100</p>
        ${rivalOffer?`<div class="fightcard-item" style="border-color:#ef5350"><b style="color:#ef5350">⚠️ ${rivalOffer.promoName}</b> le ha ofrecido <b>$${rivalOffer.amount.toLocaleString()}</b> por pelea.</div>`:''}
        <div class="fightcard-item">${fName(f)} firma con una bolsa mínima de <b>$${threshold.toLocaleString()}</b> por pelea. Iguala o supera esa cifra y firma seguro.</div>
        ${rejectedOffer!=null?`<p style="color:#ef5350;font-size:.78rem;margin:4px 0">Tu oferta anterior de $${rejectedOffer.toLocaleString()} se quedó corta.</p>`:''}
        <label>Tu oferta — bolsa por pelea ($)</label>
        <input type="number" step="1000" id="negSalary" value="${offer.salary}">
        <label>Bonus por finalización ($)</label>
        <input type="number" step="1000" id="negBonus" value="${offer.finishBonus}">
        <label>Duración del contrato (peleas)</label>
        <input type="number" min="1" max="10" id="negLength" value="${offer.fightsLeft}">
        <div class="row" style="margin-top:10px">
          <button class="btn primary full" id="negSubmit">📨 Presentar oferta</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button class="btn danger full" id="negWalk">🚪 Dejarlo ir</button>
        </div>
      </div>
    </div>`;
    document.getElementById('negClose').onclick=closeModal;
    document.getElementById('negWalk').onclick=()=>{
      if(!confirm(`¿Dejar salir a ${fName(f)}?`)) return;
      resolveFighterLeaves();
    };
    document.getElementById('negSubmit').onclick=()=>{
      offer.salary = parseInt(document.getElementById('negSalary').value)||0;
      offer.finishBonus = parseInt(document.getElementById('negBonus').value)||0;
      offer.fightsLeft = clamp(parseInt(document.getElementById('negLength').value)||1,1,10);

      if(offer.salary >= threshold){
        if(!f.contractHistory) f.contractHistory=[];
        f.contractHistory.push({salary:f.contract.salary, finishBonus:f.contract.finishBonus, fightsLeft:f.contract.fightsLeft, signedDate:f.contract.signedDate||null, endedDate:STATE.meta.currentDate});
        f.contract.salary = offer.salary;
        f.contract.finishBonus = offer.finishBonus;
        f.contract.fightsLeft = offer.fightsLeft;
        f.contract.signedDate = STATE.meta.currentDate;
        STATE.pendingNegotiations = (STATE.pendingNegotiations||[]).filter(n=>n.fighterId!==fighterId);
        logEvent(`✍️ ${fName(f)} renueva contrato: $${offer.salary.toLocaleString()}/pelea x ${offer.fightsLeft}.`);
        richToast(`${fName(f)} firma la renovación ✅`,'✍️','#69f0ae',4000);
        saveLocal(); closeModal(); render();
        return;
      }
      if(round>=maxRounds){ resolveFighterLeaves(); return; }
      rejectedOffer = offer.salary;
      round++;
      renderNegotiation();
    };
  }
  renderNegotiation();
}

function openLiveFightViewer(ev){
  if(ev.status==='completed') return toast('Este evento ya está completado');
  const results = [...ev.card].reverse().map(fight=>{
    const fA=STATE.fighters.find(x=>x.id===fight.fighterA);
    const fB=STATE.fighters.find(x=>x.id===fight.fighterB);
    if(!fA||!fB) return null;
    const isTitle = !!fight.titleId;
    // Peso y racha: el visor en vivo usaba las stats "en crudo" y nunca comprobaba el peso —
    // ahora se comporta igual que "Simular rápido" (mismo bonus de racha/corte de peso).
    const missedId = checkMissWeight(fight);
    const fAm=momentumBonus(fA)+weightCutBonus(fight,fA.id,missedId), fBm=momentumBonus(fB)+weightCutBonus(fight,fB.id,missedId);
    const fAb=fAm?{...fA,stats:{...fA.stats,...Object.fromEntries(Object.entries(fA.stats).map(([k,v])=>[k,Math.min(99,v+fAm)]))}}:fA;
    const fBb=fBm?{...fB,stats:{...fB.stats,...Object.fromEntries(Object.entries(fB.stats).map(([k,v])=>[k,Math.min(99,v+fBm)]))}}:fB;
    const r = simulateFight(fAb, fBb, {rounds:isTitle?5:3});
    return {fight, fA, fB, result:r, narrative: generateFightNarrative(fA,fB,r), missedId};
  }).filter(Boolean);

  let fightIdx = 0; // 0 = first prelim (card reversed), last index = main event
  let phase = 'prefight';
  let roundIdx = 0;
  // Ticker en vivo asalto a asalto (punto 3): reproduce las acciones reales que
  // ya calcula _simRound (rd.actions) en vez de saltar directo al resumen del asalto.
  let tickerMode = 'ticker'; // 'ticker' = reproduciendo golpe a golpe · 'summary' = resumen del asalto
  let tickerIdx = 0;
  let tickerPlaying = true;
  let tickerSpeedIdx = 1; // 0=Lento 1=Normal 2=Rápido
  let tickerTimer = null;
  const totalFights = results.length;
  function clearTicker(){ if(tickerTimer){ clearTimeout(tickerTimer); tickerTimer=null; } }

  // Salud inicial de un peleador al comienzo del combate (misma fórmula que simulateFight)
  function fvInitialHealth(f){
    const careerDmg=(f.chinDamage||0)*4;
    return {head:Math.max(40,100-careerDmg), body:100, legs:100};
  }
  // Salud con la que arranca un asalto: la de cierre del asalto anterior, o la inicial en R1
  function fvRoundStartHealth(fi, ri){
    const {fA, fB, result} = results[fi];
    const prev = (result.roundDetails||[])[ri-1];
    return {
      hA: prev ? {...prev.hA} : fvInitialHealth(fA),
      hB: prev ? {...prev.hB} : fvInitialHealth(fB),
    };
  }
  // Reproduce las acciones de un asalto hasta el índice `uptoIdx` (incluido) y devuelve
  // las stats y la salud acumuladas hasta ese punto — misma aritmética que usa _simRound/simulateFight,
  // solo que aplicada acción a acción en vez de todas juntas al final del asalto.
  function fvReplayRound(fi, ri, uptoIdx){
    const {result} = results[fi];
    const rd = (result.roundDetails||[])[ri];
    const acts = (rd?.actions||[]).slice(0, uptoIdx+1);
    const {hA:startHA, hB:startHB} = fvRoundStartHealth(fi, ri);
    let hA={...startHA}, hB={...startHB};
    const stA=_emptyStats(), stB=_emptyStats();
    acts.forEach(act=>{
      if(act.sigA){stA.sigL+=act.sigA;stA.sigA+=act.sigA;}
      if(act.missA) stA.sigA+=act.missA;
      if(act.tdAttA) stA.tdAtt++; if(act.tdLandedA) stA.tdL++;
      if(act.subAttA) stA.subAtt++; if(act.kdB) stA.kd++;
      if(act.ctrlA) stA.ctrl+=act.ctrlA;
      if(act.sigB){stB.sigL+=act.sigB;stB.sigA+=act.sigB;}
      if(act.missB) stB.sigA+=act.missB;
      if(act.tdAttB) stB.tdAtt++; if(act.tdLandedB) stB.tdL++;
      if(act.subAttB) stB.subAtt++; if(act.kdA) stB.kd++;
      if(act.ctrlB) stB.ctrl+=act.ctrlB;
      if(act.dB>0){ const z=act.zoneA||'head'; const f=z==='legs'?1.5:z==='body'?1.08:0.35; hB[z]=Math.max(0,hB[z]-act.dB*f); }
      if(act.dA>0){ const z=act.zoneB||'head'; const f=z==='legs'?1.5:z==='body'?1.08:0.35; hA[z]=Math.max(0,hA[z]-act.dA*f); }
    });
    return {statsA:stA, statsB:stB, hA, hB};
  }
  // Stats/salud acumuladas de todo el combate hasta la acción `tickerIdx` del asalto `ri`
  // (rondas anteriores completas + reproducción parcial de la ronda actual)
  function fvCumulative(fi, ri, uptoIdx){
    const {result} = results[fi];
    const rds=result.roundDetails||[];
    const cumA=_emptyStats(), cumB=_emptyStats();
    for(let k=0;k<ri;k++){
      const rd=rds[k]; if(!rd) continue;
      ['sigL','tdL','subAtt','kd','ctrl'].forEach(key=>{ cumA[key]+=(rd.statsA?.[key]||0); cumB[key]+=(rd.statsB?.[key]||0); });
    }
    const partial=fvReplayRound(fi, ri, uptoIdx);
    ['sigL','tdL','subAtt','kd','ctrl'].forEach(key=>{ cumA[key]+=partial.statsA[key]; cumB[key]+=partial.statsB[key]; });
    return {cumA, cumB, hA:partial.hA, hB:partial.hB};
  }
  // Panel compartido de stats acumuladas + salud por zona — usado tanto por el ticker en vivo
  // como por el resumen del asalto, para no duplicar el marcado dos veces.
  function fvStatPanel(cumA, cumB, hA, hB, fA, fB){
    const hBar=(v,col)=>`<div style="height:5px;border-radius:2px;background:var(--bg);overflow:hidden"><div style="width:${Math.round(v)}%;height:100%;background:${col};transition:width .3s"></div></div>`;
    const totActA = cumA.sigL + cumA.kd*6 + cumA.tdL*4 + cumA.subAtt*2;
    const totActB = cumB.sigL + cumB.kd*6 + cumB.tdL*4 + cumB.subAtt*2;
    const totAct = totActA+totActB||1;
    const pActA = Math.round(totActA/totAct*100);
    const grappA = cumA.tdL*5 + cumA.subAtt*2 + Math.round(cumA.ctrl/20);
    const grappB = cumB.tdL*5 + cumB.subAtt*2 + Math.round(cumB.ctrl/20);
    const hasGrappling = grappA+grappB>0;
    const pGrappA = Math.round(grappA/(grappA+grappB||1)*100);
    return `<div class="fv-panel">
      <div style="display:grid;grid-template-columns:1fr 76px 1fr;gap:3px;align-items:center;margin-bottom:8px">
        <div style="color:var(--red);font-weight:700;text-align:right">${cumA.sigL}</div>
        <div style="text-align:center;color:var(--txt3);font-size:.62rem">Sig. Strikes</div>
        <div style="color:var(--blue);font-weight:700">${cumB.sigL}</div>
        <div style="color:var(--red);font-weight:700;text-align:right">${cumA.tdL}</div>
        <div style="text-align:center;color:var(--txt3);font-size:.62rem">Derribos</div>
        <div style="color:var(--blue);font-weight:700">${cumB.tdL}</div>
        <div style="color:var(--red);font-weight:700;text-align:right">${cumA.subAtt}</div>
        <div style="text-align:center;color:var(--txt3);font-size:.62rem">Sub att.</div>
        <div style="color:var(--blue);font-weight:700">${cumB.subAtt}</div>
        <div style="color:var(--red);font-weight:700;text-align:right">${cumA.kd}</div>
        <div style="text-align:center;color:var(--txt3);font-size:.62rem">KDs</div>
        <div style="color:var(--blue);font-weight:700">${cumB.kd}</div>
      </div>
      <div style="margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
          <span style="font-size:.55rem;color:var(--red)">${cumA.sigL}sig ${cumA.kd>0?cumA.kd+'KD ':''}</span>
          <span style="font-size:.54rem;color:var(--txt3)">Actividad</span>
          <span style="font-size:.55rem;color:var(--blue)">${cumB.sigL}sig ${cumB.kd>0?cumB.kd+'KD ':''}</span>
        </div>
        <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;margin-bottom:${hasGrappling?'6':'0'}px">
          <div style="width:${pActA}%;background:var(--red);transition:width .3s"></div>
          <div style="width:${100-pActA}%;background:var(--blue);transition:width .3s"></div>
        </div>
        ${hasGrappling?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
          <span style="font-size:.55rem;color:#e57373">${cumA.tdL}TD ${cumA.ctrl>0?Math.round(cumA.ctrl/60*10)/10+'min ':''}</span>
          <span style="font-size:.54rem;color:var(--txt3)">Grappling</span>
          <span style="font-size:.55rem;color:#82b1ff">${cumB.tdL}TD ${cumB.ctrl>0?Math.round(cumB.ctrl/60*10)/10+'min ':''}</span>
        </div>
        <div style="display:flex;height:5px;border-radius:3px;overflow:hidden">
          <div style="width:${pGrappA}%;background:#e57373;transition:width .3s"></div>
          <div style="width:${100-pGrappA}%;background:#82b1ff;transition:width .3s"></div>
        </div>`:''}
      </div>
      <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:4px;font-size:.62rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">
        <span>${fA.name.split(' ').pop()}</span><span>Salud corporal</span><span style="text-align:right">${fB.name.split(' ').pop()}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 50px 1fr;gap:3px;align-items:center">
        ${hBar(hA.head,'var(--ko)')}<div style="text-align:center;color:var(--txt3);font-size:.6rem">Cabeza</div>${hBar(hB.head,'var(--ko)')}
        ${hBar(hA.body,'#ff9800')}<div style="text-align:center;color:var(--txt3);font-size:.6rem">Cuerpo</div>${hBar(hB.body,'#ff9800')}
        ${hBar(hA.legs,'var(--green)')}<div style="text-align:center;color:var(--txt3);font-size:.6rem">Piernas</div>${hBar(hB.legs,'var(--green)')}
      </div>
    </div>`;
  }
  const FV_POS_LABEL={standing:'🥊 De pie', clinch:'🤼 Clinch', ground_A_top:'🔒 Suelo', ground_B_top:'🔒 Suelo', back_A:'🔒 Espalda', back_B:'🔒 Espalda'};
  const FV_SPEEDS=[1700,1000,550];
  const FV_SPEED_LABELS=['Lento','Normal','Rápido'];
  // Ring visual (prototipo "nivel 1"): representación esquemática, no física — dos fichas
  // posicionadas según la posición del combate y animadas según los campos reales de `act`.
  const FV_POS_LAYOUT={
    standing:     {a:{l:30,t:58}, b:{l:70,t:58}},
    clinch:       {a:{l:42,t:56}, b:{l:58,t:56}},
    ground_A_top: {a:{l:50,t:34}, b:{l:50,t:76}},
    ground_B_top: {a:{l:50,t:76}, b:{l:50,t:34}},
    back_A:       {a:{l:58,t:40}, b:{l:42,t:66}},
    back_B:       {a:{l:42,t:66}, b:{l:58,t:40}},
  };
  function fvActionIcon(act){
    if(act.fin) return act.fin.m==='Sumisión'?'🔒':'💥';
    if(act.kdA||act.kdB) return '💫';
    if(act.type==='sub_attempt') return '🦾';
    if(act.type==='gnp') return '🔨';
    if(act.type==='takedown') return '🤼';
    if(act.type==='clinch_entry'||act.type==='clinch') return '🤼';
    if(act.type==='back_control') return '🔒';
    if(act.type==='strike') return ['head_kick','body_kick','leg_kick','spinning'].includes(act.subtype)?'🦵':'👊';
    return '';
  }
  // Monigotes de palo (SVG, trazo=currentColor) — dibujados "mirando a la derecha";
  // la ficha B se refleja en horizontal por CSS para que mire hacia la ficha A.
  const FV_POSES={
    idle:   {head:[17,9,6], torso:[17,16,17,38], armL:[17,20,11,26], armR:[17,20,23,26], legL:[17,38,11,60], legR:[17,38,23,60]},
    punch:  {head:[17,9,6], torso:[17,16,18,38], armL:[17,20,10,30], armR:[17,19,33,18], legL:[18,38,10,60], legR:[18,38,25,57]},
    kick:   {head:[17,9,6], torso:[17,16,15,38], armL:[17,20,9,30],  armR:[17,20,22,31], legL:[15,38,9,60],  legR:[15,38,30,26]},
    shoot:  {head:[19,13,6],torso:[19,19,25,36], armL:[25,36,32,44], armR:[25,36,33,36], legL:[25,36,16,60], legR:[25,36,28,58]},
    clinch: {head:[17,9,6], torso:[17,16,18,38], armL:[17,20,28,18], armR:[17,20,25,33], legL:[18,38,11,59], legR:[18,38,21,58]},
    top:    {head:[22,14,6],torso:[22,20,27,40], armL:[27,40,32,28], armR:[27,40,31,46], legL:[27,40,16,50], legR:[27,40,22,55]},
    bottom: {head:[12,50,6],torso:[12,50,26,48], armL:[12,50,8,42],  armR:[12,50,16,40], legL:[26,48,32,42], legR:[26,48,30,54]},
    hurt:   {head:[13,20,6],torso:[17,16,17,38], armL:[17,20,10,36], armR:[17,20,25,37], legL:[17,38,9,58],  legR:[17,38,22,60]},
    limp:   {head:[19,14,6],torso:[18,19,22,42], armL:[18,22,5,38],  armR:[18,22,31,46], legL:[22,42,12,60], legR:[22,42,30,57]},
    sub_top:{head:[24,16,6],torso:[24,22,28,40], armL:[28,40,19,33], armR:[28,40,33,30], legL:[28,40,18,50], legR:[28,40,24,54]},
    sub_bottom:{head:[12,50,6],torso:[12,50,26,48], armL:[12,50,5,44], armR:[12,50,19,41], legL:[26,48,33,44], legR:[26,48,30,55]},
  };
  // Monigote de "forma rellena": trazos gruesos de extremo redondeado (se leen como cápsulas
  // sólidas, no como líneas finas) + un pequeño guante/bota en la punta de cada extremidad.
  function fvFigureSvg(pose){
    const p=FV_POSES[pose]||FV_POSES.idle;
    const [hx,hy,hr]=p.head;
    const limb=(s,w)=>`<line x1="${s[0]}" y1="${s[1]}" x2="${s[2]}" y2="${s[3]}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/>`;
    const tip=(s,r)=>`<circle cx="${s[2]}" cy="${s[3]}" r="${r}" fill="currentColor"/>`;
    return `<svg class="fv-fig" viewBox="0 0 34 64" width="34" height="64">
      ${limb(p.legL,8.5)}${limb(p.legR,8.5)}
      ${limb(p.armL,7)}${limb(p.armR,7)}
      ${limb(p.torso,12)}
      ${tip(p.armL,4)}${tip(p.armR,4)}
      ${tip(p.legL,4.2)}${tip(p.legR,4.2)}
      <circle cx="${hx}" cy="${hy}" r="${hr}" fill="currentColor"/>
    </svg>`;
  }
  // Elige la pose de cada peleador según la posición resultante, quién actuó, y si esta acción
  // le deja grogui (recibe golpe sin responder) o lo tumba (knockdown/finalización)
  function fvPoseFor(side, act, pos, aThrew, bThrew, isDown, isHurt){
    if(isDown) return 'limp';
    if(isHurt) return 'hurt';
    const isSub = act.type==='sub_attempt';
    if(pos==='clinch') return 'clinch';
    if(pos==='ground_A_top') return side==='A'?(isSub?'sub_top':'top'):(isSub?'sub_bottom':'bottom');
    if(pos==='ground_B_top') return side==='B'?(isSub?'sub_top':'top'):(isSub?'sub_bottom':'bottom');
    if(pos==='back_A') return side==='A'?(isSub?'sub_top':'top'):(isSub?'sub_bottom':'bottom');
    if(pos==='back_B') return side==='B'?(isSub?'sub_top':'top'):(isSub?'sub_bottom':'bottom');
    const threw = side==='A'?aThrew:bThrew;
    if(!threw) return 'idle';
    if(act.type==='takedown') return 'shoot';
    if(act.type==='strike') return ['head_kick','body_kick','leg_kick','spinning'].includes(act.subtype)?'kick':'punch';
    return 'idle';
  }
  function fvRingHtml(fA, fB, pos, act){
    const layout = FV_POS_LAYOUT[pos]||FV_POS_LAYOUT.standing;
    const aThrew=!!(act.sigA||act.tdAttA||act.subAttA), bThrew=!!(act.sigB||act.tdAttB||act.subAttB);
    const aGotHit=act.dA>0, bGotHit=act.dB>0;
    const aIsDown=!!act.kdA||act.fin?.s==='B', bIsDown=!!act.kdB||act.fin?.s==='A';
    const aIsHurt=aGotHit&&!aThrew&&!aIsDown, bIsHurt=bGotHit&&!bThrew&&!bIsDown;
    const aClasses=['fv-token','a'], bClasses=['fv-token','b'];
    if(aThrew) aClasses.push('throw');
    if(bThrew) bClasses.push('throw');
    if(aGotHit) aClasses.push('impact');
    if(bGotHit) bClasses.push('impact');
    if(aIsDown) aClasses.push('down');
    if(bIsDown) bClasses.push('down');
    if(act.fin?.s==='A') aClasses.push('winglow');
    if(act.fin?.s==='B') bClasses.push('winglow');
    const poseA=fvPoseFor('A', act, pos, aThrew, bThrew, aIsDown, aIsHurt), poseB=fvPoseFor('B', act, pos, aThrew, bThrew, bIsDown, bIsHurt);
    const icon=fvActionIcon(act);
    const midL=(layout.a.l+layout.b.l)/2, midT=Math.min(layout.a.t,layout.b.t)-8;
    return `<div class="fv-ring">
      <div class="${aClasses.join(' ')}" style="left:${layout.a.l}%;top:${layout.a.t}%"><div class="fv-fig-mirror">${fvFigureSvg(poseA)}</div><span class="fv-token-name">${(fA.name||'').split(' ').pop()}</span></div>
      <div class="${bClasses.join(' ')}" style="left:${layout.b.l}%;top:${layout.b.t}%"><div class="fv-fig-mirror">${fvFigureSvg(poseB)}</div><span class="fv-token-name">${(fB.name||'').split(' ').pop()}</span></div>
      ${icon?`<div class="fv-spark" style="left:${midL}%;top:${midT}%">${icon}</div>`:''}
    </div>`;
  }

  // Usar los roundScores REALES devueltos por simulateFight — así el marcador del viewer
  // es exactamente consistente con el resultado final. Fin al bug de "va 2-0 pero pierde".
  const fightRoundScores = results.map(({fA, fB, result})=>{
    // result.roundScores ya contiene el ganador real de cada asalto ('A'=fA ganó, 'B'=fB ganó, 'finish')
    // Completar con null para los asaltos que no se disputaron (pelea acabó antes)
    const scores = result.roundScores || [];
    while(scores.length < result.rounds) scores.push(null);
    return scores;
  });

  // Stats en tiempo real por combate — más realistas con submissions
  // Stats derivadas DIRECTAMENTE de la simulación real (roundDetails+actions)
  const fightLiveStats = results.map(({fA,fB,result})=>{
    const rounds = result.rounds||3;
    let strikesA=0, strikesB=0, tdA=0, tdB=0, subAttA=0, subAttB=0, kdA=0, kdB=0, ctrlA=0, ctrlB=0;
    const roundMargins=[];

    (result.roundDetails||[]).forEach(rd=>{
      strikesA+=(rd.statsA?.sigL||0);
      strikesB+=(rd.statsB?.sigL||0);
      tdA+=(rd.statsA?.tdL||0);
      tdB+=(rd.statsB?.tdL||0);
      subAttA+=(rd.statsA?.subAtt||0);
      subAttB+=(rd.statsB?.subAtt||0);
      kdA+=(rd.statsA?.kd||0);
      kdB+=(rd.statsB?.kd||0);
      ctrlA+=(rd.statsA?.ctrl||0);
      ctrlB+=(rd.statsB?.ctrl||0);
      roundMargins.push((rd.scoreA||0)-(rd.scoreB||0));
    });

    const incidents=[];
    if(Math.random()<0.12){
      const inc=[
        {round:Math.ceil(Math.random()*rounds),desc:`⚕️ El médico revisa un corte sobre el ojo de ${fA.name}. El combate se reanuda.`},
        {round:Math.ceil(Math.random()*rounds),desc:`🛑 Golpe bajo accidental. Tiempo de recuperación para ${fB.name}.`},
        {round:Math.ceil(Math.random()*rounds),desc:`⚠️ El árbitro advierte a ${fA.name} por agarrar la valla.`},
        {round:Math.ceil(Math.random()*rounds),desc:`👁️ Pinchazo ocular accidental. Tiempo para ${fB.name}.`},
      ];
      incidents.push(inc[Math.floor(Math.random()*inc.length)]);
    }

    return {strikesA,strikesB,tdA,tdB,subAttA,subAttB,kdA,kdB,ctrlA,ctrlB,incidents,roundMargins};
  });

  // Contexto de revancha: historial previo entre estos dos
  const fightRematches = results.map(({fA,fB})=>{
    const prev=STATE.events.filter(e=>e.status==='completed').flatMap(e=>
      e.card.filter(ft=>ft.result&&((ft.fighterA===fA.id&&ft.fighterB===fB.id)||(ft.fighterA===fB.id&&ft.fighterB===fA.id)))
      .map(ft=>({...ft.result,date:e.date,evName:e.name}))
    );
    return prev;
  });

  function renderFightViewer(){
    clearTicker();
    const {fight, fA, fB, result, narrative, missedId} = results[fightIdx];
    const title = fight.titleId? STATE.titles.find(t=>t.id===fight.titleId):null;
    const w=result.winner, l=result.loser;
    const isKO=result.method==='KO/TKO', isSub=result.method==='Sumisión';
    const resultMethodColor = isKO?'var(--ko)':isSub?'var(--sub)':'var(--dec)';
    const probA = winProbabilities(fA,fB,result.rounds||3).probA;
    const probB = 100-probA;
    // Fight type — determines visual style
    const isTitle=!!fight.titleId, isRivalFight=isRival(fA.id,fB.id), isContenderFight=!!fight.isContender;
    const fightTypeLabel=isTitle?(fight.isInterim?'🥈 Pelea por el título interino':'🏆 Pelea por el título'):isContenderFight?'🥊 Pelea de contendiente':isRivalFight?'⚔️ Rivalidad':'';
    const headerBg=isTitle?'linear-gradient(90deg,#5a0000,#000,#4a3000)':isContenderFight?'linear-gradient(90deg,#00205a,#000,#00205a)':isRivalFight?'linear-gradient(90deg,#3a0060,#000,#3a0060)':'var(--bg3)';
    const borderColor=isTitle?'var(--gold)':isContenderFight?'#82b1ff':isRivalFight?'var(--sub)':'var(--line)';
    // Rankings
    const p4pRankA=getPfpRank(fA), p4pRankB=getPfpRank(fB);
    const divRankA=getDivRank(fA), divRankB=getDivRank(fB);
    const rankTagA=[p4pRankA&&`P4P #${p4pRankA}`,divRankA&&`#${divRankA} ${divName(fA.division).slice(0,12)}`].filter(Boolean).join(' · ');
    const rankTagB=[p4pRankB&&`P4P #${p4pRankB}`,divRankB&&`#${divRankB} ${divName(fB.division).slice(0,12)}`].filter(Boolean).join(' · ');

    if(phase==='prefight'){
      // PANTALLA PRE-COMBATE: vs screen con stats y probabilidades
      document.getElementById('modalRoot').innerHTML=`
      <div class="fv-modal-bg" id="modalBg">
        <div class="fv-modal" style="border-color:${borderColor}">
          <div style="background:${headerBg};padding:10px 14px;display:flex;align-items:center;justify-content:space-between">
            <span class="muted" style="font-size:.75rem">Combate ${fightIdx+1}/${totalFights} · ${fName(ev)}</span>
            ${fightTypeLabel?`<span style="font-size:.78rem;font-weight:700;color:${borderColor}">${fightTypeLabel}</span>`:title?`<span style="font-size:.8rem">${titleIcon(title)} ${fName(title)}${fight.isInterim?' (Interino)':''}</span>`:''}
          </div>
          <div style="padding:16px 14px">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
              <div style="flex:1;text-align:center;display:flex;flex-direction:column;align-items:center">
                ${avatarHtml(fA,88)}
                <div style="font-weight:700;margin-top:8px;font-size:.9rem">${fName(fA)}</div>
                <div class="muted" style="font-size:.72rem">${fA.record.wins}-${fA.record.losses} · <span style="color:var(--ko)">${fA.record.koWins||0}KO</span> <span style="color:var(--sub)">${fA.record.subWins||0}Sub</span></div>
                ${rankTagA?`<div style="font-size:.66rem;color:#82b1ff;margin-top:1px">${rankTagA}</div>`:''}
                <div style="font-size:.68rem;margin-top:2px;color:var(--txt2)">${(FIGHT_STYLES[fA.fightStyle||'technical']?.icon||'🧠')} ${(FIGHT_STYLES[fA.fightStyle||'technical']?.label||'Técnico')}</div>
              </div>
              <div style="text-align:center;color:${borderColor};font-size:1.8rem;font-weight:900;min-width:36px;padding-top:28px">VS</div>
              <div style="flex:1;text-align:center;display:flex;flex-direction:column;align-items:center">
                ${avatarHtml(fB,88)}
                <div style="font-weight:700;margin-top:8px;font-size:.9rem">${fName(fB)}</div>
                <div class="muted" style="font-size:.72rem">${fB.record.wins}-${fB.record.losses} · <span style="color:var(--ko)">${fB.record.koWins||0}KO</span> <span style="color:var(--sub)">${fB.record.subWins||0}Sub</span></div>
                ${rankTagB?`<div style="font-size:.66rem;color:#82b1ff;margin-top:1px">${rankTagB}</div>`:''}
                <div style="font-size:.68rem;margin-top:2px;color:var(--txt2)">${(FIGHT_STYLES[fB.fightStyle||'technical']?.icon||'🧠')} ${(FIGHT_STYLES[fB.fightStyle||'technical']?.label||'Técnico')}</div>
              </div>
            </div>
            <div style="margin:14px 0 8px;font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--txt2);text-align:center">Probabilidades (simulación)</div>
            <div style="display:flex;border-radius:6px;overflow:hidden;height:28px">
              <div style="width:${probA}%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff">${probA.toFixed(0)}%</div>
              <div style="width:${probB}%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff">${probB.toFixed(0)}%</div>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:2px">
              <span style="font-size:.7rem;color:var(--txt2)">${fName(fA)}</span>
              <span style="font-size:.7rem;color:var(--txt2)">${fName(fB)}</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;font-size:.75rem">
              ${[['Pegada','striking'],['Potencia','power'],['Wrestling Of.','wrestlingOff'],['Defensa W.','wrestlingDef'],['Suelo','ground'],['Cardio','cardio'],['Resistencia','chin']].map(([lbl,k])=>{
                const va=fA.stats[k], vb=fB.stats[k];
                return `<div style="grid-column:1/-1;display:grid;grid-template-columns:1fr 40px 1fr;gap:4px;align-items:center">
                  <div style="height:6px;border-radius:3px;background:linear-gradient(to left, var(--red), transparent);width:${va}%"></div>
                  <div style="text-align:center;color:var(--txt3);font-size:.65rem">${lbl}</div>
                  <div style="height:6px;border-radius:3px;background:linear-gradient(to right, var(--blue), transparent);width:${vb}%"></div>
                </div>`;
              }).join('')}
            </div>
          </div>
          <div style="padding:0 14px 8px;display:flex;gap:8px">
            <button class="btn primary full" id="fvStartLive" style="padding:12px">▶ Ver en vivo</button>
            <button class="btn primary full" id="fvStartSkip" style="padding:12px">⏭ Ir al resultado</button>
          </div>
          <div style="padding:0 14px 16px;display:flex;gap:8px">
            ${fightIdx<totalFights-1?`<button class="btn small full" id="fvSkipAll" style="white-space:nowrap">⏩ Simular resto rápido</button>
            <button class="btn small full" id="fvSimNext" style="white-space:nowrap">⏭ Siguiente pelea</button>`:''}
          </div>
          ${(()=>{const prev=fightRematches[fightIdx]; if(!prev.length) return '';
            const last=prev[prev.length-1]; const won=last.winnerId===fA.id;
            const mc=methodColor(last.method);
            return `<div style="padding:0 14px 12px;background:var(--bg3);margin:0 1px;border-top:1px solid var(--line)">
              <div style="font-size:.65rem;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">⚔️ Contexto — ${prev.length===1?'Primera revancha':prev.length===2?'Trilogía':'Pelea #'+(prev.length+1)}</div>
              <div style="font-size:.78rem">En su último encuentro, <b style="color:${won?'var(--red)':'var(--blue)'}">${won?fA.name:fB.name}</b> venció por <span style="color:${mc}">${methodLabel(last)}</span> R${last.round} <span style="color:var(--txt3)">(${last.date?.slice(0,7)||''})</span></div>
            </div>`;
          })()}
          <div style="padding:0 14px 12px;text-align:center">
            <button class="btn small" id="fvCancel" style="color:var(--muted)">✕ Cancelar sin guardar</button>
          </div>
        </div>
      </div>`;
      document.getElementById('fvStartLive').onclick=()=>{ phase='rounds'; roundIdx=0; tickerMode='ticker'; tickerIdx=0; tickerPlaying=true; renderFightViewer(); };
      document.getElementById('fvStartSkip').onclick=()=>{ phase='rounds'; roundIdx=0; tickerMode='summary'; tickerIdx=0; tickerPlaying=false; renderFightViewer(); };
      if(document.getElementById('fvSkipAll')) document.getElementById('fvSkipAll').onclick=()=>{ skipAllRemaining(); };
      if(document.getElementById('fvSimNext')) document.getElementById('fvSimNext').onclick=()=>{
        // Solo avanzar — todos los resultados se aplican juntos al final por applyAllAndFinish
        if(fightIdx<results.length-1){ fightIdx++; phase='prefight'; roundIdx=0; renderFightViewer(); }
        else { applyAllAndFinish(); }
      };
      document.getElementById('fvCancel').onclick=()=>{ if(confirm('¿Cancelar sin guardar resultados?')){ clearTicker(); closeModal(); } };

    } else if(phase==='rounds'){
      // PANTALLA DE ROUNDS: ticker en vivo golpe a golpe (fase 'ticker') + resumen del asalto (fase 'summary')
      const roundData = narrative[roundIdx];
      const roundsFought = narrative.length; // rondas realmente disputadas (no las programadas — evita el bug de marcar mal el asalto final en un KO temprano)
      const isLastRound = roundIdx===roundsFought-1;
      const isFinishRound = isLastRound && result.method!=='Decisión';

      // Usar los scores pre-calculados (fijos para todo el combate, no cambian al navegar)
      const allRoundScores = fightRoundScores[fightIdx]; // array del combate actual
      // Solo mostrar asaltos ya terminados (antes del actual)
      const scoreHistory = allRoundScores.slice(0, roundIdx);
      const roundsA = scoreHistory.filter(x=>x==='A').length;
      const roundsB = scoreHistory.filter(x=>x==='B').length;

      // Scorecard visual: casillas por asalto
      const scorecardHtml = Array.from({length:result.totalRounds||3},(_,i)=>{
        let bg='var(--bg)', symbol='·';
        const s = allRoundScores[i];
        if(i < roundIdx || (i===roundIdx && tickerMode==='summary')){
          if(s==='A'){ bg='rgba(215,38,61,.4)'; symbol='▲'; }
          else if(s==='B'){ bg='rgba(77,157,224,.4)'; symbol='▼'; }
          else if(s==='finish'){ bg='rgba(227,179,65,.3)'; symbol='★'; }
          else { bg='rgba(100,100,100,.4)'; symbol='='; }
        } else if(i===roundIdx){ bg='rgba(255,255,255,.15)'; symbol=`R${i+1}`; }
        return `<div style="flex:1;height:26px;border-radius:4px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff">${symbol}</div>`;
      }).join('');

      // Quién va ganando en tarjetas
      let advantageHtml='';
      if(roundIdx>0 && !isFinishRound){
        if(roundsA>roundsB){
          advantageHtml=`<div style="text-align:center;font-size:.72rem;color:var(--red);font-weight:700;margin-top:4px">${fName(fA)} va ganando en tarjetas (${roundsA}-${roundsB})</div>`;
        } else if(roundsB>roundsA){
          advantageHtml=`<div style="text-align:center;font-size:.72rem;color:var(--blue);font-weight:700;margin-top:4px">${fName(fB)} va ganando en tarjetas (${roundsB}-${roundsA})</div>`;
        } else {
          advantageHtml=`<div style="text-align:center;font-size:.72rem;color:var(--txt2);margin-top:4px">Empatados en tarjetas (${roundsA}-${roundsB})</div>`;
        }
      }

      const fvHeaderHtml=`
        <div class="fv-head">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:.72rem;color:var(--txt3)">${fName(ev)} · Combate ${fightIdx+1}/${totalFights}${title?' · '+titleIcon(title)+' '+title.name:''}</span>
            <span style="font-size:.8rem;font-weight:800;color:#fff;background:var(--bg);padding:2px 10px;border-radius:12px">R${roundIdx+1}</span>
          </div>
          <div style="display:flex;gap:3px">${scorecardHtml}</div>
          ${advantageHtml}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0;gap:8px">
          <div style="flex:1;display:flex;align-items:center;gap:8px">
            ${avatarHtml(fA,40)}
            <div>
              <div style="font-weight:700;font-size:.82rem">${fName(fA)}</div>
              <div style="font-size:.68rem;color:var(--txt2)">${fA.record.wins}-${fA.record.losses} · <span style="color:var(--ko)">${fA.record.koWins||0}KO</span> <span style="color:var(--sub)">${fA.record.subWins||0}Sub</span></div>
            </div>
          </div>
          <div style="font-size:1rem;font-weight:900;color:var(--txt3)">VS</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px">
            <div style="text-align:right">
              <div style="font-weight:700;font-size:.82rem">${fName(fB)}</div>
              <div style="font-size:.68rem;color:var(--txt2)">${fB.record.wins}-${fB.record.losses} · <span style="color:var(--ko)">${fB.record.koWins||0}KO</span> <span style="color:var(--sub)">${fB.record.subWins||0}Sub</span></div>
            </div>
            ${avatarHtml(fB,40)}
          </div>
        </div>`;

      if(tickerMode==='ticker'){
        // ── TICKER EN VIVO: reproduce las acciones reales del asalto una a una ──
        const rd = result.roundDetails[roundIdx];
        const acts = rd?.actions||[];
        if(!acts.length){ tickerMode='summary'; renderFightViewer(); return; }
        if(tickerIdx>acts.length-1) tickerIdx=acts.length-1;
        const act=acts[tickerIdx];
        const isFinAct = !!act.fin;
        // Posición resultante tras esta acción (o la que venía arrastrando si no cambia) — se usa
        // tanto para la etiqueta como para el ring, así ambos van siempre sincronizados.
        let _p='standing'; for(let k=0;k<tickerIdx;k++){ _p=acts[k].npos||_p; }
        const ringPos = act.npos || _p;
        const posLabel = FV_POS_LABEL[ringPos]||'🥊 De pie';
        const prevLines = acts.slice(Math.max(0,tickerIdx-2), tickerIdx).map(a=>a.narr).filter(Boolean);
        const {cumA, cumB, hA, hB} = fvCumulative(fightIdx, roundIdx, tickerIdx);

        document.getElementById('modalRoot').innerHTML=`
        <div class="fv-modal-bg" id="modalBg">
          <div class="fv-modal">
            ${fvHeaderHtml}
            <div style="padding:10px 14px 0">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span class="fv-live"><span class="fv-live-dot"></span> En vivo</span>
                <span style="font-size:.65rem;color:var(--txt3)">${posLabel} · Acción ${tickerIdx+1}/${acts.length}</span>
              </div>
              ${fvRingHtml(fA, fB, ringPos, act)}
              ${fvStatPanel(cumA, cumB, hA, hB, fA, fB)}
              <div class="fv-narr ${isFinAct?'fv-hit':''}" id="fvTapArea" style="cursor:pointer;${isFinAct?'border-color:var(--gold)':''}">
                ${prevLines.map(l=>`<p style="margin:0 0 8px;font-size:.78rem;line-height:1.5;color:var(--txt3)">${l}</p>`).join('')}
                <p style="margin:0;font-size:${isFinAct?'1rem':'.92rem'};font-weight:${isFinAct?800:400};line-height:1.6;color:${isFinAct?'var(--gold)':'#fff'}">${act.narr||'…'}</p>
              </div>
              <div style="font-size:.62rem;color:var(--txt3);text-align:center;margin-top:4px">Toca el recuadro para avanzar</div>
            </div>
            <div style="padding:12px 14px 6px;display:flex;gap:8px">
              <button class="btn small" id="fvTickerPrev" ${tickerIdx===0?'disabled':''} style="min-width:44px">◀</button>
              <button class="btn ${tickerPlaying?'gold':'green'} full" id="fvTickerPlay">${tickerPlaying?'⏸ Pausa':'▶ Reanudar'}</button>
              <button class="btn small" id="fvTickerSpeed" style="white-space:nowrap">${FV_SPEED_LABELS[tickerSpeedIdx]}</button>
            </div>
            <div style="padding:0 14px 14px">
              <button class="btn primary full" id="fvTickerSkip">⏭ Ir al resumen del asalto</button>
            </div>
            <div style="text-align:center;padding:0 14px 12px">
              <button class="btn small" id="fvSkipRest" style="color:var(--txt2);font-size:.72rem">⏩ Simular resto rápido</button>
            </div>
          </div>
        </div>`;

        const advance=()=>{
          if(tickerIdx<acts.length-1){ tickerIdx++; } else { tickerMode='summary'; }
          renderFightViewer();
        };
        document.getElementById('fvTickerPlay').onclick=()=>{ tickerPlaying=!tickerPlaying; renderFightViewer(); };
        document.getElementById('fvTickerSpeed').onclick=()=>{ tickerSpeedIdx=(tickerSpeedIdx+1)%3; renderFightViewer(); };
        document.getElementById('fvTickerSkip').onclick=()=>{ tickerMode='summary'; renderFightViewer(); };
        document.getElementById('fvSkipRest').onclick=skipAllRemaining;
        document.getElementById('fvTickerPrev').onclick=()=>{ tickerPlaying=false; if(tickerIdx>0){ tickerIdx--; renderFightViewer(); } };
        document.getElementById('fvTapArea').onclick=()=>{ tickerPlaying=false; advance(); };

        if(tickerPlaying){ tickerTimer=setTimeout(advance, FV_SPEEDS[tickerSpeedIdx]); }
        return;
      }

      // ── RESUMEN DEL ASALTO (tras el ticker, o al saltarlo) ──
      // Separar líneas normales de la línea de finalización
      const normalLines = isFinishRound ? roundData.lines.slice(0,-1) : roundData.lines;
      const finishLine = isFinishRound ? roundData.lines[roundData.lines.length-1] : null;
      const summaryActs = (result.roundDetails[roundIdx]?.actions||[]);
      const {cumA:sumCumA, cumB:sumCumB, hA:sumHA, hB:sumHB} = fvCumulative(fightIdx, roundIdx, summaryActs.length-1);

      document.getElementById('modalRoot').innerHTML=`
      <div class="fv-modal-bg" id="modalBg">
        <div class="fv-modal">
          ${fvHeaderHtml}

          <!-- Narrativa del asalto -->
          <div style="padding:12px 14px 0">
            <div style="font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--txt3);margin-bottom:6px">Resumen — Asalto ${roundIdx+1} de ${result.totalRounds||3}</div>
            ${fvStatPanel(sumCumA, sumCumB, sumHA, sumHB, fA, fB)}
            ${(()=>{
              // Incidentes en este asalto
              const inc=fightLiveStats[fightIdx].incidents.filter(i=>i.round===roundIdx+1);
              return inc.map(i=>`<div style="background:rgba(255,160,0,.1);border:1px solid rgba(255,160,0,.3);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:.78rem;color:#ffb74d">${i.desc}</div>`).join('');
            })()}
            <div class="fv-narr">
              ${normalLines.map((line,i)=>`<p style="margin:0 0 10px;font-size:.88rem;line-height:1.6;color:${i===0?'var(--txt)':'var(--txt2)'}">${line}</p>`).join('')}
              ${finishLine?`<p style="margin:10px 0 0;font-size:1rem;font-weight:700;line-height:1.5;color:#fff;padding-top:10px;border-top:1px solid var(--line)">${finishLine}</p>`:''}
            </div>

            <!-- Finalización highlight -->
            ${isFinishRound?`
            <div style="margin-top:10px;display:flex;align-items:center;gap:12px;padding:12px;background:${isKO?'rgba(215,38,61,.12)':'rgba(206,147,216,.12)'};border-radius:8px;border:1px solid ${isKO?'var(--red2)':'var(--sub)'}">
              <div style="font-size:2.5rem">${isKO?'💥':'🤼'}</div>
              <div>
                <div style="font-size:1.1rem;font-weight:900;color:${resultMethodColor}">${methodLabel(result).toUpperCase()}</div>
                <div style="font-size:.82rem;color:var(--txt2)">Ronda <b style="color:#fff">${result.round}</b> · <b style="color:#fff">${result.time}</b></div>
                <div style="font-size:.78rem;color:var(--txt2);margin-top:2px">Ganador: <b style="color:var(--gold)">${fName(result.winner)}</b></div>
              </div>
            </div>`:''}
          </div>

          <!-- Botones -->
          <div style="padding:12px 14px 14px;display:flex;gap:8px;margin-top:4px">
            ${roundIdx>0?`<button class="btn small" id="fvPrev" style="min-width:60px">←</button>`:''}
            ${isLastRound
              ?`<button class="btn primary full" id="fvNext" style="padding:12px;font-weight:700">Ver resultado →</button>`
              :`<button class="btn primary" id="fvNextLive" style="padding:12px;font-weight:700;flex:1">▶ Ronda ${roundIdx+2} en vivo</button>
                <button class="btn primary" id="fvNextSkip" style="padding:12px;font-weight:700;flex:1">⏭ Ir al resultado</button>`}

  function applyAllAndFinish(){
    clearTicker();
    results.forEach(({fight, result, missedId})=>{
      fight.result = {
        winnerId:result.winner.id, loserId:result.loser.id,
        method:result.method, decType:result.decType||null, round:result.round, time:result.time,
        fightOfNight:result.fightOfNight, performance:result.performance,
        missedWeight: missedId||null, judgeScores:result.judgeScores||null
      };
      if(missedId){
        const mf=STATE.fighters.find(x=>x.id===missedId);
        if(mf){
          fight.missedWeight=missedId;
          logEvent(`⚖️ ${fName(mf)} no da el peso — el combate se realiza igualmente, pero ${fName(mf)} no podrá ganar/retener el título si gana el combate.`);
          mf.rankScore=Math.max(0,(mf.rankScore||0)-15);
          mf.missedWeightCount=(mf.missedWeightCount||0)+1;
          if(STATE.atpPoints) STATE.atpPoints[missedId]=Math.round((STATE.atpPoints[missedId]||0)*0.85);
        }
      }
      const fAf=STATE.fighters.find(x=>x.id===fight.fighterA);
      const fBf=STATE.fighters.find(x=>x.id===fight.fighterB);
      if(fAf&&fBf){
        applyFightResultToState(fight, fAf, fBf, result, ev);
        checkAndUpdateRecords(fAf, fBf, result, ev.date);
      }
    });
    finishEvent(ev);
    STATE.meta.currentDate = ev.date;
    saveLocal(); render();
    showEventSummaryAfterRender(ev);
  }

  function skipAllRemaining(){ applyAllAndFinish(); }

  renderFightViewer();
}

// Separa la lógica de aplicar un resultado de combate al estado (usada por live viewer y simulate rápido)
// Revierte todos los efectos de un evento ya completado (victorias, derrotas, KOs, títulos, bonos)
function revertEvent(ev){
  // Reembolsar el impacto económico del evento — si no, el presupuesto se queda con el
  // beneficio/pérdida de un evento que ya no existe.
  if(ev._finance){
    STATE.meta.budget=(STATE.meta.budget||0)-(ev._finance.net||0);
    recordBudgetTx(-(ev._finance.net||0), `Reversión de evento: ${fName(ev)}`, ev.date);
  }
  ev.card.forEach(fight=>{
    if(!fight.result) return;
    const r=fight.result;
    const winner=STATE.fighters.find(x=>x.id===r.winnerId);
    const loser=STATE.fighters.find(x=>x.id===r.loserId);
    if(!winner||!loser) return;

    // Revertir rivalidad (contador de enfrentamientos) — si esta pelea era su único
    // enfrentamiento, elimina la entrada por completo en vez de dejarla en 0 huérfana.
    const rk=rivalryKey(fight.fighterA,fight.fighterB);
    if(STATE.rivalries?.[rk]){
      STATE.rivalries[rk].fights=Math.max(0,(STATE.rivalries[rk].fights||0)-1);
      if(STATE.rivalries[rk].fights<=0) delete STATE.rivalries[rk];
    }
    // Si el combate nació de un callout, el pique nunca llegó a disputarse de verdad — se
    // devuelve a la lista de callouts pendientes (fighterA es siempre el retador original).
    if(fight.isCallout){
      if(!STATE.callouts) STATE.callouts=[];
      STATE.callouts.push({id:uid('CO'), callerId:fight.fighterA, targetId:fight.fighterB, divisionId:winner.division, eventSeqIssued:STATE.meta.eventSeq});
    }

    // Revertir reputación — la misma fórmula (determinista) que le aplicó applyFightResultToState.
    updateReputation(winner, -(fight.titleId?12: r.method!=='Decisión'?6:3));
    updateReputation(loser, -(fight.titleId?-8:-3));

    // Revertir consumo de contrato y cualquier renegociación pendiente que este evento disparara.
    [winner,loser].forEach(pf=>{
      if(!pf.contract) return;
      const hadPending=(STATE.pendingNegotiations||[]).find(n=>n.fighterId===pf.id && n.eventSeqCreated===ev.seq);
      if(hadPending) STATE.pendingNegotiations=STATE.pendingNegotiations.filter(n=>n!==hadPending);
      pf.contract.fightsLeft=(pf.contract.fightsLeft||0)+1;
    });

    // Revertir cláusulas (contendiente / unificación) que esta pelea hubiera activado.
    if(STATE.rematches){
      [winner.id, loser.id].forEach(fid=>{
        if(STATE.rematches[fid]?.date===ev.date) delete STATE.rematches[fid];
      });
    }

    // Revertir contador de peso fallido
    if(fight.missedWeight){
      const mf=STATE.fighters.find(x=>x.id===fight.missedWeight);
      if(mf) mf.missedWeightCount=Math.max(0,(mf.missedWeightCount||0)-1);
    }

    // Revertir momentum — solo el caso de victoria es reversible con precisión (se sabe que
    // sumó 1); una derrota reinicia el momentum a 0 y no queda registro de cuál era antes,
    // así que esa parte queda como aproximación aceptada (igual que lastEventSeq más abajo).
    if(winner.momentum>0) winner.momentum=Math.max(0,winner.momentum-1);

    // Revertir récord numérico
    winner.record.wins = Math.max(0, (winner.record.wins||0)-1);
    winner.record.ufcWins = Math.max(0, (winner.record.ufcWins||0)-1);
    winner.record.ufcFights = Math.max(0, (winner.record.ufcFights||0)-1);
    loser.record.losses = Math.max(0, (loser.record.losses||0)-1);
    loser.record.ufcLosses = Math.max(0, (loser.record.ufcLosses||0)-1);
    loser.record.ufcFights = Math.max(0, (loser.record.ufcFights||0)-1);
    if(r.method==='KO/TKO'){
      winner.record.koWins=Math.max(0,(winner.record.koWins||0)-1);
      winner.record.ufcKoWins=Math.max(0,(winner.record.ufcKoWins||0)-1);
      loser.record.koLosses=Math.max(0,(loser.record.koLosses||0)-1);
      loser.record.ufcKoLosses=Math.max(0,(loser.record.ufcKoLosses||0)-1);
    } else if(r.method==='Sumisión'){
      winner.record.subWins=Math.max(0,(winner.record.subWins||0)-1);
      winner.record.ufcSubWins=Math.max(0,(winner.record.ufcSubWins||0)-1);
      loser.record.subLosses=Math.max(0,(loser.record.subLosses||0)-1);
      loser.record.ufcSubLosses=Math.max(0,(loser.record.ufcSubLosses||0)-1);
    } else {
      winner.record.decWins=Math.max(0,(winner.record.decWins||0)-1);
      winner.record.ufcDecWins=Math.max(0,(winner.record.ufcDecWins||0)-1);
      loser.record.decLosses=Math.max(0,(loser.record.decLosses||0)-1);
      loser.record.ufcDecLosses=Math.max(0,(loser.record.ufcDecLosses||0)-1);
    }
    // Revertir bonos (FOTN, POTN)
    if(r.isPOTN) winner.bonuses.performanceOfNight=Math.max(0,(winner.bonuses.performanceOfNight||0)-1);
    if(r.isFOTN){
      winner.bonuses.fightOfNight=Math.max(0,(winner.bonuses.fightOfNight||0)-1);
      loser.bonuses.fightOfNight=Math.max(0,(loser.bonuses.fightOfNight||0)-1);
    }
    // Revertir historial de combates
    [winner,loser].forEach(f=>{
      const idx=f.fightHistory?f.fightHistory.lastIndexOf(fight.id):-1;
      if(idx!==-1) f.fightHistory.splice(idx,1);
      // Restaurar lastEventSeq aproximado (sin historial completo, lo dejamos como null o el anterior)
      if(f.lastEventSeq===ev.seq) f.lastEventSeq=null;
    });
    // Revertir títulos — distingue reinado interino de principal en todo momento (holderId
    // y interimHolderId son campos independientes; mezclarlos fue la causa de varios bugs
    // anteriores con títulos interinos).
    if(fight.titleId){
      const title=STATE.titles.find(t=>t.id===fight.titleId);
      if(title){
        const wasInterim=!!fight.isInterim;
        // Eliminar entrada en history del evento
        title.history=title.history.filter(h=>h.wonEventId!==ev.id);

        // ¿Este resultado creó un reinado nuevo (cambio de titular) o solo defendió uno existente?
        const newReignRemoved=(winner.titleReigns||[]).some(tr=>tr.titleId===fight.titleId && !!tr.isInterim===wasInterim && tr.wonDate===ev.date);
        winner.titleReigns=(winner.titleReigns||[]).filter(tr=>!(tr.titleId===fight.titleId && !!tr.isInterim===wasInterim && tr.wonDate===ev.date));

        if(newReignRemoved){
          // Cambio de titular: restaurar el reinado anterior que se cerró este día, si lo hubo
          let restored=false;
          STATE.fighters.forEach(f=>{
            const r=(f.titleReigns||[]).find(tr=>tr.titleId===fight.titleId && !!tr.isInterim===wasInterim && tr.lostDate===ev.date);
            if(r){ r.lostDate=null; if(wasInterim) title.interimHolderId=f.id; else title.holderId=f.id; restored=true; }
          });
          if(!restored){ if(wasInterim) title.interimHolderId=null; else title.holderId=null; }
        } else {
          // Solo fue una defensa: restar la defensa que se sumó
          const reign=(winner.titleReigns||[]).find(tr=>tr.titleId===fight.titleId && !!tr.isInterim===wasInterim && !tr.lostDate);
          if(reign) reign.defenses=Math.max(0,(reign.defenses||0)-1);
        }
      }
    }
  });
  // Revertir eventSeq
  if(STATE.meta.eventSeq>1) STATE.meta.eventSeq--;
  logEvent(`↩️ Evento "${fName(ev)}" revertido. Sus resultados han sido eliminados.`);
}

function applyFightResultToState(fight, fA, fB, result, ev){
  // IMPORTANTE: result.winner/loser pueden ser clones temporales (simulateEvent les aplica
  // el bonus de racha a las stats antes de simular), así que SIEMPRE resolvemos ganador/perdedor
  // a los objetos reales fA/fB por id — si no, reasignaciones directas de propiedad
  // (reputación, sponsor...) se pierden silenciosamente al descartarse el clon.
  const winner = fA.id===result.winner.id ? fA : fB;
  const loser = fA.id===result.loser.id ? fA : fB;
  // Actualizar stats de carrera
  if(result.fightStatsA) updateCareerStats(fA, result.fightStatsA, fA.id===winner.id);
  if(result.fightStatsB) updateCareerStats(fB, result.fightStatsB, fB.id===winner.id);
  winner.record.wins++; loser.record.losses++;
  winner.record.ufcFights=(winner.record.ufcFights||0)+1;
  loser.record.ufcFights=(loser.record.ufcFights||0)+1;
  winner.record.ufcWins=(winner.record.ufcWins||0)+1;
  loser.record.ufcLosses=(loser.record.ufcLosses||0)+1;
  if(result.method==='KO/TKO'){winner.record.koWins++;loser.record.koLosses++;winner.record.ufcKoWins=(winner.record.ufcKoWins||0)+1;loser.record.ufcKoLosses=(loser.record.ufcKoLosses||0)+1;}
  if(result.method==='Sumisión'){winner.record.subWins++;loser.record.subLosses++;winner.record.ufcSubWins=(winner.record.ufcSubWins||0)+1;loser.record.ufcSubLosses=(loser.record.ufcSubLosses||0)+1;}
  if(result.method==='Decisión'){winner.record.decWins++;loser.record.decLosses++;winner.record.ufcDecWins=(winner.record.ufcDecWins||0)+1;loser.record.ufcDecLosses=(loser.record.ufcDecLosses||0)+1;}
  // Momentum
  updateMomentum(winner, true);
  updateMomentum(loser, false);
  // ATP ranking points
  awardAtpPoints(winner, loser, !!fight.titleId);
  // Reputación
  updateReputation(winner, fight.titleId?12: result.method!=='Decisión'?6:3);
  updateReputation(loser, fight.titleId?-8:-3);
  // (El bono de Actuación de la Noche NO se concede aquí — se decide a nivel de evento en
  // finishEvent(), igual que Pelea de la Noche, para no premiar más de las 2 actuaciones que
  // reparte una cartelera real.)
  // Sponsors: pueden llegar o irse según reputación y resultado
  maybeUpdateSponsor(winner, true, result.method);
  maybeUpdateSponsor(loser, false, result.method);
  // Contrato: consumir una pelea del contrato de ambos peleadores
  [winner, loser].forEach(pf=>{
    if(!pf.contract) pf.contract = makeContract(generalScore(pf), pf.reputation);
    pf.contract.fightsLeft = Math.max(0, (pf.contract.fightsLeft||0)-1);
    if(pf.contract.fightsLeft<=0 && pf.status==='active' && !(STATE.pendingNegotiations||[]).some(n=>n.fighterId===pf.id)){
      if(!STATE.pendingNegotiations) STATE.pendingNegotiations=[];
      STATE.pendingNegotiations.push({fighterId:pf.id, rivalOfferSalary: computeRivalInterest(pf), eventSeqCreated: STATE.meta.eventSeq});
      logEvent(`💼 El contrato de ${fName(pf)} llega a su fin — hay que renegociar.`);
    }
  });
  // Rich toasts para eventos importantes
  if(winner.momentum>=5) richToast(`🔥 ${fName(winner)} encadena ${winner.momentum} victorias seguidas!`,'🔥','#82b1ff',3500);
  if(winner.record.losses===0 && winner.record.ufcLosses===0 && winner.record.wins>=5) richToast(`⚡ ${fName(winner)} sigue INVICTO (${winner.record.wins}-0)!`,'⚡','#a5d6a7',3500);
  [fA,fB].forEach(f=>{f.fightHistory.push(fight.id); f.lastEventSeq=ev.seq;});
  // 5. RIVALIDADES
  updateRivalry(fA.id, fB.id, ev.date);
  // Pelea de contendiente: el ganador obtiene cláusula de pelea por el título
  if(fight.isContender){
    const divTitle=STATE.titles.find(t=>t.divisionId===winner.division&&!t.isInterim&&!t.vacated);
    if(divTitle&&divTitle.holderId&&divTitle.holderId!==winner.id){
      if(!STATE.rematches) STATE.rematches={};
      STATE.rematches[winner.id]={opponentId:divTitle.holderId, type:'titleShot', date:ev.date};
      const champ=STATE.fighters.find(x=>x.id===divTitle.holderId);
      logEvent(`🥊 ${fName(winner)} gana la pelea de contendiente — Cláusula de contendiente vs ${champ?.name||'el campeón'}!`);
      richToast(`${fName(winner)} obtiene cláusula de contendiente para ${divName(winner.division)}!`,'🥊','#82b1ff',5000);
    }
  }
  // Nota: la cláusula de unificación para un nuevo campeón interino se crea más abajo, dentro
  // del bloque "Título" — ahí SÍ se comprueba primero si el ganador falló el peso (en cuyo caso
  // no hay campeón interino nuevo y no debe generarse ninguna cláusula). Antes había un bloque
  // duplicado aquí que se disparaba sin mirar el peso, creando una cláusula de unificación falsa
  // (y el toast de "nuevo campeón interino") incluso cuando el ganador no se hacía con el título
  // por no dar el peso.
  // Eliminar cláusula de revancha si estos dos peleadores acaban de usarla
  if(STATE.rematches){
    if(STATE.rematches[fA.id]?.opponentId===fB.id){ delete STATE.rematches[fA.id]; logEvent(`🔄 Cláusula de revancha consumida: ${fName(fA)} vs ${fB.name}.`); }
    if(STATE.rematches[fB.id]?.opponentId===fA.id){ delete STATE.rematches[fB.id]; logEvent(`🔄 Cláusula de revancha consumida: ${fName(fB)} vs ${fA.name}.`); }
  }
  // Título
  if(fight.titleId){
    const title=STATE.titles.find(t=>t.id===fight.titleId);
    if(!title) return; // título no encontrado (no debería ocurrir)

    const divId=title.divisionId;
    const isMainTitle=!title.isInterim;

    // ── PELEA INTERINA ──
    // El interino siempre se registra en el título PRINCIPAL de la división.
    // No se crea ningún objeto título nuevo. El título principal tiene
    // holderId (campeón) e interimHolderId (campeón interino) simultáneamente.
    if(fight.isInterim){
      const mainTitle = isMainTitle ? title : STATE.titles.find(t=>t.divisionId===divId&&!t.isInterim);
      if(!mainTitle) return;

      const prevInterim = mainTitle.interimHolderId;
      const missedId = fight.result && fight.result.missedWeight;

      // Regla real UFC sobre peso fallido en pelea de título: si quien falla el peso GANA el combate...
      if(missedId && winner.id===missedId){
        if(prevInterim && prevInterim!==winner.id){
          // El retador falla el peso y gana: el título interino NO cambia de manos, el campeón interino lo retiene
          const champ=STATE.fighters.find(x=>x.id===prevInterim);
          const reign=(champ?.titleReigns||[]).find(r=>r.titleId===mainTitle.id&&r.isInterim&&!r.lostDate);
          if(reign) reign.defenses=(reign.defenses||0)+1;
          logEvent(`⚖️ ${fName(winner)} falla el peso y gana, pero no puede arrebatar el título interino — ${fName(champ)} lo retiene por reglamento.`);
          richToast(`${fName(champ)} retiene el título interino: ${fName(winner)} falló el peso.`,'⚖️','#ffb300',5500);
        } else {
          // El propio campeón interino (o un título interino vacante) falla el peso y gana: queda VACANTE
          if(prevInterim){
            const pf=STATE.fighters.find(x=>x.id===prevInterim);
            const pr=(pf?.titleReigns||[]).find(r=>r.titleId===mainTitle.id&&r.isInterim&&!r.lostDate);
            if(pr) pr.lostDate=ev.date;
          }
          mainTitle.interimHolderId=null;
          logEvent(`⚖️ ${fName(winner)} gana pero falla el peso — el título interino de ${divName(divId)} queda VACANTE.`);
          richToast(`Título interino VACANTE: ${fName(winner)} falló el peso.`,'⚖️','#ffb300',5500);
        }
        return;
      }

      // DEFENSA del interino actual — igual que la defensa del título principal más abajo,
      // faltaba este caso: sin él, un interino que defiende con éxito no sumaba defensa alguna.
      if(winner.id===prevInterim){
        const reign=(winner.titleReigns||[]).find(r=>r.titleId===mainTitle.id&&r.isInterim&&!r.lostDate);
        if(reign) reign.defenses=(reign.defenses||0)+1;
        logEvent(`🛡️ ${fName(winner)} defiende el título interino de ${fName(mainTitle)} (defensa nº ${reign?.defenses||1}).`);
        return;
      }

      // Cerrar reinado interino anterior si lo hay
      if(prevInterim && prevInterim!==winner.id){
        const pf=STATE.fighters.find(x=>x.id===prevInterim);
        const pr=(pf?.titleReigns||[]).find(r=>r.titleId===mainTitle.id&&r.isInterim&&!r.lostDate);
        if(pr) pr.lostDate=ev.date;
      }

      mainTitle.interimHolderId=winner.id;
      winner.titleReigns=winner.titleReigns||[];
      const alreadyHas=(winner.titleReigns||[]).some(r=>r.titleId===mainTitle.id&&r.isInterim&&!r.lostDate);
      if(!alreadyHas){
        winner.titleReigns.push({titleId:mainTitle.id,titleName:mainTitle.name,divisionId:mainTitle.divisionId,wonDate:ev.date,lostDate:null,defenses:0,isInterim:true});
        mainTitle.history.push({fighterId:winner.id,wonEventId:ev.id,wonDate:ev.date,isInterim:true});
        logEvent(`🥈 ${fName(winner)} es el nuevo campeón interino de ${fName(mainTitle)}!`);
        richToast(`¡${fName(winner)} es el nuevo campeón interino de ${divName(divId)}!`,'🥈','#90caf9',5000);
      }
      // Cláusula de unificación
      if(mainTitle.holderId && mainTitle.holderId!==winner.id){
        if(!STATE.rematches) STATE.rematches={};
        STATE.rematches[winner.id]={opponentId:mainTitle.holderId,type:'unification',titleId:mainTitle.id,date:ev.date};
        const champ=STATE.fighters.find(x=>x.id===mainTitle.holderId);
        logEvent(`🏆 Cláusula de unificación activa: ${fName(winner)} vs ${champ?.name||'el campeón'}.`);
        richToast(`${fName(winner)} es campeón interino — debe unificar vs ${champ?.name||'el campeón'}!`,'🏆','#ffd700',6000);
      }
      return;
    }

    // ── PELEA INDISCUTIDA (o UNIFICACIÓN) ──
    const prevHolder=title.holderId;
    const prevInterim=title.interimHolderId;
    const missedId = fight.result && fight.result.missedWeight;

    // Regla real UFC sobre peso fallido en pelea de título: si quien falla el peso GANA el combate,
    // no puede ganar/retener el título como si nada — o bien el campeón lo retiene, o bien queda vacante.
    if(missedId && winner.id===missedId){
      if(prevHolder && prevHolder!==winner.id){
        // El retador falla el peso y gana: el título NO cambia de manos, el campeón lo retiene
        const champ=STATE.fighters.find(x=>x.id===prevHolder);
        const reign=(champ?.titleReigns||[]).find(r=>r.titleId===title.id&&!r.isInterim&&!r.lostDate);
        if(reign) reign.defenses=(reign.defenses||0)+1;
        logEvent(`⚖️ ${fName(winner)} falla el peso y gana, pero no puede arrebatar el título — ${fName(champ)} lo retiene por reglamento.`);
        richToast(`${fName(champ)} retiene ${fName(title)}: ${fName(winner)} falló el peso.`,'⚖️','#ffb300',5500);
      } else {
        // El propio campeón (o un título vacante) falla el peso y gana: el título queda VACANTE
        if(prevHolder){
          const pf=STATE.fighters.find(x=>x.id===prevHolder);
          const pr=(pf?.titleReigns||[]).find(r=>r.titleId===title.id&&!r.isInterim&&!r.lostDate);
          if(pr) pr.lostDate=ev.date;
        }
        title.holderId=null;
        logEvent(`⚖️ ${fName(winner)} gana pero falla el peso — ${fName(title)} queda VACANTE.`);
        richToast(`¡${fName(title)} queda VACANTE! ${fName(winner)} falló el peso.`,'⚖️','#ffb300',5500);
      }
      return;
    }

    // DEFENSA del campeón actual
    if(winner.id===prevHolder){
      const reign=(winner.titleReigns||[]).find(r=>r.titleId===title.id&&!r.isInterim&&!r.lostDate);
      if(reign) reign.defenses=(reign.defenses||0)+1;
      logEvent(`🛡️ ${fName(winner)} defiende ${fName(title)} (defensa nº ${reign?.defenses||1}).`);
      // Unificación: campeón principal derrota al interino → limpiar interino
      if(prevInterim===loser.id){
        const lr=(loser.titleReigns||[]).find(r=>r.titleId===title.id&&r.isInterim&&!r.lostDate);
        if(lr) lr.lostDate=ev.date;
        title.interimHolderId=null;
        logEvent(`🥈 ${fName(loser)} pierde el cinturón interino. Queda un solo campeón en ${divName(divId)}.`);
        richToast(`¡${fName(winner)} unifica! Solo queda un campeón de ${divName(divId)}.`,'👑','#d4af37',5000);
      }
      return;
    }

    // CAMBIO DE CAMPEÓN
    // 1) Cerrar reinado del poseedor anterior
    if(prevHolder){
      const pf=STATE.fighters.find(x=>x.id===prevHolder);
      const pr=(pf?.titleReigns||[]).find(r=>r.titleId===title.id&&!r.isInterim&&!r.lostDate);
      if(pr) pr.lostDate=ev.date;
    }

    // 2) Unificación: ganador era el interino → cerrar su reinado interino
    if(prevInterim===winner.id){
      const ir=(winner.titleReigns||[]).find(r=>r.titleId===title.id&&r.isInterim&&!r.lostDate);
      if(ir) ir.lostDate=ev.date;
      title.interimHolderId=null;
      logEvent(`🏆 ${fName(winner)} unifica — deja de ser interino y pasa a campeón indiscutido.`);
    }

    // 3) Unificación: perdedor era el interino → cerrar su reinado interino
    if(prevInterim===loser.id){
      const lr=(loser.titleReigns||[]).find(r=>r.titleId===title.id&&r.isInterim&&!r.lostDate);
      if(lr) lr.lostDate=ev.date;
      title.interimHolderId=null;
      logEvent(`🥈 ${fName(loser)} pierde el cinturón interino. Queda un solo campeón.`);
      richToast(`¡${fName(winner)} unifica el título de ${divName(divId)}! Solo queda un campeón.`,'👑','#d4af37',5000);
    }

    // 4) Asignar el cinturón al nuevo campeón
    title.holderId=winner.id;
    winner.titleReigns=winner.titleReigns||[];
    const alreadyHasReign=(winner.titleReigns||[]).some(r=>r.titleId===title.id&&!r.isInterim&&!r.lostDate);
    if(!alreadyHasReign){
      winner.titleReigns.push({titleId:title.id,titleName:title.name,divisionId:title.divisionId,wonDate:ev.date,lostDate:null,defenses:0,isInterim:false});
      title.history.push({fighterId:winner.id,wonEventId:ev.id,wonDate:ev.date,isInterim:false});
      logEvent(`👑 ${fName(winner)} se proclama campeón de ${fName(title)}!`);
      richToast(`¡Nuevo campeón! ${fName(winner)} gana ${fName(title)}!`,'👑','#d4af37',5000);
    }

    // Cláusula de revancha al ex-campeón
    if(prevHolder){
      const prevChamp=STATE.fighters.find(x=>x.id===prevHolder);
      if(prevChamp && prevChamp.status!=='retired'){
        const wantsRematch=confirm(`${fName(prevChamp)} ha perdido el ${fName(title)} vs ${winner.name}.\n\n¿Añadir cláusula de revancha?`);
        if(wantsRematch){
          if(!STATE.rematches) STATE.rematches={};
          STATE.rematches[prevHolder]={opponentId:winner.id,type:'rematch',titleId:title.id,date:ev.date};
          logEvent(`🔄 Cláusula de revancha: ${fName(prevChamp)} vs ${fName(winner)} por ${title.name}.`);
        }
      }
    }
  }
  applyPostFightWearAndInjury(winner,true,result.method,ev.date);
  applyPostFightWearAndInjury(loser,false,result.method,ev.date);
  // Actualizar daño de chin acumulado si fue KO/TKO
  if(result.method==='KO/TKO'){
    if(loser.chinDamage==null) loser.chinDamage=0;
    loser.chinDamage = Math.min(loser.chinDamage + randi(2,4), 30);
  }
  // Si el combate nació de un callout, el perdedor tiene una probabilidad de pedir la
  // revancha (nuevo callout con los roles invertidos) — mucho más alta tras una decisión
  // reñida/polémica que tras un finish contundente, y nula si queda lesionado o se retira.
  let revengeRequested=false;
  if(fight.isCallout && loser.status==='active'){
    const revengeProb = result.method!=='Decisión' ? 0.1 : (result.decType==='Unánime' ? 0.3 : 0.6);
    if(Math.random()<revengeProb){
      if(!STATE.callouts) STATE.callouts=[];
      const alreadyInvolved = STATE.callouts.some(c=>c.callerId===loser.id||c.targetId===loser.id);
      if(!alreadyInvolved){
        STATE.callouts.push({id:uid('CO'), callerId:loser.id, targetId:winner.id, divisionId:loser.division, eventSeqIssued:STATE.meta.eventSeq});
        logEvent(`📣 ${fName(loser)} pide la revancha tras perder vs ${fName(winner)}.`);
        revengeRequested=true;
      }
    }
  }
  generateResultNews(fight, winner, loser, result, ev, revengeRequested);
  // Registrar knockdowns en el récord narrativo
  if(result.knockdownsA>0) logEvent(`⚡ ${fName(winner)} tumbó a ${fName(loser)} ${result.knockdownsA}x en este combate.`);
  if(result.knockdownsB>0) logEvent(`⚡ ${fName(loser)} tumbó a ${fName(winner)} ${result.knockdownsB}x pero no ganó el combate.`);
  // Guardar snapshot de stats y verificar hitos
  saveStatSnapshot(winner, ev.date, ev.name);
  saveStatSnapshot(loser, ev.date, ev.name);
  checkMilestones(winner, ev);
  logEvent(`🥊 ${fName(winner)} derrota a ${fName(loser)} por ${methodLabel(result)} (R${result.round}, ${result.time})`);
}

function giveAwardsForYear(awardYear){
  if(!STATE.awards) STATE.awards=[];
  if(STATE.awards.some(a=>a.year===awardYear)) return; // ya entregados
  const yearFights = STATE.events
    .filter(e=>e.status==='completed' && parseInt((e.date||'').slice(0,4))===awardYear)
    .flatMap(e=>e.card.filter(ft=>ft.result));
  if(yearFights.length < 2) { STATE.meta.lastAwardYear=awardYear; return; }

  // Pelea del Año
  const fotyCands = yearFights.filter(ft=>ft.result.isFOTN);
  let fotyFight=null;
  if(fotyCands.length){
    fotyFight=fotyCands[Math.floor(Math.random()*fotyCands.length)];
    const fw=STATE.fighters.find(x=>x.id===fotyFight.result.winnerId), fl=STATE.fighters.find(x=>x.id===fotyFight.result.loserId);
    if(fw&&fl){
      if(!fw.bonuses.fightOfYear)fw.bonuses.fightOfYear=0; fw.bonuses.fightOfYear++;
      if(!fl.bonuses.fightOfYear)fl.bonuses.fightOfYear=0; fl.bonuses.fightOfYear++;
      fw.bonuses.lastFightOfYear=`${fName(fl)} (${awardYear})`; fl.bonuses.lastFightOfYear=`${fName(fw)} (${awardYear})`;
      updateReputation(fw,8); updateReputation(fl,8); // ganar y ser protagonista de la Pelea del Año da fama a los dos
      logEvent(`🏅 Pelea del Año ${awardYear}: ${fName(fw)} vs ${fName(fl)}`);
      richToast(`🏅 Pelea del Año ${awardYear}: ${fName(fw)} vs ${fName(fl)}!`,'🏅','#ffd700',5000);
    }
  }
  // Actuación del Año
  const potyFight = yearFights.filter(ft=>ft.result.isPOTN).sort(()=>Math.random()-0.5)[0];
  if(potyFight){
    const pw=STATE.fighters.find(x=>x.id===potyFight.result.winnerId);
    if(pw){
      if(!pw.bonuses.performanceOfYear)pw.bonuses.performanceOfYear=0; pw.bonuses.performanceOfYear++;
      pw.bonuses.lastPerformanceOfYear=String(awardYear);
      updateReputation(pw,8);
      logEvent(`⭐ Actuación del Año ${awardYear}: ${fName(pw)}`);
      richToast(`⭐ Actuación del Año ${awardYear}: ${fName(pw)}!`,'⭐','#ffd700',4500);
    }
  }
  // KO del Año
  const koFights = yearFights.filter(ft=>ft.result.method==='KO/TKO');
  let koW=null;
  if(koFights.length){
    koW=koFights.slice().sort((a,b)=>{
      const t=f=>{const[m,s]=(f.result.time||'5:00').split(':');return(f.result.round-1)*300+parseInt(m)*60+parseInt(s||0);};
      return t(a)-t(b)+Math.random()*60;
    })[0];
    const kw=STATE.fighters.find(x=>x.id===koW.result.winnerId), kl=STATE.fighters.find(x=>x.id===koW.result.loserId);
    if(kw&&kl){
      if(!kw.bonuses.koOfYear)kw.bonuses.koOfYear=0; kw.bonuses.koOfYear++;
      kw.bonuses.lastKoOfYear=`vs ${fName(kl)} (${awardYear}) R${koW.result.round} ${koW.result.time}`;
      updateReputation(kw,8);
      logEvent(`💥 KO del Año ${awardYear}: ${fName(kw)} def. ${fName(kl)} R${koW.result.round}`);
      richToast(`💥 KO del Año ${awardYear}: ${fName(kw)}!`,'💥','#ef5350',4000);
    }
  }
  // Sumisión del Año
  const subFights = yearFights.filter(ft=>ft.result.method==='Sumisión');
  let subW=null;
  if(subFights.length){
    subW=subFights[Math.floor(Math.random()*subFights.length)];
    const sw=STATE.fighters.find(x=>x.id===subW.result.winnerId), sl=STATE.fighters.find(x=>x.id===subW.result.loserId);
    if(sw&&sl){
      if(!sw.bonuses.subOfYear)sw.bonuses.subOfYear=0; sw.bonuses.subOfYear++;
      sw.bonuses.lastSubOfYear=`vs ${fName(sl)} (${awardYear}) R${subW.result.round} ${subW.result.time}`;
      updateReputation(sw,8);
      logEvent(`🤼 Sumisión del Año ${awardYear}: ${fName(sw)} def. ${fName(sl)}`);
      richToast(`🤼 Sumisión del Año ${awardYear}: ${fName(sw)}!`,'🤼','#ce93d8',4000);
    }
  }
  // Peleador del Año
  const yearWins={};
  yearFights.forEach(ft=>{
    const w=ft.result.winnerId; if(!w) return;
    if(!yearWins[w]) yearWins[w]=0;
    yearWins[w]+=3;
    if(ft.titleId) yearWins[w]+=5;
    if(ft.result.method!=='Decisión') yearWins[w]+=2;
  });
  const fotyId=Object.entries(yearWins).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const fotyF=fotyId&&STATE.fighters.find(x=>x.id===fotyId);
  if(fotyF){
    if(!fotyF.bonuses.fighterOfYear)fotyF.bonuses.fighterOfYear=0;
    fotyF.bonuses.fighterOfYear++;
    fotyF.bonuses.lastFighterOfYear=awardYear;
    updateReputation(fotyF,15); // el máximo honor de la temporada es el que más fama da
    logEvent(`🏆 Peleador del Año ${awardYear}: ${fName(fotyF)}`);
    richToast(`🏆 Peleador del Año ${awardYear}: ${fName(fotyF)}!`,'🏆','#d4af37',6000);
  }
  // Sorpresa del Año: la mayor diferencia de nivel a favor del PERDEDOR sobre el papel — el
  // ganador era claramente el peor puesto sobre el papel y aun así se llevó la victoria.
  let upsetFight=null, upsetDiff=3; // umbral mínimo para que cuente como sorpresa real
  yearFights.forEach(ft=>{
    const w=STATE.fighters.find(x=>x.id===ft.result.winnerId), l=STATE.fighters.find(x=>x.id===ft.result.loserId);
    if(!w||!l) return;
    const diff=overallRating(l)-overallRating(w);
    if(diff>upsetDiff){ upsetDiff=diff; upsetFight=ft; }
  });
  if(upsetFight){
    const uw=STATE.fighters.find(x=>x.id===upsetFight.result.winnerId), ul=STATE.fighters.find(x=>x.id===upsetFight.result.loserId);
    if(uw&&ul){
      if(!uw.bonuses.upsetOfYear) uw.bonuses.upsetOfYear=0; uw.bonuses.upsetOfYear++;
      uw.bonuses.lastUpsetOfYear=`vs ${fName(ul)} (${awardYear})`;
      updateReputation(uw,10); // dar la sorpresa del año también hace fama
      logEvent(`😱 Sorpresa del Año ${awardYear}: ${fName(uw)} sorprende a ${fName(ul)}`);
      richToast(`😱 Sorpresa del Año ${awardYear}: ${fName(uw)}!`,'😱','#ff7043',5000);
    }
  }
  // Decepción del Año: la pelea con más expectación (título o entre los más famosos) que acabó
  // en la decisión unánime más sosa del año — sin premio ni fama para nadie, es solo la cruz
  // narrativa de la ceremonia (para que no todo sean noticias buenas).
  const dudCands = yearFights.filter(ft=>ft.result.method==='Decisión' && ft.result.decType==='Unánime');
  let dudFight=null;
  if(dudCands.length){
    const hypeOf=ft=>{
      const a=STATE.fighters.find(x=>x.id===ft.fighterA), b=STATE.fighters.find(x=>x.id===ft.fighterB);
      return (ft.titleId?50:0)+(a?.reputation||50)+(b?.reputation||50);
    };
    dudFight=dudCands.slice().sort((a,b)=>hypeOf(b)-hypeOf(a))[0];
  }
  STATE.awards.push({year:awardYear,
    fighterOfYear:fotyId||null,
    fightOfYear:fotyFight?{fA:fotyFight.fighterA,fB:fotyFight.fighterB}:null,
    // fA/fB = ganador/perdedor (NO las esquinas del combate) — usar fighterA/fighterB del combate
    // habría atribuido el KO/sumisión al peleador equivocado la mitad de las veces.
    koOfYear:koW?{fA:koW.result.winnerId,fB:koW.result.loserId,round:koW.result.round,time:koW.result.time}:null,
    subOfYear:subW?{fA:subW.result.winnerId,fB:subW.result.loserId,round:subW.result.round,time:subW.result.time}:null,
    performanceOfYear:potyFight?{fA:potyFight.fighterA,fB:potyFight.fighterB}:null,
    upsetOfYear:upsetFight?{fA:upsetFight.result.winnerId,fB:upsetFight.result.loserId}:null,
    dudOfYear:dudFight?{fA:dudFight.fighterA,fB:dudFight.fighterB}:null,
  });
  STATE.meta.lastAwardYear=awardYear;
  return true;
}

/* ====================== CEREMONIA DE PREMIOS (modal) ====================== */
// Se llama al cerrar el resumen del evento — si se acaban de repartir premios de algún
// año, encadena la ceremonia (una pantalla por año) antes de volver al juego.
function closeEventSummaryAndMaybeShowAwards(evId){
  document.getElementById('modalRoot').innerHTML='';
  const ev = STATE.events.find(x=>x.id===evId);
  const years = (ev&&ev._newAwardYears)||[];
  if(ev) ev._newAwardYears=[];
  if(years.length) showAwardsCeremonyQueue(years.slice());
}
function showAwardsCeremonyQueue(years){
  if(!years.length){ document.getElementById('modalRoot').innerHTML=''; return; }
  const year = years.shift();
  openAwardsCeremony(year, ()=>showAwardsCeremonyQueue(years));
}
function openAwardsCeremony(year, onClose){
  const a = (STATE.awards||[]).find(x=>x.year===year);
  if(!a){ if(onClose) onClose(); return; }
  const fOf = a.fighterOfYear && STATE.fighters.find(x=>x.id===a.fighterOfYear);
  const row = (icon, label, color, content) => content ? `
    <div style="display:flex;align-items:center;gap:12px;background:#0d0d0d;border:1px solid #1e1e1e;border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="font-size:1.8rem">${icon}</div>

  const nameOf = id => { const f=STATE.fighters.find(x=>x.id===id); return f?fName(f):'?'; };
  const fotyHtml = row('🏆','Peleador del Año','#d4af37', fOf?fName(fOf):null);

  const potyHtml = row('⭐','Actuación del Año','#82b1ff', a.performanceOfYear?`${nameOf(a.performanceOfYear.fA)} vs ${nameOf(a.performanceOfYear.fB)}`:null);
  const upsetHtml = row('😱','Sorpresa del Año','#ff7043', a.upsetOfYear?`${nameOf(a.upsetOfYear.fA)} sorprende a ${nameOf(a.upsetOfYear.fB)}`:null);
  const dudHtml = row('😴','Decepción del Año','#78909c', a.dudOfYear?`${nameOf(a.dudOfYear.fA)} vs ${nameOf(a.dudOfYear.fB)} — la pelea más hypeada que decepcionó`:null);
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-bg" id="modalBg">
    <div class="modal" style="max-width:480px;text-align:center">
      <div style="background:linear-gradient(90deg,#7a5c00,#d4af37,#7a5c00);color:#1a1300;font-weight:900;padding:12px;border-radius:10px;margin-bottom:14px;font-size:1.1rem;letter-spacing:.5px">
        🏆 CEREMONIA DE PREMIOS ${year}
      </div>
      ${fOf?`<div style="margin-bottom:10px">${avatarHtml(fOf,72)}</div>`:''}
      <div style="text-align:left">
        ${fotyHtml}${fightHtml}${koHtml}${subHtml}${potyHtml}${upsetHtml}${dudHtml}
      </div>
      <button class="btn primary full" id="awardsCeremonyNext" style="margin-top:8px;padding:12px">Continuar →</button>
